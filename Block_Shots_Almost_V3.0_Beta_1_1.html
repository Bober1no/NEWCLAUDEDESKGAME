<html lang="en">

    position: fixed;

    z-index: -1; /* keep it behind the game */

    <script>

        // ---- STARFIELD ----
const starCanvas = document.getElementById("starfield");
const starCtx = starCanvas.getContext("2d");
starCanvas.width = window.innerWidth;
starCanvas.height = window.innerHeight;

window.starBrightness = 1.0;      // normal brightness
window.targetBrightness = 1.0;    // where it should go
window.brightnessDecay = 0.05;    // how quickly it eases back (tweak for smoothness)

// ---- BOSS VIGNETTE SYSTEM ----
window.vignetteIntensity = 0.0;    // current vignette strength
window.vignetteTargetIntensity = 0.0; // target intensity to fade towards
window.vignetteTransitionRate = 0.02; // how quickly it transitions (higher = faster)
window.vignetteDecayRate = 0.02; // how quickly vignette decays when not active
window.vignetteColor = [0, 0, 0];  // RGB color for vignette

class Star {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = Math.random() * starCanvas.width;
        this.y = Math.random() * starCanvas.height;
        this.size = Math.random() * 1.6 + 0.6;
        this.baseAlpha = 0.3 + Math.random() * 0.7; // base brightness
        this.twinkleSpeed = 0.002 + Math.random() * 0.003; // twinkle rate
        this.offset = Math.random() * Math.PI * 2; // phase shift
        this.speed = 0.05 + Math.random() * 0.05; // downward drift
    }
    update() {
        this.y += this.speed;
        if (this.y > starCanvas.height) {
            this.reset();
            this.y = 0; // reappear at top
        }
    }
    draw(ctx, time) {
    let alpha = this.baseAlpha + Math.sin(time * this.twinkleSpeed + this.offset) * 0.3;
    if (alpha < 0) alpha = 0;

    alpha *= window.starBrightness; // 🔥 apply global brightness multiplier

    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
}


}

let stars = [];
for (let i = 0; i < 150; i++) {
    stars.push(new Star());
}

function drawStars(time) {
    starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);

    // Smooth easing once per frame
    window.starBrightness += (window.targetBrightness - window.starBrightness) * window.brightnessDecay;
    
    // Reset target brightness back to normal after reaching peak
    if (window.targetBrightness > 1.0 && Math.abs(window.starBrightness - window.targetBrightness) < 0.1) {
        window.targetBrightness = 1.0;
    }

    for (let s of stars) {
        s.update();
        s.draw(starCtx, time);
    }

    // Update vignette target based on boss status
    let bossAlive = false;
    if (window.gameInstance) {
        bossAlive = window.gameInstance.enemies.some(e => e.etype === 'artillery' || e.etype === 'miner' || e.nemBoss);
    }

    // Set target intensity based on boss status
    if (!bossAlive) {
        window.vignetteTargetIntensity = 0.0; // Fade out when no boss
    }
    
    // Smoothly transition towards target intensity
    window.vignetteIntensity += (window.vignetteTargetIntensity - window.vignetteIntensity) * window.vignetteTransitionRate;

    // Draw boss vignette on starfield
    if (window.vignetteIntensity > 0.001) {
        let centerX = starCanvas.width / 2;
        let centerY = starCanvas.height / 2;
        let maxRadius = Math.sqrt(centerX * centerX + centerY * centerY);
        
        let gradient = starCtx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius);
        gradient.addColorStop(0, 'rgba(0,0,0,0)'); // Transparent center
        gradient.addColorStop(0.4, 'rgba(0,0,0,0)'); // Still transparent at 60%
        gradient.addColorStop(1, `rgba(${window.vignetteColor[0]},${window.vignetteColor[1]},${window.vignetteColor[2]},${window.vignetteIntensity})`);
        
        starCtx.fillStyle = gradient;
        starCtx.fillRect(0, 0, starCanvas.width, starCanvas.height);
    }

    requestAnimationFrame(drawStars);
}

requestAnimationFrame(drawStars);

// Handle resizing
window.addEventListener("resize", () => {
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;
    stars.forEach(s => s.reset());
});

                return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random());
            };
            // Later cycles get messier: by then depth scaling and scars carry the
            // difficulty, so the order may as well stop behaving.
            let sigma = 1.15 + 0.55 * cycleIndex;
            let keyed = NEM_ORDER.map(k => {
                let m = NEM_BOSS_META[k];
                // Heavier weight => earlier/more often; lighter => hangs back.
                return { k: k, key: m.threat + (1 - m.weight) * 0.6 + gauss() * sigma };
            });
            keyed.sort((a, b) => a.key - b.key);
            let out = keyed.map(e => e.k);

            // Opening cycle only: a fresh board with no turrets can't answer a
            // HIVEMIND or a COLOSSUS, so cap the first two slots and swap the
            // offender back for the earliest boss that fits.
            if (cycleIndex === 0) {
                for (let slot = 0; slot < NEM_OPENER_CAPS.length; slot++) {
                    if (NEM_BOSS_META[out[slot]].threat <= NEM_OPENER_CAPS[slot]) continue;
                    for (let j = slot + 1; j < out.length; j++) {
                        if (NEM_BOSS_META[out[j]].threat <= NEM_OPENER_CAPS[slot]) {
                            let tmp = out[slot]; out[slot] = out[j]; out[j] = tmp;
                            break;
                        }
                    }
                }
            }
            return out;
        }

function drawVignette(ctx, canvasWidth, canvasHeight) {
    if (window.vignetteIntensity <= 0.001) return; // Skip if too faint
    
    // Create radial gradient from center to edges
    let centerX = canvasWidth / 2;
    let centerY = canvasHeight / 2;
    let maxRadius = Math.sqrt(centerX * centerX + centerY * centerY);
    
    let gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius);
    gradient.addColorStop(0, 'rgba(0,0,0,0)'); // Transparent center
    gradient.addColorStop(0.6, 'rgba(0,0,0,0)'); // Still transparent at 60%
    gradient.addColorStop(1, `rgba(${window.vignetteColor[0]},${window.vignetteColor[1]},${window.vignetteColor[2]},${window.vignetteIntensity})`);
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    
    // Slowly fade the vignette
    // Only fade the vignette if no boss is currently alive
let bossAlive = false;
if (window.gameInstance) {

function drawText(ctx, text, x, y, fontSize=FONT_SMALL_SIZE, color=WHITE) {
            ctx.save();

        function neonRect(ctx, x, y, w, h, color, border=2, glowIntensity = 6) {
            let [r, g, b] = color;
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, ctx.canvas.width, ctx.canvas.height);
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + h);
            ctx.lineTo(x + w, y + h);
            ctx.lineTo(x + w, y);
            ctx.closePath();
            ctx.clip("evenodd");
            for (let i = glowIntensity; i >= 2; i--) {
                let alpha = (7 * i) / 255;
                ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                ctx.fillRect(x - i, y - i, w + 2 * i, h + 2 * i);
            }
            ctx.restore();
            ctx.strokeStyle = `rgb(${r},${g},${b})`;
            ctx.lineWidth = border;
            ctx.strokeRect(x, y, w, h);
        }

        function drawRoundedRect(ctx, x, y, w, h, radius) {
            if (w < 2 * radius) radius = w / 2;
            if (h < 2 * radius) radius = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
            return ctx;
        }

        function neonRoundedRect(ctx, x, y, w, h, color, radius, border=2, glowIntensity = 6) {
            let [r, g, b] = color;
            ctx.save();
            // Draw the glow by drawing multiple larger, transparent, filled rectangles
            for (let i = glowIntensity; i >= 1; i--) {
                let alpha = (glowIntensity - i + 1) * 0.025; // Adjust alpha for a soft glow
                ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                drawRoundedRect(ctx, x - i, y - i, w + 2 * i, h + 2 * i, radius + i);
                ctx.fill();
            }
            ctx.restore();

            // Draw the main border on top
            ctx.strokeStyle = `rgb(${r},${g},${b})`;
            ctx.lineWidth = border;
            drawRoundedRect(ctx, x, y, w, h, radius);
            ctx.stroke();
        }

// NEW: Function to draw three overlapping mortar blocks icon with correct L-shape
function drawDuplicatorIcon(ctx, x, y, size, color) {
    let [r, g, b] = color;
    let baseAlpha = 0.7; // Make icon more transparent
    
    let blockSize = size * 0.15; // Individual cell size
    let spacingMultiplier = 1.8; // CHANGE THIS VALUE to adjust spacing (1.0 = touching, higher = more spaced)
    let spacing = blockSize * spacingMultiplier;
    
    // Rest of the function stays the same...
    let positions = [
        [x + size * 0.1, y + size * 0.1],
        [x + size * 0.1 + spacing, y + size * 0.1 + spacing],
        [x + size * 0.1 + spacing * 2, y + size * 0.1 + spacing * 2]
    ];
    
    for (let i = 0; i < positions.length; i++) {
        let [px, py] = positions[i];
        let alpha = baseAlpha - (i * 0.15); // Make back pieces more transparent
        
        // Draw the L-shape: 2 blocks horizontally at bottom, 2 blocks vertically at right
        // This creates the proper L-shape like in Tetris
        let lBlocks = [
            [px + blockSize, py + blockSize * 2],     // Bottom center
            [px + blockSize * 2, py + blockSize * 2], // Bottom right
            [px + blockSize * 2, py + blockSize],     // Middle right
            [px + blockSize * 2, py]                  // Top right
        ];
        
        for (let blockPos of lBlocks) {
            let [bx, by] = blockPos;
            
            // Fill each block
            ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
            ctx.fillRect(bx, by, blockSize, blockSize);
            
            // Outline each block
            ctx.strokeStyle = `rgba(${r},${g},${b},${alpha + 0.3})`;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(bx, by, blockSize, blockSize);
            
            // Add highlight for 3D effect
            ctx.fillStyle = `rgba(${Math.min(255, r + 50)},${Math.min(255, g + 50)},${Math.min(255, b + 50)},${alpha * 0.4})`;
            ctx.fillRect(bx, by, 2, blockSize); // Left highlight
            ctx.fillRect(bx, by, blockSize, 2); // Top highlight
        }
    }
}

// NEW: Function to draw lazer strike icon (targeting reticle with laser beam)
function drawLazerStrikeIcon(ctx, x, y, size, color) {
    let [r, g, b] = color;
    ctx.save(); // contain all state changes (incl. globalAlpha) so they don't leak to the caller
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.lineWidth = 2;
    
    // Draw targeting reticle (circle with crosshairs)
    let centerX = x + size / 2;
    let centerY = y + size * 0.7;
    let reticleRadius = size * 0.15;
    
    // Outer targeting circle
    ctx.beginPath();
    ctx.arc(centerX, centerY, reticleRadius, 0, Math.PI * 2);
    ctx.stroke();
    
    // Crosshairs
    ctx.beginPath();
    ctx.moveTo(centerX - reticleRadius * 0.7, centerY);
    ctx.lineTo(centerX + reticleRadius * 0.7, centerY);
    ctx.moveTo(centerX, centerY - reticleRadius * 0.7);
    ctx.lineTo(centerX, centerY + reticleRadius * 0.7);
    ctx.stroke();
    
    // Laser beam coming from top
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(centerX, y);
    ctx.lineTo(centerX, centerY - reticleRadius);
    ctx.stroke();
    
    // Small glow effect on laser beam
    ctx.lineWidth = 6;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.moveTo(centerX, y);
    ctx.lineTo(centerX, centerY - reticleRadius);
    ctx.stroke();
    ctx.restore();
}

        const META_BY_ID = {};

        // ---- Persistence (localStorage; this runs as a real local file) ----
        const META_SAVE_KEY = 'blockshots_meta_v2';
        function defaultMeta() {
            return { version:2, cores:0, ownedNodes:[], keystone:null, focusArm:null,
                     stats:{ bestWave:0, totalRuns:0, timesReforged:0, undosUsed:0, bestNemDepth:0 } };
        }
        function loadMeta() {
            try {
                let raw = localStorage.getItem(META_SAVE_KEY);
                if (!raw) return defaultMeta();
                let d = JSON.parse(raw);
                if (!d || d.version !== 2) return defaultMeta(); // version mismatch -> fresh (migrate later)
                let m = defaultMeta();
                m.cores = (typeof d.cores === 'number' && d.cores >= 0) ? d.cores : 0;
                m.ownedNodes = Array.isArray(d.ownedNodes) ? d.ownedNodes.filter(id => META_BY_ID[id]) : [];
                m.keystone = META_BY_ID[d.keystone] ? d.keystone : null;
                m.focusArm = ['mun', 'tmp', 'for', 'sal'].includes(d.focusArm) ? d.focusArm : null;
                if (d.stats) {
                    m.stats.bestWave = d.stats.bestWave || 0;
                    m.stats.totalRuns = d.stats.totalRuns || 0;
                    m.stats.timesReforged = d.stats.timesReforged || 0;
                    m.stats.undosUsed = d.stats.undosUsed || 0;
                    m.stats.bestNemDepth = d.stats.bestNemDepth || 0; // NEMESIS: deepest boss killed
                }
                return m;
            } catch (e) { return defaultMeta(); }
        }
        function saveMeta(m) { try { localStorage.setItem(META_SAVE_KEY, JSON.stringify(m)); } catch (e) {} }
        function exportMeta(m) { try { return btoa(JSON.stringify(m)); } catch (e) { return ''; } }
        function importMeta(str) { try { let m = JSON.parse(atob(str)); return (m && m.version === 2) ? m : null; } catch (e) { return null; } }

        // ---- Turn owned node ids into numeric in-run bonuses ----
        function computeMetaBonuses(ownedIds) {
            let a = { dmg:0, fire:0, scrap:0, cost:0, mrange:0, killscrap:0, gridref:0, jackpot:0, liq:0, move:0,
                      grav:0, gridscore:0, block:0, espeed:0, slowstr:0, slowrad:0, picket:0, secondwind:0 };
            for (let id of ownedIds) {
                let n = META_BY_ID[id];
                if (!n || !n.fx) continue;
                for (let k in n.fx) a[k] = (a[k] || 0) + n.fx[k];
            }
            return {
                turretDmgMult:    Math.max(0.1, 1 + a.dmg),
                fireRateMult:     Math.max(1, 1 + a.fire),
                scrapMult:        Math.max(0.1, 1 + a.scrap),
                abilityCostMult:  Math.max(0.5, 1 + a.cost),
                mortarRange:      Math.round(a.mrange),
                killScrapBonus:   Math.round(a.killscrap),
                gridShiftRefund:  Math.round(a.gridref),
                jackpotMult:      1 + a.jackpot,
                liqPer500:        a.liq,
                moveCoolMult:     Math.max(0.6, 1 + a.move),
                gravityMult:      Math.max(0.3, 1 + a.grav),
                gridScoreMult:    Math.max(0.1, 1 + a.gridscore),
                enemyBlockDmgMult:Math.max(0.2, 1 + a.block),
                enemySpeedMult:   Math.max(0.4, 1 + a.espeed),
                slowStrengthMult: Math.max(0.1, 1 + a.slowstr),
                slowRadiusBonus:  Math.round(a.slowrad),
                picketDmg:        a.picket,
                secondWind:       a.secondwind > 0
            };
        }

        // Draws a small vector emblem inside a skill node, matching the game's icon style.
        function drawSkillIcon(ctx, type, cx, cy, r, color) {
            let [rr, gg, bb] = color;
            ctx.save();
            ctx.strokeStyle = `rgb(${rr},${gg},${bb})`;
            ctx.fillStyle = `rgb(${rr},${gg},${bb})`;
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            let s = r * 0.55;
            if (type === 'gem') {
                ctx.beginPath();
                ctx.moveTo(cx, cy - s);
                ctx.lineTo(cx + s, cy);
                ctx.lineTo(cx, cy + s);
                ctx.lineTo(cx - s, cy);
                ctx.closePath();
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s, cy);
                ctx.moveTo(cx, cy - s); ctx.lineTo(cx, cy + s);
                ctx.globalAlpha = 0.6; ctx.stroke(); ctx.globalAlpha = 1;
            } else if (type === 'chevron' || type === 'chevron2') {
                let n = (type === 'chevron2') ? 2 : 1;
                for (let i = 0; i < n; i++) {
                    let ox = cx - s * 0.5 + i * s * 0.9;
                    ctx.beginPath();
                    ctx.moveTo(ox - s * 0.4, cy - s * 0.7);
                    ctx.lineTo(ox + s * 0.5, cy);
                    ctx.lineTo(ox - s * 0.4, cy + s * 0.7);
                    ctx.stroke();
                }
            } else if (type === 'tag') {
                ctx.beginPath();
                ctx.arc(cx - s * 0.35, cy - s * 0.35, s * 0.32, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx + s * 0.35, cy + s * 0.35, s * 0.32, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx - s * 0.7, cy + s * 0.7);
                ctx.lineTo(cx + s * 0.7, cy - s * 0.7);
                ctx.stroke();
            } else if (type === 'bolt') {
                ctx.beginPath();
                ctx.moveTo(cx + s * 0.25, cy - s);
                ctx.lineTo(cx - s * 0.35, cy + s * 0.08);
                ctx.lineTo(cx + s * 0.05, cy + s * 0.08);
                ctx.lineTo(cx - s * 0.2, cy + s);
                ctx.lineTo(cx + s * 0.4, cy - s * 0.18);
                ctx.lineTo(cx, cy - s * 0.18);
                ctx.closePath();
                ctx.stroke();
            } else if (type === 'spark') {
                for (let a = 0; a < 4; a++) {
                    let ang = a * Math.PI / 2;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(cx + Math.cos(ang) * s, cy + Math.sin(ang) * s);
                    ctx.stroke();
                }
                ctx.beginPath();
                ctx.arc(cx, cy, s * 0.28, 0, Math.PI * 2);
                ctx.fill();
            } else if (type === 'damage') { // turret damage — bullet
                ctx.beginPath();
                ctx.moveTo(cx, cy - s);
                ctx.lineTo(cx + s * 0.45, cy - s * 0.35);
                ctx.lineTo(cx + s * 0.45, cy + s * 0.7);
                ctx.lineTo(cx - s * 0.45, cy + s * 0.7);
                ctx.lineTo(cx - s * 0.45, cy - s * 0.35);
                ctx.closePath(); ctx.stroke();
            } else if (type === 'firerate') { // fire rate — speed lines
                for (let i = 0; i < 3; i++) {
                    let yy = cy - s * 0.6 + i * s * 0.6;
                    ctx.beginPath(); ctx.moveTo(cx - s, yy); ctx.lineTo(cx + s * (0.7 - i * 0.25), yy); ctx.stroke();
                }
                ctx.beginPath(); ctx.arc(cx + s * 0.85, cy, s * 0.16, 0, Math.PI * 2); ctx.fill();
            } else if (type === 'mortar') { // mortar range — lob arc
                ctx.beginPath(); ctx.moveTo(cx - s, cy + s * 0.7); ctx.quadraticCurveTo(cx, cy - s * 1.25, cx + s, cy + s * 0.7); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx + s, cy + s * 0.7, s * 0.18, 0, Math.PI * 2); ctx.fill();
            } else if (type === 'speed') { // piece speed — double chevron
                for (let i = 0; i < 2; i++) {
                    let ox = cx - s * 0.45 + i * s * 0.85;
                    ctx.beginPath(); ctx.moveTo(ox - s * 0.35, cy - s * 0.65); ctx.lineTo(ox + s * 0.4, cy); ctx.lineTo(ox - s * 0.35, cy + s * 0.65); ctx.stroke();
                }
            } else if (type === 'gravity') { // slower gravity — float under ceiling
                ctx.beginPath(); ctx.moveTo(cx - s * 0.75, cy - s * 0.75); ctx.lineTo(cx + s * 0.75, cy - s * 0.75); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cx, cy + s * 0.85); ctx.lineTo(cx, cy - s * 0.35);
                ctx.moveTo(cx - s * 0.45, cy + s * 0.1); ctx.lineTo(cx, cy - s * 0.4); ctx.lineTo(cx + s * 0.45, cy + s * 0.1);
                ctx.stroke();
            } else if (type === 'trend') { // grid-shift score — rising chart
                ctx.beginPath();
                ctx.moveTo(cx - s, cy + s * 0.6); ctx.lineTo(cx - s * 0.3, cy - s * 0.05); ctx.lineTo(cx + s * 0.2, cy + s * 0.25); ctx.lineTo(cx + s, cy - s * 0.7);
                ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx + s * 0.5, cy - s * 0.7); ctx.lineTo(cx + s, cy - s * 0.7); ctx.lineTo(cx + s, cy - s * 0.2); ctx.stroke();
            } else if (type === 'shield') { // block durability — shield
                ctx.beginPath();
                ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s * 0.78, cy - s * 0.5); ctx.lineTo(cx + s * 0.62, cy + s * 0.45); ctx.lineTo(cx, cy + s); ctx.lineTo(cx - s * 0.62, cy + s * 0.45); ctx.lineTo(cx - s * 0.78, cy - s * 0.5);
                ctx.closePath(); ctx.stroke();
            } else if (type === 'snail') { // enemy speed down — turtle
                ctx.beginPath(); ctx.arc(cx - s * 0.1, cy + s * 0.1, s * 0.7, Math.PI, 0); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx - s * 0.8, cy + s * 0.1); ctx.lineTo(cx + s * 0.6, cy + s * 0.1); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx + s * 0.85, cy - s * 0.05, s * 0.18, 0, Math.PI * 2); ctx.stroke();
            } else if (type === 'slow') { // slow field strength — ripples
                for (let i = 1; i <= 3; i++) { ctx.beginPath(); ctx.arc(cx, cy, s * 0.32 * i, Math.PI * 0.85, Math.PI * 2.15); ctx.stroke(); }
            } else if (type === 'radius') { // slow radius — concentric rings
                ctx.beginPath(); ctx.arc(cx, cy, s * 0.85, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx, cy, s * 0.45, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx, cy, s * 0.12, 0, Math.PI * 2); ctx.fill();
            } else if (type === 'spikes') { // picket — spikes
                for (let i = -1; i <= 1; i++) {
                    let bx = cx + i * s * 0.62;
                    ctx.beginPath(); ctx.moveTo(bx - s * 0.28, cy + s * 0.6); ctx.lineTo(bx, cy - s * 0.7); ctx.lineTo(bx + s * 0.28, cy + s * 0.6); ctx.stroke();
                }
            } else if (type === 'revive') { // second wind — medic ring
                ctx.beginPath(); ctx.arc(cx, cy, s * 0.85, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy - s * 0.5); ctx.lineTo(cx, cy + s * 0.5); ctx.moveTo(cx - s * 0.5, cy); ctx.lineTo(cx + s * 0.5, cy); ctx.stroke();
            } else if (type === 'coin') { // kill scrap — coin
                ctx.beginPath(); ctx.arc(cx, cy, s * 0.8, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy - s * 0.42); ctx.lineTo(cx, cy + s * 0.42); ctx.stroke();
            } else if (type === 'recycle') { // grid refund — recycle loop
                ctx.beginPath(); ctx.arc(cx, cy, s * 0.7, -Math.PI * 0.4, Math.PI * 0.75); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx, cy, s * 0.7, Math.PI * 0.6, Math.PI * 1.75); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx + s * 0.62, cy + s * 0.45, s * 0.14, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx - s * 0.62, cy - s * 0.45, s * 0.14, 0, Math.PI * 2); ctx.fill();
            } else if (type === 'star') { // jackpot — star
                ctx.beginPath();
                for (let i = 0; i < 10; i++) {
                    let ang = -Math.PI / 2 + i * Math.PI / 5;
                    let rr2 = (i % 2 === 0) ? s : s * 0.42;
                    let px = cx + Math.cos(ang) * rr2, py = cy + Math.sin(ang) * rr2;
                    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath(); ctx.stroke();
            } else if (type === 'core') { // root / liquidation — diamond core
                ctx.beginPath(); ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s, cy); ctx.lineTo(cx, cy + s); ctx.lineTo(cx - s, cy); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx, cy, s * 0.3, 0, Math.PI * 2); ctx.fill();
            } else if (type === 'keystone') { // keystone — layered diamond
                ctx.beginPath(); ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s, cy); ctx.lineTo(cx, cy + s); ctx.lineTo(cx - s, cy); ctx.closePath(); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy - s * 0.5); ctx.lineTo(cx + s * 0.5, cy); ctx.lineTo(cx, cy + s * 0.5); ctx.lineTo(cx - s * 0.5, cy); ctx.closePath(); ctx.stroke();
            }
            ctx.restore();
        }
        // Pick a symbol that reflects what a node does (by its primary effect)
        function metaIconFor(node) {
            if (node.keystone) return 'keystone';

                    let effectY = miningRow * CELL + CELL / 2;
                    for (let j = 0; j < 4; j++) {

                        ctx.fillStyle = `rgba(255, ${Math.random() * 100 + 155}, 0, ${Math.random()})`;
                        ctx.beginPath();
                        ctx.arc(sparkX, sparkY, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
            
        } else if (this.etype === 'juggernaut' || this.etype === 'tank') {
    let size = CELL / 2.5;
    for (let i = 6; i > 0; i--) {
        ctx.fillStyle = `rgba(${cr},${cg},${cb},${(12 * i) / 255})`;
        let glowSize = size + i * 4;
        ctx.fillRect(px - glowSize/2, py - glowSize/2, glowSize, glowSize);
    }
    ctx.fillStyle = `rgb(${cr},${cg},${cb})`;

    ctx.lineWidth = 3;
    ctx.strokeRect(px - size/2, py - size/2, size, size);
        } else if (this.etype === 'miner') {
            let width = CELL * 3;
            let height = CELL;
            for (let i = MINER_GLOW_INTENSITY; i > 0; i--) {
                ctx.fillStyle = `rgba(${cr},${cg},${cb},${(15 * i) / 255})`;
                let glowWidth = width + i * MINER_GLOW_INTENSITY;
                let glowHeight = height + i * (MINER_GLOW_INTENSITY * 0.7);
                ctx.fillRect(px - glowWidth/2, py - glowHeight/2, glowWidth, glowHeight);
            }
            ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
            ctx.fillRect(px - width/2, py - height/2, width, height);
            ctx.strokeStyle = `rgb(${Math.min(255, cr + 80)},${Math.min(255, cg + 80)},${Math.min(255, cb + 80)})`;
            ctx.lineWidth = 4;
            ctx.strokeRect(px - width/2, py - height/2, width, height);
            if (this.isMining) {
                for (let [targetCol, miningRow] of this.miningTargets) {
                    let effectX = gridX + targetCol * CELL + CELL / 2;
                    let effectY = miningRow * CELL + CELL / 2;
                    let isAbove = (miningRow === Math.round(this.y) - 1);
                    let particleCount = isAbove ? 3 : 2;
                    let spread = isAbove ? CELL : CELL * 0.7;
                    let colorG = isAbove ? 255 : 180;
                    let colorB = isAbove ? 100 : 60;

                    for (let j = 0; j < particleCount; j++) {
                        let sparkX = effectX + (Math.random() - 0.5) * spread;

                        ctx.fillStyle = `rgba(255, ${colorG}, ${colorB}, ${isAbove ? Math.random() * 0.8 : Math.random() * 0.6})`;
                        ctx.beginPath();

            }
        } else {
            let r = CELL / 3;
            for (let i = 4; i > 0; i--) {
                ctx.fillStyle = `rgba(${cr},${cg},${cb},${(20 * i) / 255})`;
                ctx.beginPath();
                ctx.arc(px, py, r + i * 3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
            ctx.beginPath();
            ctx.arc(px, py, r, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // HP bar
        let bigBoss = this.nemBoss && this.etype !== 'hivespawn';
        let hpW = (this.etype === 'artillery' || bigBoss) ? CELL * 2.5 : this.etype === 'miner' ? CELL * 2.5 : CELL - 6;
        let hpH = (this.etype === 'artillery' || bigBoss) ? 10 : this.etype === 'miner' ? 8 : 5;
        let hpX = px - hpW / 2;
        let hpY = py + ((this.etype === 'artillery' || bigBoss) ? CELL + 10 : this.etype === 'juggernaut' ? CELL/2.5/2 + 6 : this.etype === 'miner' ? CELL/2 + 10 : CELL/3 + 4);
        let frac = Math.max(0, this.hp / this.maxHp);
        ctx.fillStyle = 'rgb(40,40,60)';
        ctx.fillRect(hpX, hpY, hpW, hpH);
        ctx.fillStyle = (this.etype === 'artillery') ? 'rgb(255,50,50)' : this.nemBoss ? `rgb(${cr},${cg},${cb})` : this.etype === 'miner' ? 'rgb(255,165,0)' : 'rgb(100,220,120)';
        ctx.fillRect(hpX, hpY, Math.floor(hpW * frac), hpH);
    }
}

        class Particle {
            constructor(x, y, vx, vy, color, life, size=3) {

            draw(ctx) {
                if (this.life <= 0) return;

        // Enhanced particle systems for premium game over screen
        class GeometricParticle {
            constructor(x, y, color, type = 'hex') {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.color = color;
                this.type = type; // 'hex', 'diamond', 'star', 'ring'
                this.life = Math.random() * 200 + 150;
                this.maxLife = this.life;
                this.size = Math.random() * 10 + 6;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.08;
                this.opacity = 1;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.99;
                this.vy *= 0.99;
                this.rotation += this.rotationSpeed;
                this.life--;
                this.opacity = this.life / this.maxLife;
                this.pulsePhase += 0.08;
            }
            
            draw(ctx) {
                if (this.life <= 0) return;
                
                let [r, g, b] = this.color;
                let pulse = 0.8 + 0.2 * Math.sin(this.pulsePhase);
                let alpha = this.opacity * pulse;
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
                ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.3})`;
                ctx.lineWidth = 1.5;
                
                if (this.type === 'hex') this.drawHexagon(ctx, this.size);
                else if (this.type === 'diamond') this.drawDiamond(ctx, this.size);
                else if (this.type === 'star') this.drawStar(ctx, this.size);
                else if (this.type === 'ring') this.drawRing(ctx, this.size);
                
                ctx.restore();
            }
            
            drawHexagon(ctx, size) {
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    let angle = (i * Math.PI) / 3;
                    let x = Math.cos(angle) * size;
                    let y = Math.sin(angle) * size;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
            
            drawDiamond(ctx, size) {
                ctx.beginPath();
                ctx.moveTo(0, -size);
                ctx.lineTo(size, 0);
                ctx.lineTo(0, size);
                ctx.lineTo(-size, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
            
            drawStar(ctx, size) {
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    let angle = (i * 4 * Math.PI) / 5;
                    let radius = i % 2 === 0 ? size : size * 0.5;
                    let x = Math.cos(angle) * radius;
                    let y = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
            
            drawRing(ctx, size) {
                ctx.beginPath();
                ctx.arc(0, 0, size, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.6, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
        
        class EnergyWisp {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.targetX = x + (Math.random() - 0.5) * 150;
                this.targetY = y + (Math.random() - 0.5) * 150;
                this.color = color;
                this.life = Math.random() * 250 + 200;
                this.maxLife = this.life;
                this.size = Math.random() * 2.5 + 1.5;
                this.trail = [];
            }
            
            update() {
                this.x += (this.targetX - this.x) * 0.015;
                this.y += (this.targetY - this.y) * 0.015;
                
                this.trail.push({x: this.x, y: this.y, alpha: 1});
                if (this.trail.length > 12) this.trail.shift();
                
                this.trail.forEach((point, i) => {
                    point.alpha = (i + 1) / this.trail.length * 0.4;
                });
                
                this.life--;
                
                if (Math.random() < 0.008) {
                    this.targetX = this.x + (Math.random() - 0.5) * 150;
                    this.targetY = this.y + (Math.random() - 0.5) * 150;
                }
            }
            
            draw(ctx) {
                if (this.life <= 0) return;
                
                let [r, g, b] = this.color;
                let opacity = this.life / this.maxLife;
                
                // Draw trail
                this.trail.forEach((point, i) => {
                    if (i > 0) {
                        let prev = this.trail[i - 1];
                        ctx.strokeStyle = `rgba(${r},${g},${b},${point.alpha * opacity})`;
                        ctx.lineWidth = this.size * (point.alpha + 0.3);
                        ctx.beginPath();
                        ctx.moveTo(prev.x, prev.y);
                        ctx.lineTo(point.x, point.y);
                        ctx.stroke();
                    }
                });
                
                // Draw main wisp
                ctx.fillStyle = `rgba(${r},${g},${b},${opacity})`;
                ctx.shadowColor = `rgba(${r},${g},${b},0.6)`;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }
        
        class GlassShardParticle {
            constructor(x, y) {

                ctx.lineWidth = 1;
                
                ctx.beginPath();

                ctx.lineTo(this.size * 0.7, -this.size * 0.3);
                ctx.lineTo(this.size * 0.4, this.size * 0.8);
                ctx.lineTo(-this.size * 0.6, this.size * 0.4);

        class ConfettiParticle {

        class Projectile {
            constructor(sx, sy, targetEnemy, game, color, damage=1) {
                this.x = sx; this.y = sy; this.target = targetEnemy; this.game = game;
                let estEnemyPxPerSec = Math.max(16.0, targetEnemy.baseSpeed * CELL * FPS);
                this.speed = Math.max(300.0, estEnemyPxPerSec * 1.2);
                this.color = color; this.damage = damage;
                this.dead = false; this.maxLifeMs = 3000;
                this.spawnTime = Date.now(); this.arcPhase = Math.random() * Math.PI * 2;
                this.hitRadius = CELL * 0.6;
            }
            update() {
                let now = Date.now();
                if (this.dead || now - this.spawnTime > this.maxLifeMs) { this.dead = true; return; }
                if (this.target !== null && this.target.hp <= 0) this.target = null;
                if (this.target === null) { this.dead = true; return; }
                let [tx, ty] = this.target.getPositionAtMs(now);
                let dx = tx - this.x, dy = ty - this.y;
                let dist = Math.hypot(dx, dy) || 1.0;
                let dt = 1.0 / FPS;
                this.x += (dx / dist) * this.speed * dt;
                this.y += (dy / dist) * this.speed * dt;
                this.arcPhase += 0.25;
                // Reuse the same position coordinates for collision detection to avoid race conditions
                if (Math.hypot(tx - this.x, ty - this.y) <= this.hitRadius) {
                    if (this.target.etype === 'juggernaut') {
                        this.game.spawnExplosionParticles(tx, ty, [100, 100, 100], 4, 1.0);
                    } else {
                        let pdmg = this.damage * (this.game ? this.game.getProjectileDamageMult() : 1); // SKILL: Overcharged / Plasma Rounds
                        if (this.game) this.game.applyEnemyDamage(this.target, pdmg, 'gatling'); // NEMESIS: shield/scar/runMod hooks
                        else this.target.hp -= pdmg;
                        this.game.spawnExplosionParticles(tx, ty, this.color, 8, 1.6);
                    }
                    this.dead = true;
                }
            }
            draw(ctx) {
                let bob = Math.sin(this.arcPhase) * 6;
                let [r, g, b] = this.color;
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.beginPath(); ctx.arc(Math.floor(this.x), Math.floor(this.y - bob), 4.2, 0, Math.PI * 2); ctx.fill();
            }
        }

        // ---------------- ORBITAL STRIKE CLASSES ----------------
        class OrbitalStrikeEffect {
            constructor(x, y, game) {
                this.x = x;
                this.y = y;
                this.game = game;
                this.phase = 'incoming'; // 'incoming', 'impact', 'explosion'
                this.timer = 0;
                this.maxTimer = 30; // frames for incoming phase
                this.impactTimer = 0;
                this.maxImpactTimer = 20; // frames for explosion
                this.targetIndicatorTimer = 10; // frames to show target indicator
                this.dead = false;
            }
            
            update() {
                if (this.dead) return;
                
                if (this.phase === 'incoming') {
                    this.timer++;
                    if (this.timer >= this.maxTimer) {
                        this.phase = 'impact';
                        this.executeStrike();
                    }
                } else if (this.phase === 'impact') {
                    this.impactTimer++;
                    if (this.impactTimer >= this.maxImpactTimer) {
                        this.dead = true;
                    }
                }
            }
            
            executeStrike() {
                // Apply damage to enemies in area
                this.damageEnemiesInArea();
                // Destroy blocks in area and give scrap refund
                this.destroyBlocksInArea();
                // Create screen shake
                this.game.addScreenShake(8);
                // Spawn explosion particles
                this.game.spawnExplosionParticles(this.x, this.y, [255, 150, 50], 25, 3.0);
            }
            
            damageEnemiesInArea() {
                // Use grid-based damage calculation for more reliable hits
                const gridX = LEFT_PANEL_WIDTH;
                const centerCol = Math.floor((this.x - gridX) / CELL);
                const centerRow = Math.floor(this.y / CELL);
                
                
                for (let enemy of this.game.enemies) {
                    if (enemy.hp <= 0) continue; // Skip dead enemies
                    
                    let [ex, ey] = enemy.getPositionAtMs(Date.now());
                    const enemyCol = Math.floor((ex - gridX) / CELL);
                    const enemyRow = Math.floor(ey / CELL);
                    
                    // Check if enemy is within the damage grid area (more generous for enemies)
                    const rowDiff = Math.abs(enemyRow - centerRow);
                    const colDiff = Math.abs(enemyCol - centerCol);
                    const enemyDamageRadius = ORBITAL_STRIKE_RADIUS + 0.5; // More forgiving for enemies
                    
                    if (rowDiff <= enemyDamageRadius && colDiff <= enemyDamageRadius) {
                        // Determine damage based on enemy type
                        let damagePercent = ORBITAL_STRIKE_DAMAGE_PERCENT; // Default 90% for regular enemies
                        let enemyType = "regular";
                        
                        // Check for bosses (artillery, miner, nemesis) and juggernauts
                        if (enemy.etype === 'artillery' || enemy.etype === 'miner' || enemy.etype === 'juggernaut' || enemy.nemBoss) {
                            damagePercent = 0.15; // 15% for bosses and juggernauts
                            enemyType = (enemy.etype === 'artillery' || enemy.etype === 'miner' || enemy.nemBoss) ? "boss" : "juggernaut";
                        } else if (enemy.etype === 'tank') {
                            damagePercent = 0.10; // 10% for tanks
                            enemyType = "tank";
                        }

                        let damage = enemy.maxHp * damagePercent;
                        this.game.applyEnemyDamage(enemy, damage, 'lazer'); // NEMESIS: shield/scar/runMod hooks
                        
                        // Add visual feedback for successful hit
                        this.game.spawnExplosionParticles(ex, ey, [255, 50, 50], 15, 2.0);
                    } else {
                    }
                }
            }
            
            destroyBlocksInArea() {
                const gridX = LEFT_PANEL_WIDTH;
                const centerCol = Math.floor((this.x - gridX) / CELL);
                const centerRow = Math.floor(this.y / CELL);
                let scrapRefund = 0;
                
                for (let dy = -ORBITAL_STRIKE_RADIUS; dy <= ORBITAL_STRIKE_RADIUS; dy++) {
                    for (let dx = -ORBITAL_STRIKE_RADIUS; dx <= ORBITAL_STRIKE_RADIUS; dx++) {
                        let row = centerRow + dy;
                        let col = centerCol + dx;
                        if (row >= 0 && row < ROWS && col >= 0 && col < COLS && this.game.board[row][col] !== null) {
                            // Calculate scrap refund based on block type
                            let block = this.game.board[row][col];
                            let baseHP = BASE_HP[block.shape] || 1;
                            scrapRefund += Math.floor(baseHP * ORBITAL_STRIKE_SCRAP_REFUND);
                            
                            // Destroy the block
                            this.game.board[row][col] = null;
                        }
                    }
                }
                
                // Give scrap refund
                this.game.scraps += scrapRefund;
            }
            
            draw(ctx) {
                if (this.dead) return;
                
                // Draw targeting reticle before incoming phase
                if (this.targetIndicatorTimer > 0) {
                    this.targetIndicatorTimer--;
                    // Draw targeting reticle
                    ctx.strokeStyle = `rgba(255, 50, 50, ${0.5 + 0.5 * Math.sin(this.targetIndicatorTimer * 0.5)})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 20, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    // Draw crosshair
                    ctx.beginPath();
                    ctx.moveTo(this.x - 15, this.y);
                    ctx.lineTo(this.x + 15, this.y);
                    ctx.moveTo(this.x, this.y - 15);
                    ctx.lineTo(this.x, this.y + 15);
                    ctx.stroke();
                }
                
                if (this.phase === 'incoming') {
                    // Draw incoming laser beam
                    let progress = this.timer / this.maxTimer;
                    let beamLength = progress * (this.y + 50);
                    
                    ctx.save();
                    ctx.strokeStyle = `rgba(255, 100, 50, ${0.8 * progress})`;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(this.x, -50);
                    ctx.lineTo(this.x, -50 + beamLength);
                    ctx.stroke();
                    
                    // Add glow effect
                    ctx.strokeStyle = `rgba(255, 200, 150, ${0.4 * progress})`;
                    ctx.lineWidth = 8;
                    ctx.stroke();
                    ctx.restore();
                    
                } else if (this.phase === 'impact') {
                    // Draw explosion effect
                    let progress = this.impactTimer / this.maxImpactTimer;
                    let radius = (1 - progress) * ORBITAL_STRIKE_RADIUS * CELL * 1.5;
                    let alpha = (1 - progress) * 0.8;
                    
                    ctx.save();
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Outer ring

                    ctx.fill();
                    ctx.restore();
                }
            }

    // NEW: Ghost piece position calculation
    getGhostPiecePosition() {
        if (!this.piece) return null;
        
        // Create a copy of the current piece
        let ghostPiece = {
            x: this.piece.x,
            y: this.piece.y,
            cells: this.piece.cells.map(c => [...c]),
            kind: this.piece.kind
        };
        
        // Move it down until it can't move anymore
        while (true) {
            ghostPiece.y += 1;
            let canMove = true;
            for (let [cx, cy] of ghostPiece.cells) {
                let gx = ghostPiece.x + cx;
                let gy = ghostPiece.y + cy;
                if (gx < 0 || gx >= COLS || gy >= ROWS || (gy >= 0 && this.board[gy][gx] !== null)) {
                    canMove = false;
                    break;
                }
            }
            if (!canMove) {
                ghostPiece.y -= 1; // Step back to last valid position
                break;
            }
        }
        
        return ghostPiece;
    }

            getMoveCool()            { return Math.round(15 * (this.meta ? this.meta.moveCoolMult : 1)); }
            getMineCost()            { return Math.max(1, Math.round(MINE_COST * (this.meta ? this.meta.abilityCostMult : 1))); }
            getDropScrapBonus()      { return 0; } // no Phase-1 node grants this; kept for the call site

            // ---- purchase rules ----
            metaCanBuy(node) {
                let owned = this.metaSave.ownedNodes;
                if (owned.includes(node.id)) return { ok:false, why:'Already owned' };
                if (node.prereq && node.prereq.length > 0 && !node.prereq.some(p => owned.includes(p)))
                    return { ok:false, why:'Unlock a connected node first' };
                if (node.keystone) {
                    let t4 = owned.filter(id => { let n = META_BY_ID[id]; return n.arm === node.arm && n.tier === 4; }).length;
                    if (t4 < 2) return { ok:false, why:'Need 2 tier-4 nodes in this arm' };
                    if (this.metaSave.keystone) return { ok:false, why:'Only one keystone allowed' };
                }
                if (node.tier >= 3 && this.metaSave.focusArm && this.metaSave.focusArm !== node.arm)
                    return { ok:false, why:`Committed to ${this.metaArmName(this.metaSave.focusArm)}` };
                if (this.metaSave.cores < node.cost) return { ok:false, why:'Not enough Cores' };
                return { ok:true };
            }
            metaArmName(a) { return META_ARM_NAME[a] || a; }
            buyMetaNode(node) {
                let r = this.metaCanBuy(node);
                if (!r.ok) return false;
                this.metaSave.cores -= node.cost;
                this.metaSave.ownedNodes.push(node.id);
                if (node.tier >= 3 && !this.metaSave.focusArm) this.metaSave.focusArm = node.arm;
                if (node.keystone) this.metaSave.keystone = node.id;
                this.skillPulse[node.id] = 1.0;
                this.meta = computeMetaBonuses(this.metaSave.ownedNodes); // apply immediately
                saveMeta(this.metaSave);
                return true;
            }
            reforgeInfo() {
                let spent = this.metaSave.ownedNodes.reduce((s, id) => s + (META_BY_ID[id] ? META_BY_ID[id].cost : 0), 0);
                let refund = Math.floor(spent * 0.75);
                let surcharge = 150 * this.metaSave.stats.timesReforged;
                return { spent, refund, surcharge, net: refund - surcharge };
            }
            doReforge() {
                let info = this.reforgeInfo();
                this.metaSave.cores += info.net;
                if (this.metaSave.cores < 0) this.metaSave.cores = 0;
                this.metaSave.ownedNodes = [];
                this.metaSave.keystone = null;
                this.metaSave.focusArm = null;
                this.metaSave.stats.timesReforged += 1;
                this.meta = computeMetaBonuses(this.metaSave.ownedNodes);
                saveMeta(this.metaSave);
            }
            undoCost() {
                let n = (this.metaSave.stats && this.metaSave.stats.undosUsed) || 0;
                return n === 0 ? 0 : Math.round(25 * Math.pow(1.6, n - 1)); // 1st free, then rising
            }
            doUndo() {
                if (this.metaSave.ownedNodes.length === 0) return;
                let cost = this.undoCost();
                if (this.metaSave.cores < cost) return;
                let id = this.metaSave.ownedNodes.pop(); // last purchase has no owned children (safe)
                let node = META_BY_ID[id];
                this.metaSave.cores -= cost;                 // pay the undo fee
                if (node) this.metaSave.cores += node.cost;   // refund the node's cost
                this.metaSave.stats.undosUsed = ((this.metaSave.stats && this.metaSave.stats.undosUsed) || 0) + 1;
                // recompute focus arm + keystone from what remains
                let deep = this.metaSave.ownedNodes.find(nid => META_BY_ID[nid] && META_BY_ID[nid].tier >= 3);
                this.metaSave.focusArm = deep ? META_BY_ID[deep].arm : null;
                let ks = this.metaSave.ownedNodes.find(nid => META_BY_ID[nid] && META_BY_ID[nid].keystone);
                this.metaSave.keystone = ks || null;
                this.meta = computeMetaBonuses(this.metaSave.ownedNodes);
                saveMeta(this.metaSave);
            }

            // ---- pan / scroll input ----
            clampMetaScroll(s) { return Math.max(0, Math.min(s, this.metaMaxScroll || 0)); }
            handleCanvasMouseDown(e) {
                if (!this.skillTreeOpen || this.metaConfirm) return;
                const rect = this.canvas.getBoundingClientRect();
                let mx = e.clientX - rect.left, my = e.clientY - rect.top;
                let v = this.metaViewport;
                if (v && mx >= v.x && mx <= v.x + v.w && my >= v.y && my <= v.y + v.h) {
                    this.metaDragging = true;
                    this.metaDragStartY = my;
                    this.metaScrollStart = this.metaScroll;
                    this.metaDidDrag = false;
                }
            }
            handleCanvasMouseUp() { this.metaDragging = false; }
            handleCanvasWheel(e) {
                if (!this.skillTreeOpen) return;
                e.preventDefault();
                this.metaScroll = this.clampMetaScroll(this.metaScroll + e.deltaY * 0.5);
            }

            handleSkillTreeClick(mx, my) {
                // Confirmation dialog intercepts everything
                if (this.metaConfirm) {
                    let y = this.metaConfirmYesBounds, n = this.metaConfirmNoBounds;
                    if (y && mx >= y.x && mx <= y.x + y.w && my >= y.y && my <= y.y + y.h) {
                        if (this.metaConfirm.type === 'reforge') this.doReforge();
                        else if (this.metaConfirm.type === 'keystone') this.buyMetaNode(META_BY_ID[this.metaConfirm.nodeId]);
                        this.metaConfirm = null; return;
                    }
                    this.metaConfirm = null; return; // No, or click anywhere else, cancels
                }
                // Info overlay: any click closes it
                if (this.metaInfoOpen) { this.metaInfoOpen = false; return; }
                // A drag shouldn't count as a click
                if (this.metaDidDrag) { this.metaDidDrag = false; return; }

// ====================== NEMESIS MODE ENGINE ======================
toggleMode() {
    // VERSUS is entered from the lobby, never from this toggle — leaving it drops
    // the duel and puts you back in classic.
    if (this.mode === 'versus') {
        VSNet.reset();
        this.mode = 'classic';
        try { localStorage.setItem(NEM_MODE_KEY, this.mode); } catch (e) {}
        this.reset();
        return;
    }
    this.mode = this.mode === 'nemesis' ? 'classic' : 'nemesis';
    try { localStorage.setItem(NEM_MODE_KEY, this.mode); } catch (e) {}
    this.reset();
}

scarCount(id) { return this.scars ? this.scars.filter(s => s === id).length : 0; }

// Damage multiplier from run mods (draft cards) + scars. Applied to every weapon hit.
nemDamageMult(e, weapon) {
    let m = 1;
    if (this.runMods) {
        if (this.runMods.glass) m *= 1.6;                                          // Glass Cannon
        if (this.runMods.siege > 0 && weapon === 'mortar') m *= 1 + 0.5 * this.runMods.siege; // Siege Mortars
    }
    if (e && e.nemBoss && this.reactiveWeapon === weapon) {
        let rp = this.scarCount('reactive');                                       // Reactive Plating scar
        if (rp > 0) m *= Math.pow(0.7, rp);
    }
    return m;
}

// Central weapon-damage hook: shields, scars, run mods, kill-weapon tagging.
applyEnemyDamage(e, dmg, weapon) {
    if (!e || e.hp <= 0) return;
    dmg *= this.nemDamageMult(e, weapon);
    if (dmg <= 0) return;
    if (e.nemBoss && e.shieldHp > 0) {
        // Artificer bubble: only mortars and the lazer strike break it
        if (weapon === 'mortar' || weapon === 'lazer') {
            e.shieldHp -= dmg;
            if (e.shieldHp <= 0) { e.hp += e.shieldHp; e.shieldHp = 0; }
        }
        e.lastHitBy = weapon;
        return; // gatling & mines fizzle on the shield
    }
    e.hp -= dmg;
    e.lastHitBy = weapon;
}

// Napalm Mines: burning ground damages enemies standing in it
updateFireZones() {
    if (!this.fireZones || this.fireZones.length === 0) return;
    this.fireZones = this.fireZones.filter(z => {
        z.timer--;
        if (z.timer % 20 === 0) {
            for (let e of this.enemies) {
                if (Math.max(Math.abs(Math.round(e.y) - z.y), Math.abs(e.col - z.x)) <= 2) {
                    this.applyEnemyDamage(e, 1.5 + this.level * 0.5, 'mine');
                }
            }
        }
        if (Math.random() < 0.35) {
            let gridX = LEFT_PANEL_WIDTH;
            let fx = gridX + (z.x + (Math.random() * 4 - 2)) * CELL + CELL / 2;
            let fy = (z.y + (Math.random() * 4 - 2)) * CELL + CELL / 2;
            this.particles.push(new Particle(fx, fy, (Math.random() - 0.5) * 0.4, -Math.random() * 1.2, NEON_ORANGE, Math.floor(FPS * 0.4), 2));
        }
        return z.timer > 0;
    });
}

nemMinionInterval() {
    let base = 8 * FPS * Math.pow(0.96, this.nemDepth - 1);          // creeps faster with depth
    base *= Math.pow(0.8, this.scarCount('vengeful'));               // Vengeful scar: 25% faster per stack
    return Math.max(2.5 * FPS, Math.floor(base));
}

spawnNemMinions() {
    let arch = this.nemCurrentBoss;
    if (!arch) return;
    let mtype = NEM_BOSS_DEFS[arch].minion;
    let count = Math.min(4, 1 + Math.floor(this.nemDepth / 4));
    let quick = this.scarCount('quickened');
    for (let i = 0; i < count; i++) {
        let t = mtype === 'mixed' ? randomChoice(['grunt', 'sprinter', 'brute', 'bomber']) : mtype;
        let en = new Enemy(t, Math.floor(Math.random() * COLS), this.level);
        if (quick > 0) en.baseSpeed *= Math.pow(1.10, quick);
        this.enemies.push(en);
    }
}

// Which archetype shows up at this depth. Cycles are rolled lazily and cached,
// so peeking at the next boss during the countdown doesn't change what arrives.
nemBossForDepth(depth) {
    if (!this.nemBossQueue) this.nemBossQueue = [];
    while (this.nemBossQueue.length < depth) {
        let cycle = nemRollCycle(Math.floor(this.nemBossQueue.length / NEM_ORDER.length));
        // Don't let a cycle boundary serve the same boss twice in a row.
        let last = this.nemBossQueue[this.nemBossQueue.length - 1];
        if (last && cycle[0] === last && cycle.length > 1) {
            let sw = 1 + Math.floor(Math.random() * (cycle.length - 1));
            let tmp = cycle[0]; cycle[0] = cycle[sw]; cycle[sw] = tmp;
        }
        this.nemBossQueue = this.nemBossQueue.concat(cycle);
    }
    return this.nemBossQueue[depth - 1];
}

nemesisSpawnBoss() {
    let depth = this.nemDepth;
    let arch = this.nemBossForDepth(depth);
    this.nemCurrentBoss = arch;
    let boss = new Enemy(arch, Math.floor(COLS / 2), this.level);

    // Depth scaling + scars + All-In
    let depthMult = 1 + 0.12 * (depth - 1);
    boss.maxHp = Math.floor(boss.maxHp * depthMult);
    let hardened = this.scarCount('hardened');
    if (hardened > 0) boss.maxHp = Math.floor(boss.maxHp * Math.pow(1.15, hardened)); // Hardened scar
    if (this.runMods.allinHp > 0) boss.maxHp = Math.floor(boss.maxHp * Math.pow(1.3, this.runMods.allinHp)); // All-In
    boss.hp = boss.maxHp;
    let quick = this.scarCount('quickened');
    if (quick > 0) boss.baseSpeed *= Math.pow(1.10, quick); // Quickened scar

    // Gimmicks: own + recombination past boss 8 + Adaptive scar
    let gimmicks = boss.gimmicks.slice();
    if (depth > NEM_ORDER.length) {
        let others = ['charge', 'lock', 'shield', 'sap', 'flip', 'split', 'tank', 'teleport'].filter(gk => !gimmicks.includes(gk));
        if (others.length) gimmicks.push(randomChoice(others));
    }
    if (this.scarCount('adaptive') > 0 && this.nemPrevGimmick && !gimmicks.includes(this.nemPrevGimmick)) {
        gimmicks.push(this.nemPrevGimmick); // Adaptive scar — the signature chaos
    }
    boss.gimmicks = gimmicks;
    if (gimmicks.length > 1) {
        const prefix = { charge:'CHARGING', lock:'WARDING', shield:'SHIELDED', sap:'SAPPING', flip:'GRAVITY', split:'SPLITTING', tank:'COLOSSAL', teleport:'GLITCHED' };
        boss.bossName = (prefix[gimmicks[1]] || '') + ' ' + boss.bossName;
    }
    if (gimmicks.includes('shield')) { boss.shieldMax = Math.floor(boss.maxHp * 0.5); boss.shieldHp = boss.shieldMax; }
    if (gimmicks.includes('tank')) boss.slowImmune = true;
    this.nemBossGimmicks = gimmicks;
    this.nemPrevGimmick = NEM_BOSS_DEFS[arch].gimmick;
    this.enemies.push(boss);

    // Two flanking minions on arrival
    let mtype = NEM_BOSS_DEFS[arch].minion;
    for (let k of [-3, 3]) {
        let t = mtype === 'mixed' ? randomChoice(['grunt', 'sprinter', 'brute', 'bomber']) : mtype;
        this.enemies.push(new Enemy(t, Math.max(0, Math.min(COLS - 1, boss.col + k)), this.level));
    }

    // Gimmick + pacing timers
    this.nemMinionTimer = this.nemMinionInterval();
    this.nemLockedCols = [];
    this.nemLockTimer = 4 * FPS;
    this.nemGravityFlip = 0;
    this.nemFlipTimer = 6 * FPS;

    // Purple nemesis vignette
    window.vignetteColor = [90, 30, 110];
    window.vignetteTargetIntensity = Math.min(0.7, window.vignetteTargetIntensity + 0.3);
    this.addScreenShake(6);
    this.nemAnnounce = { text: `BOSS ${depth}: ${boss.bossName}`, color: boss.color, timer: 3 * FPS };
}

nemesisBossDefeated() {
    let n = this.nemDepth;
    let pay = nemCoresPerBoss(n);
    if (this.runMods.bounty > 0) { pay = Math.round(pay * Math.pow(1.5, this.runMods.bounty)); this.runMods.bounty = 0; }   // Bounty
    if (this.runMods.allinPay > 0) { pay = Math.round(pay * Math.pow(1.4, this.runMods.allinPay)); this.runMods.allinPay = 0; this.runMods.allinHp = 0; } // All-In
    if (n > (this.metaSave.stats.bestNemDepth || 0)) { pay += 20; this.metaSave.stats.bestNemDepth = n; }                  // first-clear bonus
    this.metaSave.cores += pay;
    saveMeta(this.metaSave);
    this.runCores += pay;
    this.nemLastPayout = pay;

    // Roll a scar — the nemesis remembers
    let pool = NEM_SCAR_DEFS.filter(s => s.id !== 'adaptive' || this.nemPrevGimmick);
    let scar = randomChoice(pool);
    this.scars.push(scar.id);
    if (scar.id === 'reactive') this.reactiveWeapon = this.lastBossKillWeapon || 'gatling';
    this.nemAnnounce = { text: `+${pay} CORES · NEMESIS GREW: +${scar.name.toUpperCase()}`, color: scar.color, timer: 4 * FPS };

    // Clear any lingering gimmick effects
    this.nemLockedCols = [];
    this.nemGravityFlip = 0;
    this.nemBossGimmicks = [];
    this.nemCurrentBoss = null;
    this.nemState = 'reward';
    this.nemTimer = NEM_REWARD_DELAY;
}

openDraft() {
    let owned = (id) => {
        let rm = this.runMods;
        return (id === 'twin' && rm.twin) || (id === 'napalm' && rm.napalm) || (id === 'salvage' && rm.salvage) ||
               (id === 'walls' && rm.walls) || (id === 'glass' && rm.glass);
    };
    let avail = NEM_DRAFT_CARDS.filter(c => !(c.once && owned(c.id)));
    // shuffle copy, take 3
    let deck = avail.slice();
    for (let i = deck.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    this.draftCards = deck.slice(0, 3);
    if (this.draftCards.length === 0) { this.advanceToNextBoss(); return; }
    this.draftCardBounds = [];
    this.draftOpen = true;
    this.nemState = 'draft';
}

pickDraftCard(i) {
    let c = this.draftCards[i];
    if (!c) return;
    let rm = this.runMods;
    switch (c.id) {
        case 'twin': rm.twin = true; break;
        case 'napalm': rm.napalm = true; break;
        case 'siege': rm.siege++; break;
        case 'bounty': rm.bounty++; break;
        case 'salvage': rm.salvage = true; break;
        case 'btime': rm.btCharges += 3; break;
        case 'walls': rm.walls = true; break;
        case 'glass': rm.glass = true; break;
        case 'allin': rm.allinPay++; rm.allinHp++; break;
    }
    this.nemAnnounce = { text: `${c.name.toUpperCase()} ACQUIRED`, color: c.color, timer: 2.5 * FPS };
    this.draftOpen = false;
    this.draftCards = [];
    this.draftCardBounds = [];
    this.advanceToNextBoss();
}

advanceToNextBoss() {
    this.nemDepth++;
    this.nemState = 'countdown';
    this.nemTimer = NEM_COUNTDOWN;
}

// The Nemesis state machine: countdown -> fight -> reward -> draft -> countdown ...
nemesisTick() {
    if (this.nemState === 'countdown') {
        this.nemTimer--;
        this.waveTimer = this.nemTimer; // keep side-panel bar meaningful
        if (this.nemTimer <= 0) {
            this.nemesisSpawnBoss();
            this.nemState = 'fight';
        }
        return;
    }

    if (this.nemState === 'fight') {
        // Minion pressure
        this.nemMinionTimer--;
        if (this.nemMinionTimer <= 0) {
            this.spawnNemMinions();
            this.nemMinionTimer = this.nemMinionInterval();
        }

        // Warden: column locks (6s on, 8s off)
        if (this.nemBossGimmicks.includes('lock')) {
            this.nemLockTimer--;
            if (this.nemLockedCols.length > 0) {
                if (this.nemLockTimer <= 0) { this.nemLockedCols = []; this.nemLockTimer = 8 * FPS; }
            } else if (this.nemLockTimer <= 0) {
                let pool = [0, 1, 2, 3, 6, 7, 8, 9].filter(c => c < COLS);
                let a = randomChoice(pool);
                let b = randomChoice(pool.filter(c => c !== a));
                this.nemLockedCols = [a, b];
                this.nemLockTimer = 6 * FPS;
            }
        } else if (this.nemLockedCols.length) {
            this.nemLockedCols = [];
        }

        // Inverter: gravity flip bursts (2.5s on, ~9s cycle)
        if (this.nemBossGimmicks.includes('flip')) {
            if (this.nemGravityFlip > 0) {
                this.nemGravityFlip--;
            } else {
                this.nemFlipTimer--;
                if (this.nemFlipTimer <= 0) {
                    this.nemGravityFlip = Math.floor(2.5 * FPS);
                    this.nemFlipTimer = 9 * FPS;
                }
            }
        } else {
            this.nemGravityFlip = 0;
        }

        // Hivemind: split into 3 at half health
        for (let i = this.enemies.length - 1; i >= 0; i--) {
            let e = this.enemies[i];
            if (e.nemBoss && e.gimmicks && e.gimmicks.includes('split') && !e.didSplit && e.hp > 0 && e.hp <= e.maxHp / 2) {
                e.didSplit = true;
                let [sx, sy] = e.getPositionAtMs(Date.now());
                this.spawnExplosionParticles(sx, sy, e.color, 30, 3.0);
                this.addScreenShake(8);
                let baseCol = e.col, baseY = Math.min(ROWS - 1, Math.round(e.y));
                let quick = this.scarCount('quickened');
                this.enemies.splice(i, 1);
                for (let k = -1; k <= 1; k++) {
                    let child = new Enemy('hivespawn', Math.max(0, Math.min(COLS - 1, baseCol + k * 2)), this.level);
                    child.maxHp = Math.max(10, Math.floor(e.maxHp * 0.3));
                    child.hp = child.maxHp;
                    child.y = Math.min(ROWS - 1, baseY + Math.abs(k));
                    if (quick > 0) child.baseSpeed *= Math.pow(1.10, quick);
                    this.enemies.push(child);
                }
            }
        }

        // Boss down?
        let bossesAlive = this.enemies.some(e => e.nemBoss);
        if (!bossesAlive) this.nemesisBossDefeated();
        return;
    }

    if (this.nemState === 'reward') {
        this.nemTimer--;
        if (this.nemTimer <= 0) this.openDraft();
        return;
    }
    // 'draft' state: gameTick doesn't run while draftOpen pauses the loop
}

// ---- Nemesis HUD: boss bar, gimmick effects, scars, depth, announcements ----
drawNemesisHUD() {
    let ctx = this.ctx;
    let gridX = LEFT_PANEL_WIDTH;

    // Warden locked columns
    if (this.nemLockedCols && this.nemLockedCols.length > 0) {
        let flash = 0.10 + 0.08 * Math.sin(this.ticks * 0.2);
        for (let c of this.nemLockedCols) {
            ctx.fillStyle = `rgba(255,60,80,${flash})`;
            ctx.fillRect(gridX + c * CELL, 0, CELL, GRID_H);
            ctx.strokeStyle = 'rgba(255,80,100,0.8)';
            ctx.lineWidth = 2;
            ctx.strokeRect(gridX + c * CELL + 2, 2, CELL - 4, GRID_H - 4);
        }
    }

    if (this.nemGravityFlip > 0) {
        ctx.fillStyle = 'rgba(90,230,230,0.08)';
        ctx.fillRect(gridX, 0, GRID_W, GRID_H);
        ctx.save(); ctx.textAlign = 'center';
        ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
        ctx.fillStyle = 'rgb(90,230,230)';
        ctx.fillText('▲ GRAVITY FLIPPED ▲', gridX + GRID_W / 2, GRID_H - 30);
        ctx.restore();
    }

    // Napalm fire zones
    for (let z of this.fireZones) {
        let alpha = 0.10 + 0.06 * Math.sin(this.ticks * 0.3 + z.x);
        ctx.fillStyle = `rgba(255,120,30,${alpha})`;
        ctx.fillRect(gridX + Math.max(0, z.x - 2) * CELL, Math.max(0, z.y - 2) * CELL, CELL * 5, CELL * 5);
    }

    // Boss health bar across the top (sums the Hivemind's splits)
    let group = this.enemies.filter(e => e.nemBoss);
    if (group.length > 0) {
        let lead = group.find(e => e.etype !== 'hivespawn') || group[0];
        let hp = group.reduce((s, e) => s + Math.max(0, e.hp), 0);
        let maxHp = group.reduce((s, e) => s + e.maxHp, 0) || 1;
        let bw = GRID_W - 20, bx = gridX + 10, by = 6, bh = 14;
        ctx.fillStyle = 'rgba(10,8,18,0.85)';
        ctx.fillRect(bx - 4, by - 4, bw + 8, bh + 28);
        ctx.fillStyle = 'rgb(40,40,60)';
        ctx.fillRect(bx, by, bw, bh);
        let [br2, bg2, bb2] = lead.color;
        ctx.fillStyle = `rgb(${br2},${bg2},${bb2})`;
        ctx.fillRect(bx, by, Math.floor(bw * Math.max(0, Math.min(1, hp / maxHp))), bh);
        if (lead.shieldHp > 0 && lead.shieldMax > 0) {
            ctx.fillStyle = 'rgba(140,200,255,0.9)';
            ctx.fillRect(bx, by + bh - 4, Math.floor(bw * Math.min(1, lead.shieldHp / lead.shieldMax)), 4);
        }
        ctx.strokeStyle = `rgb(${br2},${bg2},${bb2})`;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(bx, by, bw, bh);
        let glabel = (lead.gimmicks || []).map(gk => NEM_GIMMICK_LABEL[gk] || gk).join(' + ');
        drawText(ctx, `${lead.bossName}${glabel ? ' — ' + glabel : ''}`, bx, by + bh + 16, FONT_SMALL_SIZE, [br2, bg2, bb2]);
    }

    // Depth / run Cores / Bullet Time charges (top-right of grid)
    ctx.save();
    ctx.textAlign = 'right';
    ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
    let infoY = group.length > 0 ? 58 : 18;
    ctx.fillStyle = `rgb(${NEON_PURPLE[0]},${NEON_PURPLE[1]},${NEON_PURPLE[2]})`;
    ctx.fillText(`BOSS ${this.nemDepth}`, gridX + GRID_W - 8, infoY);
    ctx.fillStyle = `rgb(${NEON_YELLOW[0]},${NEON_YELLOW[1]},${NEON_YELLOW[2]})`;
    ctx.fillText(`RUN CORES: ${this.runCores}`, gridX + GRID_W - 8, infoY + 18);
    if (this.runMods.btCharges > 0) {
        ctx.fillStyle = `rgb(${NEON_CYAN[0]},${NEON_CYAN[1]},${NEON_CYAN[2]})`;
        ctx.fillText(`BULLET TIME x${this.runMods.btCharges} (B)`, gridX + GRID_W - 8, infoY + 36);
    }
    ctx.restore();

    // Scar row (bottom-left of grid)
    if (this.scars.length > 0) {
        let syy = GRID_H - 22;
        for (let i = 0; i < this.scars.length && i < 16; i++) {
            let def = NEM_SCAR_DEFS.find(s => s.id === this.scars[i]);
            if (!def) continue;
            let cx2 = gridX + 16 + i * 22, cy2 = syy + 7;
            ctx.fillStyle = 'rgba(10,8,18,0.85)';
            ctx.beginPath(); ctx.arc(cx2, cy2, 9, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = `rgb(${def.color[0]},${def.color[1]},${def.color[2]})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(cx2, cy2, 9, 0, Math.PI * 2); ctx.stroke();
            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = '11px Consolas, monospace';
            ctx.fillStyle = `rgb(${def.color[0]},${def.color[1]},${def.color[2]})`;
            ctx.fillText(def.letter, cx2, cy2 + 4);
            ctx.restore();
        }
    }

    // Countdown banner between bosses
    if (this.nemState === 'countdown') {
        let secs = Math.ceil(Math.max(0, this.nemTimer) / FPS);
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = `${FONT_BIG_SIZE}px Consolas, monospace`;
        ctx.fillStyle = `rgba(${NEON_PURPLE[0]},${NEON_PURPLE[1]},${NEON_PURPLE[2]},0.9)`;
        ctx.fillText(`BOSS ${this.nemDepth} IN ${secs}`, gridX + GRID_W / 2, GRID_H / 3);
        // The order is random now, so tell them what's coming — otherwise there's
        // no way to prep for a shield or a column lock.
        let nextArch = this.nemBossForDepth(this.nemDepth);
        let nextDef = NEM_BOSS_DEFS[nextArch];
        if (nextDef) {
            ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
            ctx.fillStyle = `rgb(${nextDef.color[0]},${nextDef.color[1]},${nextDef.color[2]})`;
            ctx.fillText(nextDef.name, gridX + GRID_W / 2, GRID_H / 3 + 26);
            if (nextDef.gimmickLabel) {
                ctx.fillStyle = `rgba(${nextDef.color[0]},${nextDef.color[1]},${nextDef.color[2]},0.75)`;
                ctx.fillText(nextDef.gimmickLabel, gridX + GRID_W / 2, GRID_H / 3 + 44);
            }
        }
        ctx.restore();
    }

    // Announcement banner ("Nemesis grew: +Hardened", boss intros, pickups)
    if (this.nemAnnounce && this.nemAnnounce.timer > 0) {
        this.nemAnnounce.timer--;
        let a = Math.min(1, this.nemAnnounce.timer / (FPS * 0.5));
        let col = this.nemAnnounce.color || NEON_PURPLE;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = `${FONT_MED_SIZE}px Consolas, monospace`;
        ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${a})`;
        ctx.fillText(this.nemAnnounce.text, gridX + GRID_W / 2, GRID_H / 3 + 34);
        ctx.restore();
    }

    // Mode tag in the side panel
    drawText(ctx, 'NEMESIS MODE', gridX + GRID_W + Math.floor(20 * 1.1), Math.floor(110 * 1.1) + FONT_MED_SIZE, FONT_MED_SIZE, NEON_PURPLE);
}
