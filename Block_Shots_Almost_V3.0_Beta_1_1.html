    if (dmg <= 0) return;
    if (e.nemBoss && e.shieldHp > 0) {
        // Artificer bubble: only mortars and the lazer strike break it
        if (weapon === 'mortar' || weapon === 'lazer') {
            e.shieldHp -= dmg;
            if (e.shieldHp <= 0) { e.hp += e.shieldHp; e.shieldHp = 0; }
        }
        e.lastHitBy = weapon;
        return; // gatling & mines fizzle on the shield
    }
    e.hp -= dmg;
    e.lastHitBy = weapon;
}

// Napalm Mines: burning ground damages enemies standing in it
updateFireZones() {
    if (!this.fireZones || this.fireZones.length === 0) return;
    this.fireZones = this.fireZones.filter(z => {
        z.timer--;
        if (z.timer % 20 === 0) {
            for (let e of this.enemies) {
                if (Math.max(Math.abs(Math.round(e.y) - z.y), Math.abs(e.col - z.x)) <= 2) {
                    this.applyEnemyDamage(e, 1.5 + this.level * 0.5, 'mine');
                }
            }
        }
        if (Math.random() < 0.35) {
            let gridX = LEFT_PANEL_WIDTH;
            let fx = gridX + (z.x + (Math.random() * 4 - 2)) * CELL + CELL / 2;
            let fy = (z.y + (Math.random() * 4 - 2)) * CELL + CELL / 2;
            this.particles.push(new Particle(fx, fy, (Math.random() - 0.5) * 0.4, -Math.random() * 1.2, NEON_ORANGE, Math.floor(FPS * 0.4), 2));
        }
        return z.timer > 0;
    });
}

nemMinionInterval() {
    let base = 8 * FPS * Math.pow(0.96, this.nemDepth - 1);          // creeps faster with depth
    base *= Math.pow(0.8, this.scarCount('vengeful'));               // Vengeful scar: 25% faster per stack
    return Math.max(2.5 * FPS, Math.floor(base));
}

spawnNemMinions() {
    let arch = this.nemCurrentBoss;
    if (!arch) return;
    let mtype = NEM_BOSS_DEFS[arch].minion;
    let count = Math.min(4, 1 + Math.floor(this.nemDepth / 4));
    let quick = this.scarCount('quickened');
    for (let i = 0; i < count; i++) {
        let t = mtype === 'mixed' ? randomChoice(['grunt', 'sprinter', 'brute', 'bomber']) : mtype;
        let en = new Enemy(t, Math.floor(Math.random() * COLS), this.level);
        if (quick > 0) en.baseSpeed *= Math.pow(1.10, quick);
        this.enemies.push(en);
    }
}

// Which archetype shows up at this depth. Cycles are rolled lazily and cached,
// so peeking at the next boss during the countdown doesn't change what arrives.
nemBossForDepth(depth) {
    if (!this.nemBossQueue) this.nemBossQueue = [];
    while (this.nemBossQueue.length < depth) {
        let cycle = nemRollCycle(Math.floor(this.nemBossQueue.length / NEM_ORDER.length));
        // Don't let a cycle boundary serve the same boss twice in a row.
        let last = this.nemBossQueue[this.nemBossQueue.length - 1];
        if (last && cycle[0] === last && cycle.length > 1) {
            let sw = 1 + Math.floor(Math.random() * (cycle.length - 1));
            let tmp = cycle[0]; cycle[0] = cycle[sw]; cycle[sw] = tmp;
        }
        this.nemBossQueue = this.nemBossQueue.concat(cycle);
    }
    return this.nemBossQueue[depth - 1];
}

nemesisSpawnBoss() {
    let depth = this.nemDepth;
    let arch = this.nemBossForDepth(depth);
    this.nemCurrentBoss = arch;
    let boss = new Enemy(arch, Math.floor(COLS / 2), this.level);

    // Depth scaling + scars + All-In
    let depthMult = 1 + 0.12 * (depth - 1);
    boss.maxHp = Math.floor(boss.maxHp * depthMult);
    let hardened = this.scarCount('hardened');
    if (hardened > 0) boss.maxHp = Math.floor(boss.maxHp * Math.pow(1.15, hardened)); // Hardened scar
    if (this.runMods.allinHp > 0) boss.maxHp = Math.floor(boss.maxHp * Math.pow(1.3, this.runMods.allinHp)); // All-In
    boss.hp = boss.maxHp;
    let quick = this.scarCount('quickened');
    if (quick > 0) boss.baseSpeed *= Math.pow(1.10, quick); // Quickened scar

    // Gimmicks: own + recombination past boss 8 + Adaptive scar
    let gimmicks = boss.gimmicks.slice();
    if (depth > NEM_ORDER.length) {
        let others = ['charge', 'lock', 'shield', 'sap', 'flip', 'split', 'tank', 'teleport'].filter(gk => !gimmicks.includes(gk));
        if (others.length) gimmicks.push(randomChoice(others));
    }
    if (this.scarCount('adaptive') > 0 && this.nemPrevGimmick && !gimmicks.includes(this.nemPrevGimmick)) {
        gimmicks.push(this.nemPrevGimmick); // Adaptive scar — the signature chaos
    }
    boss.gimmicks = gimmicks;
    if (gimmicks.length > 1) {
        const prefix = { charge:'CHARGING', lock:'WARDING', shield:'SHIELDED', sap:'SAPPING', flip:'GRAVITY', split:'SPLITTING', tank:'COLOSSAL', teleport:'GLITCHED' };
        boss.bossName = (prefix[gimmicks[1]] || '') + ' ' + boss.bossName;
    }
    if (gimmicks.includes('shield')) { boss.shieldMax = Math.floor(boss.maxHp * 0.5); boss.shieldHp = boss.shieldMax; }
    if (gimmicks.includes('tank')) boss.slowImmune = true;
    this.nemBossGimmicks = gimmicks;
    this.nemPrevGimmick = NEM_BOSS_DEFS[arch].gimmick;
    this.enemies.push(boss);

    // Two flanking minions on arrival
    let mtype = NEM_BOSS_DEFS[arch].minion;
    for (let k of [-3, 3]) {
        let t = mtype === 'mixed' ? randomChoice(['grunt', 'sprinter', 'brute', 'bomber']) : mtype;
        this.enemies.push(new Enemy(t, Math.max(0, Math.min(COLS - 1, boss.col + k)), this.level));
    }

    // Gimmick + pacing timers
    this.nemMinionTimer = this.nemMinionInterval();
    this.nemLockedCols = [];
    this.nemLockTimer = 4 * FPS;
    this.nemGravityFlip = 0;
    this.nemFlipTimer = 6 * FPS;

    // Purple nemesis vignette
    window.vignetteColor = [90, 30, 110];
    window.vignetteTargetIntensity = Math.min(0.7, window.vignetteTargetIntensity + 0.3);
    this.addScreenShake(6);
    this.nemAnnounce = { text: `BOSS ${depth}: ${boss.bossName}`, color: boss.color, timer: 3 * FPS };
}

nemesisBossDefeated() {
    let n = this.nemDepth;
    let pay = nemCoresPerBoss(n);
    if (this.runMods.bounty > 0) { pay = Math.round(pay * Math.pow(1.5, this.runMods.bounty)); this.runMods.bounty = 0; }   // Bounty
    if (this.runMods.allinPay > 0) { pay = Math.round(pay * Math.pow(1.4, this.runMods.allinPay)); this.runMods.allinPay = 0; this.runMods.allinHp = 0; } // All-In
    if (n > (this.metaSave.stats.bestNemDepth || 0)) { pay += 20; this.metaSave.stats.bestNemDepth = n; }                  // first-clear bonus
    this.metaSave.cores += pay;
    saveMeta(this.metaSave);
    this.runCores += pay;
    this.nemLastPayout = pay;

    // Roll a scar — the nemesis remembers
    let pool = NEM_SCAR_DEFS.filter(s => s.id !== 'adaptive' || this.nemPrevGimmick);
    let scar = randomChoice(pool);
    this.scars.push(scar.id);
    if (scar.id === 'reactive') this.reactiveWeapon = this.lastBossKillWeapon || 'gatling';
    this.nemAnnounce = { text: `+${pay} CORES · NEMESIS GREW: +${scar.name.toUpperCase()}`, color: scar.color, timer: 4 * FPS };

    // Clear any lingering gimmick effects
    this.nemLockedCols = [];
    this.nemGravityFlip = 0;
    this.nemBossGimmicks = [];
    this.nemCurrentBoss = null;
    this.nemState = 'reward';
    this.nemTimer = NEM_REWARD_DELAY;
}

openDraft() {
    let owned = (id) => {
        let rm = this.runMods;
        return (id === 'twin' && rm.twin) || (id === 'napalm' && rm.napalm) || (id === 'salvage' && rm.salvage) ||
               (id === 'walls' && rm.walls) || (id === 'glass' && rm.glass);
    };
    let avail = NEM_DRAFT_CARDS.filter(c => !(c.once && owned(c.id)));
    // shuffle copy, take 3
    let deck = avail.slice();
    for (let i = deck.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    this.draftCards = deck.slice(0, 3);
    if (this.draftCards.length === 0) { this.advanceToNextBoss(); return; }
    this.draftCardBounds = [];
    this.draftOpen = true;
    this.nemState = 'draft';
}

pickDraftCard(i) {
    let c = this.draftCards[i];
    if (!c) return;
    let rm = this.runMods;
    switch (c.id) {
        case 'twin': rm.twin = true; break;
        case 'napalm': rm.napalm = true; break;
        case 'siege': rm.siege++; break;
        case 'bounty': rm.bounty++; break;
        case 'salvage': rm.salvage = true; break;
        case 'btime': rm.btCharges += 3; break;
        case 'walls': rm.walls = true; break;
        case 'glass': rm.glass = true; break;
        case 'allin': rm.allinPay++; rm.allinHp++; break;
    }
    this.nemAnnounce = { text: `${c.name.toUpperCase()} ACQUIRED`, color: c.color, timer: 2.5 * FPS };
    this.draftOpen = false;
    this.draftCards = [];
    this.draftCardBounds = [];
    this.advanceToNextBoss();
}

advanceToNextBoss() {
    this.nemDepth++;
    this.nemState = 'countdown';
    this.nemTimer = NEM_COUNTDOWN;
}

// The Nemesis state machine: countdown -> fight -> reward -> draft -> countdown ...
nemesisTick() {
    if (this.nemState === 'countdown') {
        this.nemTimer--;
        this.waveTimer = this.nemTimer; // keep side-panel bar meaningful
        if (this.nemTimer <= 0) {
            this.nemesisSpawnBoss();
            this.nemState = 'fight';
        }
        return;
    }

    if (this.nemState === 'fight') {
        // Minion pressure
        this.nemMinionTimer--;
        if (this.nemMinionTimer <= 0) {
            this.spawnNemMinions();
            this.nemMinionTimer = this.nemMinionInterval();
        }

        // Warden: column locks (6s on, 8s off)
        if (this.nemBossGimmicks.includes('lock')) {
            this.nemLockTimer--;
            if (this.nemLockedCols.length > 0) {
                if (this.nemLockTimer <= 0) { this.nemLockedCols = []; this.nemLockTimer = 8 * FPS; }
            } else if (this.nemLockTimer <= 0) {
                let pool = [0, 1, 2, 3, 6, 7, 8, 9].filter(c => c < COLS);
                let a = randomChoice(pool);
                let b = randomChoice(pool.filter(c => c !== a));
                this.nemLockedCols = [a, b];
                this.nemLockTimer = 6 * FPS;
            }
        } else if (this.nemLockedCols.length) {
            this.nemLockedCols = [];
        }

        // Inverter: gravity flip bursts (2.5s on, ~9s cycle)
        if (this.nemBossGimmicks.includes('flip')) {
            if (this.nemGravityFlip > 0) {
                this.nemGravityFlip--;
            } else {
                this.nemFlipTimer--;
                if (this.nemFlipTimer <= 0) {
                    this.nemGravityFlip = Math.floor(2.5 * FPS);
                    this.nemFlipTimer = 9 * FPS;
                }
            }
        } else {
            this.nemGravityFlip = 0;
        }

        // Hivemind: split into 3 at half health
        for (let i = this.enemies.length - 1; i >= 0; i--) {
            let e = this.enemies[i];
            if (e.nemBoss && e.gimmicks && e.gimmicks.includes('split') && !e.didSplit && e.hp > 0 && e.hp <= e.maxHp / 2) {
                e.didSplit = true;
                let [sx, sy] = e.getPositionAtMs(Date.now());
                this.spawnExplosionParticles(sx, sy, e.color, 30, 3.0);
                this.addScreenShake(8);
                let baseCol = e.col, baseY = Math.min(ROWS - 1, Math.round(e.y));
                let quick = this.scarCount('quickened');
                this.enemies.splice(i, 1);
                for (let k = -1; k <= 1; k++) {
                    let child = new Enemy('hivespawn', Math.max(0, Math.min(COLS - 1, baseCol + k * 2)), this.level);
                    child.maxHp = Math.max(10, Math.floor(e.maxHp * 0.3));
                    child.hp = child.maxHp;
                    child.y = Math.min(ROWS - 1, baseY + Math.abs(k));
                    if (quick > 0) child.baseSpeed *= Math.pow(1.10, quick);
                    this.enemies.push(child);
                }
            }
        }

        // Boss down?
        let bossesAlive = this.enemies.some(e => e.nemBoss);
        if (!bossesAlive) this.nemesisBossDefeated();
        return;
    }

    if (this.nemState === 'reward') {
        this.nemTimer--;
        if (this.nemTimer <= 0) this.openDraft();
        return;
    }
    // 'draft' state: gameTick doesn't run while draftOpen pauses the loop
}

// ---- Nemesis HUD: boss bar, gimmick effects, scars, depth, announcements ----
drawNemesisHUD() {
    let ctx = this.ctx;
    let gridX = LEFT_PANEL_WIDTH;

    // Warden locked columns
    if (this.nemLockedCols && this.nemLockedCols.length > 0) {
        let flash = 0.10 + 0.08 * Math.sin(this.ticks * 0.2);
        for (let c of this.nemLockedCols) {
            ctx.fillStyle = `rgba(255,60,80,${flash})`;
            ctx.fillRect(gridX + c * CELL, 0, CELL, GRID_H);
            ctx.strokeStyle = 'rgba(255,80,100,0.8)';
            ctx.lineWidth = 2;
            ctx.strokeRect(gridX + c * CELL + 2, 2, CELL - 4, GRID_H - 4);
        }
    }

    // Inverter gravity-flip tint
    if (this.nemGravityFlip > 0) {
        ctx.fillStyle = 'rgba(90,230,230,0.08)';
        ctx.fillRect(gridX, 0, GRID_W, GRID_H);
        ctx.save(); ctx.textAlign = 'center';
        ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
        ctx.fillStyle = 'rgb(90,230,230)';
        ctx.fillText('▲ GRAVITY FLIPPED ▲', gridX + GRID_W / 2, GRID_H - 30);
        ctx.restore();
    }

    // Napalm fire zones
    for (let z of this.fireZones) {
        let alpha = 0.10 + 0.06 * Math.sin(this.ticks * 0.3 + z.x);
        ctx.fillStyle = `rgba(255,120,30,${alpha})`;
        ctx.fillRect(gridX + Math.max(0, z.x - 2) * CELL, Math.max(0, z.y - 2) * CELL, CELL * 5, CELL * 5);
    }

    // Boss health bar across the top (sums the Hivemind's splits)
    let group = this.enemies.filter(e => e.nemBoss);
    if (group.length > 0) {
        let lead = group.find(e => e.etype !== 'hivespawn') || group[0];
        let hp = group.reduce((s, e) => s + Math.max(0, e.hp), 0);
        let maxHp = group.reduce((s, e) => s + e.maxHp, 0) || 1;
        let bw = GRID_W - 20, bx = gridX + 10, by = 6, bh = 14;
        ctx.fillStyle = 'rgba(10,8,18,0.85)';
        ctx.fillRect(bx - 4, by - 4, bw + 8, bh + 28);
        ctx.fillStyle = 'rgb(40,40,60)';
        ctx.fillRect(bx, by, bw, bh);
        let [br2, bg2, bb2] = lead.color;
        ctx.fillStyle = `rgb(${br2},${bg2},${bb2})`;
        ctx.fillRect(bx, by, Math.floor(bw * Math.max(0, Math.min(1, hp / maxHp))), bh);
        if (lead.shieldHp > 0 && lead.shieldMax > 0) {
            ctx.fillStyle = 'rgba(140,200,255,0.9)';
            ctx.fillRect(bx, by + bh - 4, Math.floor(bw * Math.min(1, lead.shieldHp / lead.shieldMax)), 4);
        }
        ctx.strokeStyle = `rgb(${br2},${bg2},${bb2})`;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(bx, by, bw, bh);
        let glabel = (lead.gimmicks || []).map(gk => NEM_GIMMICK_LABEL[gk] || gk).join(' + ');
        drawText(ctx, `${lead.bossName}${glabel ? ' — ' + glabel : ''}`, bx, by + bh + 16, FONT_SMALL_SIZE, [br2, bg2, bb2]);
    }

    // Depth / run Cores / Bullet Time charges (top-right of grid)
    ctx.save();
    ctx.textAlign = 'right';
    ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
    let infoY = group.length > 0 ? 58 : 18;
    ctx.fillStyle = `rgb(${NEON_PURPLE[0]},${NEON_PURPLE[1]},${NEON_PURPLE[2]})`;
    ctx.fillText(`BOSS ${this.nemDepth}`, gridX + GRID_W - 8, infoY);
    ctx.fillStyle = `rgb(${NEON_YELLOW[0]},${NEON_YELLOW[1]},${NEON_YELLOW[2]})`;
    ctx.fillText(`RUN CORES: ${this.runCores}`, gridX + GRID_W - 8, infoY + 18);
    if (this.runMods.btCharges > 0) {
        ctx.fillStyle = `rgb(${NEON_CYAN[0]},${NEON_CYAN[1]},${NEON_CYAN[2]})`;
        ctx.fillText(`BULLET TIME x${this.runMods.btCharges} (B)`, gridX + GRID_W - 8, infoY + 36);
    }
    ctx.restore();

    // Scar row (bottom-left of grid)
    if (this.scars.length > 0) {
        let syy = GRID_H - 22;
        for (let i = 0; i < this.scars.length && i < 16; i++) {
            let def = NEM_SCAR_DEFS.find(s => s.id === this.scars[i]);
            if (!def) continue;
            let cx2 = gridX + 16 + i * 22, cy2 = syy + 7;
            ctx.fillStyle = 'rgba(10,8,18,0.85)';
            ctx.beginPath(); ctx.arc(cx2, cy2, 9, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = `rgb(${def.color[0]},${def.color[1]},${def.color[2]})`;
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(cx2, cy2, 9, 0, Math.PI * 2); ctx.stroke();
            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = '11px Consolas, monospace';
            ctx.fillStyle = `rgb(${def.color[0]},${def.color[1]},${def.color[2]})`;
            ctx.fillText(def.letter, cx2, cy2 + 4);
            ctx.restore();
        }
    }

    // Countdown banner between bosses
    if (this.nemState === 'countdown') {
        let secs = Math.ceil(Math.max(0, this.nemTimer) / FPS);
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = `${FONT_BIG_SIZE}px Consolas, monospace`;
        ctx.fillStyle = `rgba(${NEON_PURPLE[0]},${NEON_PURPLE[1]},${NEON_PURPLE[2]},0.9)`;
        ctx.fillText(`BOSS ${this.nemDepth} IN ${secs}`, gridX + GRID_W / 2, GRID_H / 3);
        // The order is random now, so tell them what's coming — otherwise there's
        // no way to prep for a shield or a column lock.
        let nextArch = this.nemBossForDepth(this.nemDepth);
        let nextDef = NEM_BOSS_DEFS[nextArch];
        if (nextDef) {
            ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
            ctx.fillStyle = `rgb(${nextDef.color[0]},${nextDef.color[1]},${nextDef.color[2]})`;
            ctx.fillText(nextDef.name, gridX + GRID_W / 2, GRID_H / 3 + 26);
            if (nextDef.gimmickLabel) {
                ctx.fillStyle = `rgba(${nextDef.color[0]},${nextDef.color[1]},${nextDef.color[2]},0.75)`;
                ctx.fillText(nextDef.gimmickLabel, gridX + GRID_W / 2, GRID_H / 3 + 44);
            }
        }
        ctx.restore();
    }

    // Announcement banner ("Nemesis grew: +Hardened", boss intros, pickups)
    if (this.nemAnnounce && this.nemAnnounce.timer > 0) {
        this.nemAnnounce.timer--;
        let a = Math.min(1, this.nemAnnounce.timer / (FPS * 0.5));
        let col = this.nemAnnounce.color || NEON_PURPLE;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = `${FONT_MED_SIZE}px Consolas, monospace`;
        ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${a})`;
        ctx.fillText(this.nemAnnounce.text, gridX + GRID_W / 2, GRID_H / 3 + 34);
        ctx.restore();
    }

    // Mode tag in the side panel
    drawText(ctx, 'NEMESIS MODE', gridX + GRID_W + Math.floor(20 * 1.1), Math.floor(110 * 1.1) + FONT_MED_SIZE, FONT_MED_SIZE, NEON_PURPLE);
}

// ---- Between-boss draft overlay: 3 cards, pick 1 ----
drawDraftOverlay() {
    let ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = 'rgba(8,6,15,0.82)';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    ctx.textAlign = 'center';
    ctx.font = `${FONT_BIG_SIZE}px Consolas, monospace`;
    ctx.fillStyle = `rgb(${NEON_PURPLE[0]},${NEON_PURPLE[1]},${NEON_PURPLE[2]})`;
    ctx.fillText('CHOOSE A MODIFIER', SCREEN_W / 2, SCREEN_H / 2 - 170);
    ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
    ctx.fillStyle = 'rgb(180,170,205)';
    ctx.fillText(`Boss ${this.nemDepth} down  ·  +${this.nemLastPayout} Cores banked  ·  run total: ${this.runCores}`, SCREEN_W / 2, SCREEN_H / 2 - 140);

    let cw = 230, chh = 220, gap = 26;
    let total = this.draftCards.length * cw + (this.draftCards.length - 1) * gap;
    let startX = (SCREEN_W - total) / 2;
    let cy = SCREEN_H / 2 - 100;
    this.draftCardBounds = [];
    for (let i = 0; i < this.draftCards.length; i++) {
        let card = this.draftCards[i];
        let cx = startX + i * (cw + gap);
        this.draftCardBounds.push({ x: cx, y: cy, w: cw, h: chh });
        let hot = this.mouseX >= cx && this.mouseX <= cx + cw && this.mouseY >= cy && this.mouseY <= cy + chh;
        ctx.fillStyle = hot ? 'rgba(40,28,64,0.97)' : 'rgba(18,12,30,0.97)';
        drawRoundedRect(ctx, cx, cy, cw, chh, 14);
        ctx.fill();
        neonRoundedRect(ctx, cx, cy, cw, chh, card.color, 14, 2, hot ? 8 : 4);
        ctx.textAlign = 'center';
        ctx.font = `${FONT_MED_SIZE}px Consolas, monospace`;
        ctx.fillStyle = `rgb(${card.color[0]},${card.color[1]},${card.color[2]})`;
        ctx.fillText(card.name, cx + cw / 2, cy + 44);
        ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
        ctx.fillStyle = 'rgb(225,220,240)';
        let words = card.desc.split(' '), line = '', yy = cy + 84;
        for (let w of words) {
            let test = line ? line + ' ' + w : w;
            if (ctx.measureText(test).width > cw - 30) { ctx.fillText(line, cx + cw / 2, yy); yy += 20; line = w; }
            else line = test;
        }
        if (line) ctx.fillText(line, cx + cw / 2, yy);
        ctx.fillStyle = 'rgba(180,170,205,0.7)';
        ctx.fillText(`[${i + 1}]`, cx + cw / 2, cy + chh - 16);
    }
    ctx.restore();
}

            drawPiecePreviewBox(kind, boxX, boxY, boxW, boxH) {

                let minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);

                let baseY = boxY + (boxH - shapeHeight * cellSize) / 2;

                    let rw = cellSize - 4, rh = cellSize - 4;
                    neonRect(ctx, rx, ry, rw, rh, color, 2);

                            let color = cell['buffed'] ? darkenColor(baseColor, HELPER_BUFF_DARKNESS) : baseColor;

                                let fillHeight = Math.floor(rh * hpFrac);
                                ctx.fillRect(rx, ry + (rh - fillHeight), rw, fillHeight);
                            }
                            if (shape === 'O') {
                                let frac = Math.max(0, (cell['oTimer'] || O_TIMER_FRAMES) / O_TIMER_FRAMES);
                                let cx = gridX + x * CELL + CELL / 2, cy = y * CELL + CELL / 2;

                                    ctx.fillStyle = `rgba(${r},${g},${b},0.01)`;

    drawText(ctx, `${Math.floor(this.waveTimer / FPS)}s`, sx + Math.floor(20 * 1.1), Math.floor(200 * 1.1) + FONT_SMALL_SIZE, FONT_SMALL_SIZE);

    // Key legend
    drawText(ctx, "KEY:", sx + Math.floor(20 * 1.1), Math.floor(230 * 1.1) + FONT_MED_SIZE, FONT_MED_SIZE);
    let yOff = Math.floor(270 * 1.1);
    for (let [col, desc] of LEGEND) {
        ctx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
        ctx.fillRect(sx + Math.floor(24 * 1.1), yOff, Math.floor(20 * 1.1), Math.floor(16 * 1.1));
        drawText(ctx, desc, sx + Math.floor(52 * 1.1), yOff - Math.floor(2 * 1.1) + FONT_SMALL_SIZE, FONT_SMALL_SIZE, col);
        yOff += Math.floor(26 * 1.1);
    }

    // Enemy section
    drawText(ctx, "ENEMIES:", sx + Math.floor(20 * 1.1), yOff + Math.floor(8 * 1.1) + FONT_MED_SIZE, FONT_MED_SIZE);
    yOff += Math.floor(32 * 1.1);

// FIXED: Calculate and display level-scaled stats
let levelMultiplier;
if (this.level <= 10) {
    levelMultiplier = 1.0 + (this.level - 1) * 0.05; // 5% for levels 1-10
} else {
    // 5% for first 10 levels, then 2.5% for each level beyond 10
    levelMultiplier = 1.0 + 9 * 0.05 + (this.level - 10) * 0.025;
}

for (let key of Object.keys(ENEMY_DEFS)) {
    let d = ENEMY_DEFS[key];
    
    // Calculate scaled stats
let scaledHp = Math.floor(d.hp * levelMultiplier);
// Artillery doesn't scale in speed, only health and damage
let scaledSpeed = (key === 'artillery' || key === 'tank') ? d.speed : d.speed * levelMultiplier;
let scaledDamage = d.damage * levelMultiplier;
    
    // Format for display - round down if bonus is less than 0.1
    let displaySpeed = (scaledSpeed * 100);
    let displayDamage = (scaledDamage * 10);
    
    // Round down if the difference is less than 0.1 (visually only)
    if ((displaySpeed % 1) < 0.1) displaySpeed = Math.floor(displaySpeed);
    if ((displayDamage % 1) < 0.1) displayDamage = Math.floor(displayDamage);
    
    // Format to remove unnecessary decimals
    let spdText = displaySpeed.toFixed(1).replace(/\.0$/, '');
    let dmgText = displayDamage.toFixed(1).replace(/\.0$/, '');
    
    let line = `${capitalize(key)} HP:${scaledHp} SPD:${spdText} DMG:${dmgText}`;
    if (key === 'juggernaut') line += " (Armored)";
    if (key === 'miner') line += " (Semi Armored)";
    if (key === 'tank') line += " (Semi Armored)";
    if (key === 'artillery') line += " (Mine Armored)";
    
    // Use red color for artillery, original color for others
    let textColor = (key === 'artillery') ? BRIGHT_RED : d.color;
    
    drawText(ctx, line, sx + Math.floor(24 * 1.1), yOff + FONT_SMALL_SIZE, FONT_SMALL_SIZE, textColor);
    yOff += Math.floor(18 * 1.1);
}

            draw() {
    // 1. Save the original, unshaken state of the canvas
    this.ctx.save();

    // 2. Apply the screen shake translation if there is any active shake
    if (this.screenShake > 0) {
        let shakeX = (Math.random() - 0.5) * this.screenShake;
        let shakeY = (Math.random() - 0.5) * this.screenShake;
        this.ctx.translate(shakeX, shakeY);
    }
    
    // --- ALL YOUR DRAWING LOGIC IS NOW DRAWN IN THE "SHAKEN" POSITION ---

    // Clear the entire canvas with the background color
    this.ctx.fillStyle = `rgb(${DARK_PURPLE[0]},${DARK_PURPLE[1]},${DARK_PURPLE[2]})`;
    this.ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

    // Draw each section
    this.drawLeftPanel();
    this.drawBoard();
    this.drawSidePanel();

    // Draw overlays (enemies, projectiles, particles)
    for (let e of this.enemies) e.draw(this.ctx);
    for (let p of this.projectiles) p.draw(this.ctx);
    for (let m of this.mortarProjectiles) {
        let t = m['t'];
        let qx = (1 - t) ** 2 * m.sx + 2 * (1 - t) * t * ((m.sx + m.tx) / 2) + t ** 2 * m.tx;
        let qy = (1 - t) ** 2 * m.sy + 2 * (1 - t) * t * (m.sy - Math.min(120, Math.abs(m.tx - m.sx) / 2 + 60)) + t ** 2 * m.ty;
        this.ctx.fillStyle = `rgb(${m.color[0]},${m.color[1]},${m.color[2]})`;
        this.ctx.beginPath(); this.ctx.arc(Math.floor(qx), Math.floor(qy), 4.2, 0, Math.PI * 2); this.ctx.fill();
    }
    for (let p of this.particles) p.draw(this.ctx);
    
    // Draw orbital strike effects
    for (let effect of this.orbitalStrikeEffects) {
        effect.draw(this.ctx);
    }

    // NEMESIS: HUD (boss bar, gimmick telegraphs, scars, depth, banners)
    if (this.mode === 'nemesis' && !this.gameOver) {
        this.drawNemesisHUD();
    }

    // Add this at the end of the draw() method
    drawText(this.ctx, this.currentFps.toString(), 5, 15, 12, WHITE);

    // Draw game state overlays (paused, game over)
    if (this.paused) {
        this.ctx.fillStyle = 'rgba(0,0,0,0.5)'; this.ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
        drawText(this.ctx, "PAUSED", SCREEN_W / 2 - Math.floor(40 * 1.1), SCREEN_H / 2 - Math.floor(20 * 1.1) + FONT_BIG_SIZE, FONT_BIG_SIZE, NEON_YELLOW); // 10% larger
    }
    if (this.gameOver) {
        // All of your existing game over logic...
        if (!this.gameOverAnimationStarted) {
            this.gameOverAnimationStarted = true;
            if (this.mode === 'nemesis') {
                // NEMESIS: Cores were banked per boss kill — only Liquidation pays out at death
                let liqBonus = 0;
                if (this.meta && this.meta.liqPer500 > 0) liqBonus = Math.floor(this.scraps / 500) * this.meta.liqPer500;
                this.metaSave.cores += liqBonus;
                this.runCores += liqBonus;
                this.lastCoresEarned = this.runCores;
                this.metaSave.stats.totalRuns += 1;
                saveMeta(this.metaSave);
            } else {
            // --- Award persistent Cores (survival-based; never from score) ---
            let coresEarned = this.waveNumber + 3 * this.bossKills + 2 * Math.floor(this.waveNumber / 5);
            if (this.waveNumber > this.metaSave.stats.bestWave) { coresEarned += 5; this.metaSave.stats.bestWave = this.waveNumber; }
            if (this.meta && this.meta.liqPer500 > 0) coresEarned += Math.floor(this.scraps / 500) * this.meta.liqPer500;
            this.metaSave.cores += coresEarned;
            this.metaSave.stats.totalRuns += 1;
            this.lastCoresEarned = coresEarned;
            saveMeta(this.metaSave);
            }
            this.gameOverFadeAlpha = 0;
            this.spawnEnhancedCelebration(this.score);
            this.gameOverAnimTime = 0;
            this.scoreDisplayValue = 0;
            this.levelDisplayValue = 0;
            this.waveDisplayValue = 0;
            this.scrapsDisplayValue = 0;
            this.totalScrapsDisplayValue = 0;
            this.circuitPatternCache = null;
        }
        if (this.gameOverFadeAlpha < 0.85) {
            this.gameOverFadeAlpha += 0.02;
        }
        this.gameOverAnimTime += 0.016;
        if (this.restartButtonHovered) {
            this.restartButtonHoverTransition = Math.min(1, this.restartButtonHoverTransition + 0.1);
        } else {
            this.restartButtonHoverTransition = Math.max(0, this.restartButtonHoverTransition - 0.1);
        }
        this.updateStatCounters();
        this.drawAnimatedBackground();
        this.drawAllParticles();
        let breathe = 0.65 + 0.08 * Math.sin(this.gameOverAnimTime * 1.5);
        this.ctx.fillStyle = `rgba(0,0,0,${breathe * this.gameOverFadeAlpha})`;
        this.ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
        let panelWidth = Math.floor(500 * 1.1);
        let panelHeight = Math.floor(350 * 1.1);
        let panelX = SCREEN_W / 2 - panelWidth / 2;
        let panelY = SCREEN_H / 2 - panelHeight / 2;
        this.drawEdgeGlow();
        this.drawGlassmorphismPanel(panelX, panelY, panelWidth, panelHeight);
        this.drawAchievementBadges(panelX, panelY - 60);
        this.drawGameOverHeader(panelX, panelY, panelWidth);
        this.drawStatBoxGrid(panelX, panelY, panelWidth, panelHeight);
        this.drawGameOverFooter(panelX, panelY, panelWidth, panelHeight);
        this.ctx.save();
        this.ctx.textAlign = 'left';
        this.ctx.restore();
    }

    // Draw the skill tree pop-up on top of everything
    if (this.skillTreeOpen) {
        this.drawSkillTree();
    }

    // NEMESIS: between-boss draft on top of everything
    if (this.draftOpen) {
        this.drawDraftOverlay();
    }

    // 3. Finally, restore the canvas to its original, unshaken state.
    // This happens *after* everything has been drawn for the frame.
    this.ctx.restore();
}

            
    // Enhanced Game Over Helper Methods
    updateStatCounters() {
        // Smooth animated counters
        if (this.scoreDisplayValue < this.score) {
            let increment = Math.max(1, Math.floor((this.score - this.scoreDisplayValue) * 0.08));
            this.scoreDisplayValue += increment;
            if (this.scoreDisplayValue > this.score) this.scoreDisplayValue = this.score;
        }
        
        let targetLevel = this.level || 1;
        if (this.levelDisplayValue < targetLevel) {
            this.levelDisplayValue += Math.max(1, Math.floor((targetLevel - this.levelDisplayValue) * 0.1));
            if (this.levelDisplayValue > targetLevel) this.levelDisplayValue = targetLevel;
        }
        
        let targetWave = this.waveNumber || 1; // Use the correct variable "this.waveNumber"
if (this.waveDisplayValue < targetWave) {
    this.waveDisplayValue += Math.max(1, Math.floor((targetWave - this.waveDisplayValue) * 0.1));
    if (this.waveDisplayValue > targetWave) this.waveDisplayValue = targetWave;
}
        
        let targetScraps = this.scraps || 0;
        if (this.scrapsDisplayValue < targetScraps) {
            this.scrapsDisplayValue += Math.max(1, Math.floor((targetScraps - this.scrapsDisplayValue) * 0.12));
            if (this.scrapsDisplayValue > targetScraps) this.scrapsDisplayValue = targetScraps;
        }
        
        let targetTotalScraps = this.totalScrapsEarned || 0;
        if (this.totalScrapsDisplayValue < targetTotalScraps) {
            this.totalScrapsDisplayValue += Math.max(1, Math.floor((targetTotalScraps - this.totalScrapsDisplayValue) * 0.12));
            if (this.totalScrapsDisplayValue > targetTotalScraps) this.totalScrapsDisplayValue = targetTotalScraps;
        }
    }
    
    drawAnimatedBackground() {
        let time = this.gameOverAnimTime;
        let alpha = this.gameOverFadeAlpha * 0.25;
        
        // Score-based gradient colors
        let gradientColors = this.getScoreTierGradients();
        
        // Multiple shifting gradients
        for (let i = 0; i < 3; i++) {
            let gradient = this.ctx.createRadialGradient(
                SCREEN_W/2 + Math.sin(time * 0.8 + i * 2.1) * 120,
                SCREEN_H/2 + Math.cos(time * 0.6 + i * 1.7) * 100,
                0,
                SCREEN_W/2 + Math.sin(time * 0.8 + i * 2.1) * 120,
                SCREEN_H/2 + Math.cos(time * 0.6 + i * 1.7) * 100,
                350
            );
            
            let [r, g, b] = gradientColors[i % gradientColors.length];
            gradient.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
            gradient.addColorStop(1, `rgba(${r},${g},${b},0)`);
            
            this.ctx.fillStyle = gradient;
            this.ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
        }
    }
    
    getScoreTierGradients() {
        if (this.score >= 15000) return [NEON_MAGENTA, NEON_PURPLE, NEON_CYAN];
        if (this.score >= 10000) return [NEON_GREEN, NEON_CYAN, NEON_BLUE];
        if (this.score >= 5000) return [NEON_YELLOW, NEON_ORANGE, NEON_RED];
        if (this.score >= 3000) return [NEON_CYAN, NEON_BLUE, WHITE];
        return [DARK_GRAY, WHITE, NEON_CYAN];
    }
    
    drawAllParticles() {
        // Glass shards first (background)
        this.glassShards.forEach(s => s.draw(this.ctx));
        
        // Energy wisps
        this.energyWisps.forEach(w => w.draw(this.ctx));
        
        // Geometric particles
        this.geometricParticles.forEach(p => p.draw(this.ctx));
        
        // Traditional confetti on top
        this.confetti.forEach(c => c.draw(this.ctx));
    }
    
    drawEdgeGlow() {
        let time = this.gameOverAnimTime;
        let intensity = (0.25 + 0.15 * Math.sin(time * 1.2)) * this.gameOverFadeAlpha;
        let [r, g, b] = this.score >= 15000 ? NEON_MAGENTA : NEON_CYAN;
        
        // Top edge glow
        let topGrad = this.ctx.createLinearGradient(0, 0, 0, 60);
        topGrad.addColorStop(0, `rgba(${r},${g},${b},${intensity})`);
        topGrad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        this.ctx.fillStyle = topGrad;
        this.ctx.fillRect(0, 0, SCREEN_W, 60);
        
        // Bottom edge glow
        let bottomGrad = this.ctx.createLinearGradient(0, SCREEN_H-60, 0, SCREEN_H);
        bottomGrad.addColorStop(0, `rgba(${r},${g},${b},0)`);
        bottomGrad.addColorStop(1, `rgba(${r},${g},${b},${intensity})`);
        this.ctx.fillStyle = bottomGrad;
        this.ctx.fillRect(0, SCREEN_H-60, SCREEN_W, 60);
        
        // Left and right edges
        let sideIntensity = intensity * 0.6;
        let leftGrad = this.ctx.createLinearGradient(0, 0, 60, 0);
        leftGrad.addColorStop(0, `rgba(${r},${g},${b},${sideIntensity})`);
        leftGrad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        this.ctx.fillStyle = leftGrad;
        this.ctx.fillRect(0, 0, 60, SCREEN_H);
        
        let rightGrad = this.ctx.createLinearGradient(SCREEN_W-60, 0, SCREEN_W, 0);
        rightGrad.addColorStop(0, `rgba(${r},${g},${b},0)`);
        rightGrad.addColorStop(1, `rgba(${r},${g},${b},${sideIntensity})`);
        this.ctx.fillStyle = rightGrad;
        this.ctx.fillRect(SCREEN_W-60, 0, 60, SCREEN_H);
    }
    
    drawGlassmorphismPanel(panelX, panelY, panelWidth, panelHeight) {
        this.ctx.save();
        
        // Multiple glass layers for depth
        for (let i = 0; i < 4; i++) {
            let offset = i * 3;
            let alpha = (0.12 - i * 0.02) * this.gameOverFadeAlpha;
            
            this.ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            drawRoundedRect(this.ctx, panelX - offset, panelY - offset, 
                       panelWidth + offset*2, panelHeight + offset*2, 25);
            this.ctx.fill();
        }
        
        // Enhanced neon border
        let borderGlow = 15 * this.gameOverFadeAlpha;
        neonRoundedRect(this.ctx, panelX, panelY, panelWidth, panelHeight, 
                       [40, 40, 80], 25, 4, borderGlow);
        
        // Subtle circuit pattern overlay
        this.drawCircuitPattern(panelX, panelY, panelWidth, panelHeight);
        
        this.ctx.restore();
    }
    
    drawCircuitPattern(x, y, w, h) {
        // Generate stable circuit pattern using deterministic positions
        if (!this.circuitPatternCache) {
            this.circuitPatternCache = this.generateCircuitPattern(w, h);
        }
        
        let alpha = this.gameOverFadeAlpha * 0.06; // Reduced opacity
        this.ctx.strokeStyle = `rgba(120,160,255,${alpha})`;
        this.ctx.lineWidth = 1;
        
        // Draw cached pattern
        this.circuitPatternCache.forEach(line => {
            this.ctx.beginPath();
            this.ctx.moveTo(x + line.x1, y + line.y1);
            this.ctx.lineTo(x + line.x2, y + line.y2);
            this.ctx.stroke();
        });
    }
    
    generateCircuitPattern(w, h) {
        let lines = [];
        let spacing = 40;
        
        // Create more comprehensive deterministic pattern
        // Vertical lines
        for (let i = spacing; i < w - spacing; i += spacing) {
            // Use different patterns to create variety
            if (i % (spacing * 2) === 0 || (i + spacing/2) % (spacing * 3) === 0) {
                lines.push({x1: i, y1: 25, x2: i, y2: h - 25});
            }
        }
        
        // Horizontal lines  
        for (let j = spacing; j < h - spacing; j += spacing) {
            if (j % (spacing * 2) === spacing || (j + spacing/3) % (spacing * 2) === 0) {
                lines.push({x1: 25, y1: j, x2: w - 25, y2: j});
            }
        }
        
        // Add some connecting nodes/dots
        for (let i = spacing; i < w - spacing; i += spacing * 2) {
            for (let j = spacing; j < h - spacing; j += spacing * 2) {
                if ((i + j) % (spacing * 3) === 0) {
                    // Small cross pattern
                    lines.push({x1: i - 5, y1: j, x2: i + 5, y2: j});
                    lines.push({x1: i, y1: j - 5, x2: i, y2: j + 5});
                }
            }
        }
        
        return lines;
    }
    
    drawAchievementBadges(x, y) {
        if (this.achievementBadges.length === 0) return;
        
        let badgeSpacing = 70;
        let startX = x + (500 * 1.1) / 2 - (this.achievementBadges.length * badgeSpacing) / 2;
        
        this.achievementBadges.forEach((badge, i) => {
            badge.animTime += 0.02;
            let scale = 0.9 + 0.15 * Math.sin(badge.animTime * 3 + i);
            
            this.ctx.save();
            this.ctx.translate(startX + i * badgeSpacing, y);
            this.ctx.scale(scale, scale);
            
            // Badge glow
            let [r, g, b] = badge.color;
            this.ctx.fillStyle = `rgba(${r},${g},${b},${this.gameOverFadeAlpha * 0.4})`;
            this.ctx.strokeStyle = `rgba(${r},${g},${b},${this.gameOverFadeAlpha})`;
            this.ctx.lineWidth = 3;
            
            this.ctx.beginPath();
            this.ctx.arc(0, 0, 30, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.stroke();
            
            // Badge star icon
            this.ctx.fillStyle = `rgba(${r},${g},${b},${this.gameOverFadeAlpha})`;
            this.drawStar(this.ctx, 0, 0, 16);
            
            this.ctx.restore();
        });
    }
    
    drawStar(ctx, x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            let angle = (i * 4 * Math.PI) / 5;
            let radius = i % 2 === 0 ? size : size * 0.5;
            let px = Math.cos(angle) * radius;
            let py = Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
    
    drawGameOverHeader(panelX, panelY, panelWidth) {
        let headerY = panelY + 40;
        let alpha = Math.max(0, (this.gameOverFadeAlpha - 0.2) * 1.25);
        
        if (alpha <= 0) return;
        
        // "GAME OVER" with scale animation
        let scale = 0.7 + 0.3 * Math.min(1, this.gameOverAnimTime * 1.5);
        this.ctx.save();
        this.ctx.translate(panelX + panelWidth/2, headerY);
        this.ctx.scale(scale, scale);
        
        this.ctx.fillStyle = `rgba(${NEON_RED[0]},${NEON_RED[1]},${NEON_RED[2]},${alpha})`;
        this.ctx.font = `${FONT_BIG_SIZE}px Consolas, monospace`;
        this.ctx.textAlign = 'center';

        this.ctx.restore();
        
        // Celebration subtitle
        let celebTitle = this.getCelebrationTitle(this.score);
        let titleColor = this.getTitleColor();
        
        this.ctx.save();
        this.ctx.fillStyle = `rgba(${titleColor[0]},${titleColor[1]},${titleColor[2]},${alpha})`;
        this.ctx.font = `${FONT_MED_SIZE}px Consolas, monospace`;
        this.ctx.textAlign = 'center';
        this.ctx.fillText(celebTitle, panelX + panelWidth/2, headerY + 35); // Moved closer to GAME OVER text

    getTitleColor() {
        if (this.score >= 15000) return NEON_MAGENTA;

        if (this.score >= 3000) return NEON_CYAN;

            },

    drawStatBox(stat, width, height, progress) {
        // Slide-in animation
        let slideOffset = (1 - this.easeOutCubic(progress)) * 100;
        let currentX = stat.x + slideOffset;
        
        let alpha = this.gameOverFadeAlpha * progress;
        let [r, g, b] = stat.color;
        
        // Glassmorphism stat box

        // Box background with glass effect
this.ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.08})`;
drawRoundedRect(this.ctx, currentX, stat.y, width, height, 15); // Corrected function name
this.ctx.fill();
        
        // Neon border
        neonRoundedRect(this.ctx, currentX, stat.y, width, height, stat.color, 15, 2, 8 * alpha);

        this.ctx.font = `${FONT_MED_SIZE}px Consolas, monospace`;

        this.ctx.fillText(stat.label, currentX + 50, stat.y + 25);
        
        // Value with glow effect (full opacity)
        this.ctx.fillStyle = `rgba(${r},${g},${b},${progress})`;
        this.ctx.font = `${FONT_BIG_SIZE * 0.7}px Consolas, monospace`;
        this.ctx.shadowColor = `rgba(${r},${g},${b},0.6)`;
        this.ctx.shadowBlur = 8;
        this.ctx.fillText(stat.value, currentX + 50, stat.y + 55);
        this.ctx.shadowBlur = 0;
        
        this.ctx.restore();
    }
    
    drawGameOverFooter(panelX, panelY, panelWidth, panelHeight) {
        let footerY = panelY + panelHeight - 90; // Moved up 50px to compensate for taller panel
        let alpha = Math.max(0, (this.gameOverFadeAlpha - 0.3) * 1.4);
        
        if (alpha <= 0) return;
        
        // Game over reason - larger text
        this.ctx.save();
        this.ctx.fillStyle = `rgba(${NEON_CYAN[0]},${NEON_CYAN[1]},${NEON_CYAN[2]},${alpha * 0.7})`;
        this.ctx.font = `${FONT_MED_SIZE}px Consolas, monospace`;
        this.ctx.textAlign = 'center';
        this.ctx.fillText(`Ended: ${this.gameOverReason}`, panelX + panelWidth/2, footerY);

        // NEMESIS: run summary — depth reached + Cores banked
        if (this.mode === 'nemesis') {
            this.ctx.fillStyle = `rgba(${NEON_PURPLE[0]},${NEON_PURPLE[1]},${NEON_PURPLE[2]},${alpha})`;
            this.ctx.font = `${FONT_MED_SIZE}px Consolas, monospace`;
            this.ctx.fillText(`NEMESIS · Reached Boss ${this.nemDepth} · Earned ${this.runCores} Cores`, panelX + panelWidth/2, footerY - 22);
        }

        // Performance mode indicator (full opacity)
        this.ctx.fillStyle = `rgba(${DARK_GRAY[0]},${DARK_GRAY[1]},${DARK_GRAY[2]},0.6)`;
        this.ctx.font = `${FONT_SMALL_SIZE * 0.85}px Consolas, monospace`;
        this.ctx.fillText(this.gameOverModeText, panelX + panelWidth/2, footerY + 22);
        this.ctx.restore();

        // Buttons sit side by side in one row, on the same two columns as the stat
        // boxes above, anchored off the panel's bottom edge so nothing hangs out.
        let btnW = (panelWidth - 80) / 2;   // matches boxWidth in drawStatBoxGrid
        let btnGap = 15;                    // matches its spacing
        let btnH = 38;
        let btnY = panelY + panelHeight - 18 - btnH;
        let leftX = panelX + 40;
        let rightX = leftX + btnW + btnGap;

        // Animated restart button (left column)
        this.drawEnhancedRestartButton(leftX + btnW / 2, btnY + btnH / 2, alpha, btnW, btnH);

        // NEMESIS: mode picker (right column)
        let mbx = rightX, mby = btnY;
        this.modeButtonBounds = { x: mbx, y: mby, w: btnW, h: btnH };
        let mHot = this.mouseX >= mbx && this.mouseX <= mbx + btnW && this.mouseY >= mby && this.mouseY <= mby + btnH;
        this.ctx.save();
        this.ctx.fillStyle = mHot ? 'rgba(58,40,90,0.95)' : 'rgba(26,17,42,0.9)';
        drawRoundedRect(this.ctx, mbx, mby, btnW, btnH, 12);
        this.ctx.fill();
        neonRoundedRect(this.ctx, mbx, mby, btnW, btnH, NEON_PURPLE, 12, 1.5, mHot ? 6 : 3);
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
        this.ctx.fillStyle = `rgba(${NEON_PURPLE[0]},${NEON_PURPLE[1]},${NEON_PURPLE[2]},${alpha})`;
        this.ctx.fillText(this.mode === 'nemesis' ? 'SWITCH TO CLASSIC (M)' : 'PLAY NEMESIS MODE (M)', mbx + btnW / 2, mby + btnH / 2);
        this.ctx.restore();
    }
    
    drawEnhancedRestartButton(centerX, centerY, baseAlpha, baseWidth = 240, baseHeight = 36) {
    // Fade the restart button in with the same alpha as the main box
    let alpha = Math.max(0, (this.gameOverFadeAlpha - 0.3) * 1.4);
    if (alpha <= 0) return;

    // Keep a little pulse but don't gate timing — it fades with the box now
    let pulse = 0.8 + 0.2 * Math.sin(this.gameOverAnimTime * 2);
    let finalAlpha = alpha * pulse;
    
    // Hover effects - scale and brightness
    let hoverScale = 1 + (this.restartButtonHoverTransition * 0.1); // 10% bigger on hover
    let hoverBrightness = 1 + (this.restartButtonHoverTransition * 0.5); // 50% brighter on hover
    
    // Adjusted button dimensions for hover
    let buttonWidth = baseWidth * hoverScale;
    let buttonHeight = baseHeight * hoverScale;
    let buttonX = centerX - buttonWidth / 2;
    let buttonY = centerY - buttonHeight / 2;

    // Store button bounds for click detection (unchanged)
    this.restartButtonBounds = {
        x: centerX - baseWidth / 2,
        y: centerY - baseHeight / 2,
        w: baseWidth,
        h: baseHeight
    };

    // Button background — alpha scales with finalAlpha and hover brightness
    let bgAlpha = Math.min(1.0, 0.3 * finalAlpha * hoverBrightness);
    this.ctx.fillStyle = `rgba(${NEON_CYAN[0]},${NEON_CYAN[1]},${NEON_CYAN[2]},${bgAlpha})`;
    drawRoundedRect(this.ctx, buttonX, buttonY, buttonWidth, buttonHeight, Math.min(18, buttonHeight / 2) * hoverScale);
    this.ctx.fill();

    // Button border — alpha scales with finalAlpha and hover brightness
    let borderAlpha = Math.min(1.0, 0.8 * finalAlpha * hoverBrightness);
    this.ctx.strokeStyle = `rgba(${NEON_CYAN[0]},${NEON_CYAN[1]},${NEON_CYAN[2]},${borderAlpha})`;
    this.ctx.lineWidth = 3;
    drawRoundedRect(this.ctx, buttonX, buttonY, buttonWidth, buttonHeight, Math.min(18, buttonHeight / 2) * hoverScale);
    this.ctx.stroke();

    // Button text — now fades with the box and scales with hover
    this.ctx.save();
    let textAlpha = Math.min(1.0, finalAlpha * hoverBrightness);
    this.ctx.fillStyle = `rgba(${NEON_CYAN[0]},${NEON_CYAN[1]},${NEON_CYAN[2]},${textAlpha})`;
    let fontSize = Math.floor(FONT_MED_SIZE * hoverScale);
    this.ctx.font = `${fontSize}px Consolas, monospace`;
    this.ctx.textAlign = 'center';
    this.ctx.textBaseline = 'middle';
    this.ctx.fillText("Press R to Restart", centerX, centerY);
    this.ctx.restore();
}
                
// Easing function
easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
}
            
// NEW: Block duplicator power-up function
useBlockDuplicator() {
    if (this.scraps >= BLOCK_DUPLICATOR_COST && this.piece) {

                    this.scraps -= BLOCK_DUPLICATOR_COST;
                    
                    // Set the next 2 pieces to be the same as current falling piece
                    this.duplicatorQueue = [this.piece.kind, this.piece.kind, this.piece.kind];
                    
                    // ADDED: Update nextPiece immediately to show the first item in queue
                    this.nextPiece = new Piece(this.duplicatorQueue[0]);
                    
                    // Create particle explosion at button center
                    let buttonX = this.blockDuplicatorButtonBounds.x + this.blockDuplicatorButtonBounds.w / 2;
                    let buttonY = this.blockDuplicatorButtonBounds.y + this.blockDuplicatorButtonBounds.h / 2;
                    this.spawnExplosionParticles(buttonX, buttonY, NEON_ORANGE, 20, 2.0);
                }
            }
}
        function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
        // ----------------- ENTRY POINT -----------------
        new Game();
    </script>
