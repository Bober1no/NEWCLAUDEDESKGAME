        this.drawGameOverHeader(panelX, panelY, panelWidth);
        this.drawStatBoxGrid(panelX, panelY, panelWidth, panelHeight);
        this.drawGameOverFooter(panelX, panelY, panelWidth, panelHeight);
        this.ctx.save();
        this.ctx.textAlign = 'left';
        this.ctx.restore();
    }

    // Draw the skill tree pop-up on top of everything
    if (this.skillTreeOpen) {
        this.drawSkillTree();
    }

    // NEMESIS: between-boss draft on top of everything
    if (this.draftOpen) {
        this.drawDraftOverlay();
    }

    // 3. Finally, restore the canvas to its original, unshaken state.
    // This happens *after* everything has been drawn for the frame.
    this.ctx.restore();
}

            
    // Enhanced Game Over Helper Methods
    updateStatCounters() {
        // Smooth animated counters
        if (this.scoreDisplayValue < this.score) {
            let increment = Math.max(1, Math.floor((this.score - this.scoreDisplayValue) * 0.08));
            this.scoreDisplayValue += increment;
            if (this.scoreDisplayValue > this.score) this.scoreDisplayValue = this.score;
        }
        
        let targetLevel = this.level || 1;
        if (this.levelDisplayValue < targetLevel) {
            this.levelDisplayValue += Math.max(1, Math.floor((targetLevel - this.levelDisplayValue) * 0.1));
            if (this.levelDisplayValue > targetLevel) this.levelDisplayValue = targetLevel;
        }
        
        let targetWave = this.waveNumber || 1; // Use the correct variable "this.waveNumber"
if (this.waveDisplayValue < targetWave) {
    this.waveDisplayValue += Math.max(1, Math.floor((targetWave - this.waveDisplayValue) * 0.1));
    if (this.waveDisplayValue > targetWave) this.waveDisplayValue = targetWave;
}
        
        let targetScraps = this.scraps || 0;
        if (this.scrapsDisplayValue < targetScraps) {
            this.scrapsDisplayValue += Math.max(1, Math.floor((targetScraps - this.scrapsDisplayValue) * 0.12));
            if (this.scrapsDisplayValue > targetScraps) this.scrapsDisplayValue = targetScraps;
        }
        
        let targetTotalScraps = this.totalScrapsEarned || 0;
        if (this.totalScrapsDisplayValue < targetTotalScraps) {
            this.totalScrapsDisplayValue += Math.max(1, Math.floor((targetTotalScraps - this.totalScrapsDisplayValue) * 0.12));
            if (this.totalScrapsDisplayValue > targetTotalScraps) this.totalScrapsDisplayValue = targetTotalScraps;
        }
    }
    
    drawAnimatedBackground() {
        let time = this.gameOverAnimTime;
        let alpha = this.gameOverFadeAlpha * 0.25;
        
        // Score-based gradient colors
        let gradientColors = this.getScoreTierGradients();
        
        // Multiple shifting gradients
        for (let i = 0; i < 3; i++) {
            let gradient = this.ctx.createRadialGradient(
                SCREEN_W/2 + Math.sin(time * 0.8 + i * 2.1) * 120,
                SCREEN_H/2 + Math.cos(time * 0.6 + i * 1.7) * 100,
                0,
                SCREEN_W/2 + Math.sin(time * 0.8 + i * 2.1) * 120,
                SCREEN_H/2 + Math.cos(time * 0.6 + i * 1.7) * 100,
                350
            );
            
            let [r, g, b] = gradientColors[i % gradientColors.length];
            gradient.addColorStop(0, `rgba(${r},${g},${b},${alpha})`);
            gradient.addColorStop(1, `rgba(${r},${g},${b},0)`);
            
            this.ctx.fillStyle = gradient;
            this.ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
        }
    }
    
    getScoreTierGradients() {
        if (this.score >= 15000) return [NEON_MAGENTA, NEON_PURPLE, NEON_CYAN];
        if (this.score >= 10000) return [NEON_GREEN, NEON_CYAN, NEON_BLUE];
        if (this.score >= 5000) return [NEON_YELLOW, NEON_ORANGE, NEON_RED];
        if (this.score >= 3000) return [NEON_CYAN, NEON_BLUE, WHITE];
        return [DARK_GRAY, WHITE, NEON_CYAN];
    }
    
    drawAllParticles() {
        // Glass shards first (background)
        this.glassShards.forEach(s => s.draw(this.ctx));
        
        // Energy wisps
        this.energyWisps.forEach(w => w.draw(this.ctx));
        
        // Geometric particles
        this.geometricParticles.forEach(p => p.draw(this.ctx));
        
        // Traditional confetti on top
        this.confetti.forEach(c => c.draw(this.ctx));
    }
    
    drawEdgeGlow() {
        let time = this.gameOverAnimTime;
        let intensity = (0.25 + 0.15 * Math.sin(time * 1.2)) * this.gameOverFadeAlpha;
        let [r, g, b] = this.score >= 15000 ? NEON_MAGENTA : NEON_CYAN;
        
        // Top edge glow
        let topGrad = this.ctx.createLinearGradient(0, 0, 0, 60);
        topGrad.addColorStop(0, `rgba(${r},${g},${b},${intensity})`);
        topGrad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        this.ctx.fillStyle = topGrad;
        this.ctx.fillRect(0, 0, SCREEN_W, 60);
        
        // Bottom edge glow
        let bottomGrad = this.ctx.createLinearGradient(0, SCREEN_H-60, 0, SCREEN_H);
        bottomGrad.addColorStop(0, `rgba(${r},${g},${b},0)`);
        bottomGrad.addColorStop(1, `rgba(${r},${g},${b},${intensity})`);
        this.ctx.fillStyle = bottomGrad;
        this.ctx.fillRect(0, SCREEN_H-60, SCREEN_W, 60);
        
        // Left and right edges
        let sideIntensity = intensity * 0.6;
        let leftGrad = this.ctx.createLinearGradient(0, 0, 60, 0);
        leftGrad.addColorStop(0, `rgba(${r},${g},${b},${sideIntensity})`);
        leftGrad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        this.ctx.fillStyle = leftGrad;
        this.ctx.fillRect(0, 0, 60, SCREEN_H);
        
        let rightGrad = this.ctx.createLinearGradient(SCREEN_W-60, 0, SCREEN_W, 0);
        rightGrad.addColorStop(0, `rgba(${r},${g},${b},0)`);
        rightGrad.addColorStop(1, `rgba(${r},${g},${b},${sideIntensity})`);
        this.ctx.fillStyle = rightGrad;
        this.ctx.fillRect(SCREEN_W-60, 0, 60, SCREEN_H);
    }
    
    drawGlassmorphismPanel(panelX, panelY, panelWidth, panelHeight) {
        this.ctx.save();
        
        // Multiple glass layers for depth
        for (let i = 0; i < 4; i++) {
            let offset = i * 3;
            let alpha = (0.12 - i * 0.02) * this.gameOverFadeAlpha;
            
            this.ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            drawRoundedRect(this.ctx, panelX - offset, panelY - offset, 
                       panelWidth + offset*2, panelHeight + offset*2, 25);
            this.ctx.fill();
        }
        
        // Enhanced neon border
        let borderGlow = 15 * this.gameOverFadeAlpha;
        neonRoundedRect(this.ctx, panelX, panelY, panelWidth, panelHeight, 
                       [40, 40, 80], 25, 4, borderGlow);
        
        // Subtle circuit pattern overlay
        this.drawCircuitPattern(panelX, panelY, panelWidth, panelHeight);
        
        this.ctx.restore();
    }
    
    drawCircuitPattern(x, y, w, h) {
        // Generate stable circuit pattern using deterministic positions
        if (!this.circuitPatternCache) {
            this.circuitPatternCache = this.generateCircuitPattern(w, h);
        }
        
        let alpha = this.gameOverFadeAlpha * 0.06; // Reduced opacity
        this.ctx.strokeStyle = `rgba(120,160,255,${alpha})`;
        this.ctx.lineWidth = 1;
        
        // Draw cached pattern
        this.circuitPatternCache.forEach(line => {
            this.ctx.beginPath();
            this.ctx.moveTo(x + line.x1, y + line.y1);
            this.ctx.lineTo(x + line.x2, y + line.y2);
            this.ctx.stroke();
        });
    }
    
    generateCircuitPattern(w, h) {
        let lines = [];
        let spacing = 40;
        
        // Create more comprehensive deterministic pattern
        // Vertical lines
        for (let i = spacing; i < w - spacing; i += spacing) {
            // Use different patterns to create variety
            if (i % (spacing * 2) === 0 || (i + spacing/2) % (spacing * 3) === 0) {
                lines.push({x1: i, y1: 25, x2: i, y2: h - 25});
            }
        }
        
        // Horizontal lines  
        for (let j = spacing; j < h - spacing; j += spacing) {
            if (j % (spacing * 2) === spacing || (j + spacing/3) % (spacing * 2) === 0) {
                lines.push({x1: 25, y1: j, x2: w - 25, y2: j});
            }
        }
        
        // Add some connecting nodes/dots
        for (let i = spacing; i < w - spacing; i += spacing * 2) {
            for (let j = spacing; j < h - spacing; j += spacing * 2) {
                if ((i + j) % (spacing * 3) === 0) {
                    // Small cross pattern
                    lines.push({x1: i - 5, y1: j, x2: i + 5, y2: j});
                    lines.push({x1: i, y1: j - 5, x2: i, y2: j + 5});
                }
            }
        }
        
        return lines;
    }
    
    drawAchievementBadges(x, y) {
        if (this.achievementBadges.length === 0) return;
        
        let badgeSpacing = 70;
        let startX = x + (500 * 1.1) / 2 - (this.achievementBadges.length * badgeSpacing) / 2;
        
        this.achievementBadges.forEach((badge, i) => {
            badge.animTime += 0.02;
            let scale = 0.9 + 0.15 * Math.sin(badge.animTime * 3 + i);
            
            this.ctx.save();
            this.ctx.translate(startX + i * badgeSpacing, y);
            this.ctx.scale(scale, scale);
            
            // Badge glow
            let [r, g, b] = badge.color;
            this.ctx.fillStyle = `rgba(${r},${g},${b},${this.gameOverFadeAlpha * 0.4})`;
            this.ctx.strokeStyle = `rgba(${r},${g},${b},${this.gameOverFadeAlpha})`;
            this.ctx.lineWidth = 3;
            
            this.ctx.beginPath();
            this.ctx.arc(0, 0, 30, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.stroke();
            
            // Badge star icon
            this.ctx.fillStyle = `rgba(${r},${g},${b},${this.gameOverFadeAlpha})`;
            this.drawStar(this.ctx, 0, 0, 16);
            
            this.ctx.restore();
        });
    }
    
    drawStar(ctx, x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            let angle = (i * 4 * Math.PI) / 5;
            let radius = i % 2 === 0 ? size : size * 0.5;
            let px = Math.cos(angle) * radius;
            let py = Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
    
    drawGameOverHeader(panelX, panelY, panelWidth) {
        let headerY = panelY + 40;
        let alpha = Math.max(0, (this.gameOverFadeAlpha - 0.2) * 1.25);
        
        if (alpha <= 0) return;
        
        // "GAME OVER" with scale animation
        let scale = 0.7 + 0.3 * Math.min(1, this.gameOverAnimTime * 1.5);
        this.ctx.save();
        this.ctx.translate(panelX + panelWidth/2, headerY);
        this.ctx.scale(scale, scale);
        
        this.ctx.fillStyle = `rgba(${NEON_RED[0]},${NEON_RED[1]},${NEON_RED[2]},${alpha})`;
        this.ctx.font = `${FONT_BIG_SIZE}px Consolas, monospace`;
        this.ctx.textAlign = 'center';
        this.ctx.fillText("GAME OVER", 0, 0);
        
        this.ctx.restore();
        
        // Celebration subtitle
        let celebTitle = this.getCelebrationTitle(this.score);
        let titleColor = this.getTitleColor();
        
        this.ctx.save();
        this.ctx.fillStyle = `rgba(${titleColor[0]},${titleColor[1]},${titleColor[2]},${alpha})`;
        this.ctx.font = `${FONT_MED_SIZE}px Consolas, monospace`;
        this.ctx.textAlign = 'center';
        this.ctx.fillText(celebTitle, panelX + panelWidth/2, headerY + 35); // Moved closer to GAME OVER text
        this.ctx.restore();
    }
    
    getTitleColor() {
        if (this.score >= 15000) return NEON_MAGENTA;
        if (this.score >= 10000) return NEON_GREEN;
        if (this.score >= 5000) return NEON_YELLOW;
        if (this.score >= 3000) return NEON_CYAN;
        return WHITE;
    }
    
    drawStatBoxGrid(panelX, panelY, panelWidth, panelHeight) {
        let gridStartY = panelY + 100; // Moved up
        let boxWidth = (panelWidth - 80) / 2; // Smaller boxes with more margin
        let boxHeight = 70; // Reduced height
        let spacing = 15; // Reduced spacing
        
        // Staggered animations for each stat box
        let baseDelay = 0.5;
        let staggerDelay = 0.15;
        
        let stats = [
            {
                label: 'FINAL SCORE',
                value: this.scoreDisplayValue.toLocaleString(),
                color: NEON_YELLOW,
                icon: '★',
                x: panelX + 40,
                y: gridStartY,
                delay: baseDelay
            },
            {
                label: 'LEVEL',
                value: this.levelDisplayValue.toString(),
                color: NEON_BLUE,
                icon: '▲',
                x: panelX + 40 + boxWidth + spacing,
                y: gridStartY,
                delay: baseDelay + staggerDelay
            },
            {
                label: 'WAVE REACHED',
                value: this.waveDisplayValue.toString(),
                color: NEON_RED,
                icon: '⬢',
                x: panelX + 40,
                y: gridStartY + boxHeight + spacing,
                delay: baseDelay + staggerDelay * 2
            },
            {
                label: 'SCRAPS EARNED',
                value: this.totalScrapsDisplayValue.toString(),
                color: NEON_GREEN,
                icon: '◆',
                x: panelX + 40 + boxWidth + spacing,
                y: gridStartY + boxHeight + spacing,
                delay: baseDelay + staggerDelay * 3
            }
        ];
        
        stats.forEach(stat => {
            let progress = Math.max(0, Math.min(1, (this.gameOverAnimTime - stat.delay) / 0.6));
            if (progress > 0) {
                this.drawStatBox(stat, boxWidth, boxHeight, progress);
            }
        });
    }
    
    drawStatBox(stat, width, height, progress) {
        // Slide-in animation
        let slideOffset = (1 - this.easeOutCubic(progress)) * 100;
        let currentX = stat.x + slideOffset;
        
        let alpha = this.gameOverFadeAlpha * progress;
        let [r, g, b] = stat.color;
        
        // Glassmorphism stat box
        this.ctx.save();
        
        // Box background with glass effect
this.ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.08})`;
drawRoundedRect(this.ctx, currentX, stat.y, width, height, 15); // Corrected function name
this.ctx.fill();
        
        // Neon border
        neonRoundedRect(this.ctx, currentX, stat.y, width, height, stat.color, 15, 2, 8 * alpha);
        
        // Icon (full opacity)
        this.ctx.fillStyle = `rgba(${r},${g},${b},${progress})`;
        this.ctx.font = `${FONT_MED_SIZE}px Consolas, monospace`;
        this.ctx.textAlign = 'left';
        this.ctx.fillText(stat.icon, currentX + 15, stat.y + 30);
        
        // Label (full opacity)
        this.ctx.fillStyle = `rgba(${r},${g},${b},${progress * 0.8})`;
        this.ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
        this.ctx.fillText(stat.label, currentX + 50, stat.y + 25);
        
        // Value with glow effect (full opacity)
        this.ctx.fillStyle = `rgba(${r},${g},${b},${progress})`;
        this.ctx.font = `${FONT_BIG_SIZE * 0.7}px Consolas, monospace`;
        this.ctx.shadowColor = `rgba(${r},${g},${b},0.6)`;
        this.ctx.shadowBlur = 8;
        this.ctx.fillText(stat.value, currentX + 50, stat.y + 55);
        this.ctx.shadowBlur = 0;
        
        this.ctx.restore();
    }
    
    drawGameOverFooter(panelX, panelY, panelWidth, panelHeight) {
        let alpha = Math.max(0, (this.gameOverFadeAlpha - 0.3) * 1.4);
        if (alpha <= 0) return;

        let centerX = panelX + panelWidth / 2;

        // Buttons sit side by side in one row, on the same two columns as the stat
        // boxes above, anchored off the panel's bottom edge so nothing hangs out.
        let btnW = (panelWidth - 80) / 2;   // matches boxWidth in drawStatBoxGrid
        let btnGap = 15;                    // matches its spacing
        let btnH = 38;
        let btnY = panelY + panelHeight - 22 - btnH;
        let leftX = panelX + 40;
        let rightX = leftX + btnW + btnGap;

        // Summary lines fill the gap between the stat grid and that button row.
        // They're measured and centred as a block so classic mode — which has no
        // NEMESIS line — doesn't leave a hole where that line would have been.
        let gridBottom = panelY + 100 + 70 + 15 + 70;   // mirrors drawStatBoxGrid
        let lineGap = 14;
        let lines = [];
        if (this.mode === 'nemesis') {
            lines.push({ text: `NEMESIS \u00b7 Reached Boss ${this.nemDepth} \u00b7 Earned ${this.runCores} Cores`,
                         size: FONT_MED_SIZE, color: NEON_PURPLE, alpha: alpha });
        } else if (this.mode === 'versus') {
            let verdict = this.vsWon ? 'YOU WIN' : 'YOU LOSE';
            lines.push({ text: `VERSUS \u00b7 ${verdict} \u00b7 ${this.vsSentWaves} waves sent`,
                         size: FONT_MED_SIZE, color: this.vsWon ? NEON_GREEN : NEON_MAGENTA, alpha: alpha });
            let note = !VSNet.isOpen() ? 'Opponent disconnected'
                     : this.vsRematchMe   ? 'Rematch sent - waiting for them...'
                     : this.vsRematchThem ? 'They want a rematch! Press Y'
                     : 'Press Y for a rematch (both must agree)';
            lines.push({ text: note, size: FONT_SMALL_SIZE,
                         color: this.vsRematchThem ? NEON_GREEN : NEON_CYAN, alpha: alpha });
        }
        lines.push({ text: `Ended: ${this.gameOverReason}`,
                     size: FONT_MED_SIZE, color: NEON_CYAN, alpha: alpha * 0.7 });
        lines.push({ text: this.gameOverModeText,
                     size: Math.floor(FONT_SMALL_SIZE * 0.85), color: DARK_GRAY, alpha: 0.6 });
        lines = lines.filter(l => l.text);

        let blockH = lines.reduce((h, l) => h + l.size, 0) + lineGap * Math.max(0, lines.length - 1);
        let y = gridBottom + Math.max(0, (btnY - gridBottom - blockH) / 2);

        this.ctx.save();
        this.ctx.textAlign = 'center';
        for (let l of lines) {
            y += l.size;
            this.ctx.font = `${l.size}px Consolas, monospace`;
            this.ctx.fillStyle = `rgba(${l.color[0]},${l.color[1]},${l.color[2]},${l.alpha})`;
            this.ctx.fillText(l.text, centerX, y);
            y += lineGap;
        }
        this.ctx.restore();

        // Animated restart button (left column). In versus a local restart would
        // desync the duel, so that slot becomes the rematch offer instead.
        if (this.mode === 'versus') {
            this.restartButtonBounds = { x: 0, y: 0, w: 0, h: 0 };   // disarm plain restart
            let rbx = leftX, rby = btnY;
            this.vsRematchBounds = { x: rbx, y: rby, w: btnW, h: btnH };
            let ready = VSNet.isOpen();
            let rHot = ready && this.mouseX >= rbx && this.mouseX <= rbx + btnW && this.mouseY >= rby && this.mouseY <= rby + btnH;
            let rc = !ready ? DARK_GRAY : (this.vsRematchThem ? NEON_GREEN : this.vsRematchMe ? NEON_YELLOW : NEON_CYAN);
            let label = !ready ? 'OPPONENT GONE'
                      : this.vsRematchMe ? 'WAITING... (Y)'
                      : this.vsRematchThem ? 'ACCEPT REMATCH (Y)' : 'REMATCH (Y)';
            this.ctx.save();
            this.ctx.fillStyle = rHot ? 'rgba(30,58,74,0.95)' : 'rgba(12,26,34,0.9)';
            drawRoundedRect(this.ctx, rbx, rby, btnW, btnH, 12);
            this.ctx.fill();
            neonRoundedRect(this.ctx, rbx, rby, btnW, btnH, rc, 12, 1.5, rHot ? 6 : 3);
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            this.ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
            this.ctx.fillStyle = `rgba(${rc[0]},${rc[1]},${rc[2]},${alpha})`;
            this.ctx.fillText(label, rbx + btnW / 2, rby + btnH / 2);
            this.ctx.restore();
        } else {
            this.vsRematchBounds = null;
            this.drawEnhancedRestartButton(leftX + btnW / 2, btnY + btnH / 2, alpha, btnW, btnH);
        }

        // NEMESIS: mode picker (right column)
        let mbx = rightX, mby = btnY;
        this.modeButtonBounds = { x: mbx, y: mby, w: btnW, h: btnH };
        let mHot = this.mouseX >= mbx && this.mouseX <= mbx + btnW && this.mouseY >= mby && this.mouseY <= mby + btnH;
        this.ctx.save();
        this.ctx.fillStyle = mHot ? 'rgba(58,40,90,0.95)' : 'rgba(26,17,42,0.9)';
        drawRoundedRect(this.ctx, mbx, mby, btnW, btnH, 12);
        this.ctx.fill();
        neonRoundedRect(this.ctx, mbx, mby, btnW, btnH, NEON_PURPLE, 12, 1.5, mHot ? 6 : 3);
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        this.ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
        this.ctx.fillStyle = `rgba(${NEON_PURPLE[0]},${NEON_PURPLE[1]},${NEON_PURPLE[2]},${alpha})`;
        let modeLabel = this.mode === 'versus' ? 'LEAVE VERSUS (M)'
                      : this.mode === 'nemesis' ? 'SWITCH TO CLASSIC (M)' : 'PLAY NEMESIS MODE (M)';
        this.ctx.fillText(modeLabel, mbx + btnW / 2, mby + btnH / 2);
        this.ctx.restore();
    }
    
    drawEnhancedRestartButton(centerX, centerY, baseAlpha, baseWidth = 240, baseHeight = 36) {
    // Fade the restart button in with the same alpha as the main box
    let alpha = Math.max(0, (this.gameOverFadeAlpha - 0.3) * 1.4);
    if (alpha <= 0) return;

    // Keep a little pulse but don't gate timing — it fades with the box now
    let pulse = 0.8 + 0.2 * Math.sin(this.gameOverAnimTime * 2);
    let finalAlpha = alpha * pulse;
    
    // Hover effects - scale and brightness
    let hoverScale = 1 + (this.restartButtonHoverTransition * 0.1); // 10% bigger on hover
    let hoverBrightness = 1 + (this.restartButtonHoverTransition * 0.5); // 50% brighter on hover
    
    // Adjusted button dimensions for hover
    let buttonWidth = baseWidth * hoverScale;
    let buttonHeight = baseHeight * hoverScale;
    let buttonX = centerX - buttonWidth / 2;
    let buttonY = centerY - buttonHeight / 2;

    // Store button bounds for click detection (unchanged)
    this.restartButtonBounds = {
        x: centerX - baseWidth / 2,
        y: centerY - baseHeight / 2,
        w: baseWidth,
        h: baseHeight
    };

    // Button background — alpha scales with finalAlpha and hover brightness
    let bgAlpha = Math.min(1.0, 0.3 * finalAlpha * hoverBrightness);
    this.ctx.fillStyle = `rgba(${NEON_CYAN[0]},${NEON_CYAN[1]},${NEON_CYAN[2]},${bgAlpha})`;
    drawRoundedRect(this.ctx, buttonX, buttonY, buttonWidth, buttonHeight, Math.min(18, buttonHeight / 2) * hoverScale);
    this.ctx.fill();

    // Button border — alpha scales with finalAlpha and hover brightness
    let borderAlpha = Math.min(1.0, 0.8 * finalAlpha * hoverBrightness);
    this.ctx.strokeStyle = `rgba(${NEON_CYAN[0]},${NEON_CYAN[1]},${NEON_CYAN[2]},${borderAlpha})`;
    this.ctx.lineWidth = 3;
    drawRoundedRect(this.ctx, buttonX, buttonY, buttonWidth, buttonHeight, Math.min(18, buttonHeight / 2) * hoverScale);
    this.ctx.stroke();

    // Button text — now fades with the box and scales with hover
    this.ctx.save();
    let textAlpha = Math.min(1.0, finalAlpha * hoverBrightness);
    this.ctx.fillStyle = `rgba(${NEON_CYAN[0]},${NEON_CYAN[1]},${NEON_CYAN[2]},${textAlpha})`;
    let fontSize = Math.floor(FONT_MED_SIZE * hoverScale);
    this.ctx.font = `${fontSize}px Consolas, monospace`;
    this.ctx.textAlign = 'center';
    this.ctx.textBaseline = 'middle';
    this.ctx.fillText("Press R to Restart", centerX, centerY);
    this.ctx.restore();
}
                
    // ================= VERSUS: game-side logic =================

    // Wire the transport to this run once, at boot.
    vsInstall() {
        VSNet.onMessage = (m) => this.vsReceive(m);
        VSNet.onOpen    = () => this.vsStart();
        VSNet.onClose   = () => {
            if (this.mode !== 'versus') return;
            this.vsOpponent.connected = false;
            this.nemAnnounce = { text: 'OPPONENT DISCONNECTED', color: NEON_RED, timer: 4 * FPS };
        };
    }

    // Both sides drop into a fresh versus run the moment the channel opens.
    vsStart() {
        VSLobby.hide();
        this.mode = 'versus';
        this.reset();
        this.nemAnnounce = { text: 'DUEL START', color: NEON_MAGENTA, timer: 3 * FPS };
    }

    vsResetState() {
        this.threat = 0;
        this.vsSentWaves = 0;
        this.vsStateTick = 0;
        this.vsLockTimer = 0;
        this.vsWon = false;
        this.vsRematchMe = false;
        this.vsRematchThem = false;
        this.vsSabBounds = [];
        this.vsOpponent = { connected: VSNet.isOpen(), board: null, score: 0, level: 1, threat: 0, dead: false, name: 'OPPONENT' };
    }

    // ---- REMATCH (both sides have to ask) ----
    vsRequestRematch() {
        if (this.mode !== 'versus' || !this.gameOver) return;
        if (!VSNet.isOpen()) {
            this.nemAnnounce = { text: 'OPPONENT IS GONE', color: NEON_RED, timer: 2 * FPS };
            return;
        }
        if (this.vsRematchMe) return;
        this.vsRematchMe = true;
        VSNet.send({ t: 'rematch' });
        this.vsCheckRematch();
    }

    // Symmetric: whoever receives the second request restarts, and so does the
    // other side when their copy of the message lands. No host authority needed.
    vsCheckRematch() {
        if (this.vsRematchMe && this.vsRematchThem) {
            this.mode = 'versus';
            this.reset();
            this.nemAnnounce = { text: 'REMATCH', color: NEON_GREEN, timer: 3 * FPS };
        }
    }

    // ---- THREAT ----
    vsAddThreat(amount) {
        if (this.mode !== 'versus' || amount <= 0) return;
        this.threat += amount;
        while (this.threat >= VS_THREAT_MAX) {
            this.threat -= VS_THREAT_MAX;
            this.vsFireWave();
        }
    }

    // A full meter ships a wave to the other board. Size grows with your level so
    // a long duel escalates instead of stalling.
    vsFireWave() {
        let n = Math.min(7, 2 + Math.floor(this.level / 3));
        this.vsSentWaves++;
        VSNet.send({ t: 'wave', n: n, lvl: this.level });
        this.nemAnnounce = { text: 'WAVE SENT  x' + n, color: NEON_RED, timer: 2 * FPS };
        this.addScreenShake(4);
    }

    // ---- SABOTAGE (spends scraps) ----
    vsSendSabotage(id) {
        if (this.mode !== 'versus' || !VSNet.isOpen()) return;
        if (this.gameOver || this.paused || this.skillTreeOpen) return;
        let s = VS_SAB_BY_ID[id];
        if (!s) return;
        if (this.scraps < s.cost) {
            this.nemAnnounce = { text: 'NEED ' + s.cost + ' SCRAPS', color: NEON_RED, timer: 1.2 * FPS };
            return;
        }
        this.scraps -= s.cost;
        VSNet.send({ t: 'sab', k: id });
        this.nemAnnounce = { text: s.name + ' SENT', color: s.color, timer: 1.8 * FPS };
        this.addScreenShake(3);
    }

    // ---- incoming ----
    vsReceive(m) {
        if (this.mode !== 'versus') return;
        switch (m.t) {
            case 'wave':
                this.vsApplyWave(Math.max(1, Math.min(10, m.n | 0)), Math.max(1, Math.min(99, m.lvl | 0)));
                break;
            case 'sab':
                this.vsApplySabotage(String(m.k));
                break;
            case 'state':
                this.vsOpponent.connected = true;
                this.vsOpponent.board = (typeof m.b === 'string' && m.b.length === ROWS * COLS) ? m.b : this.vsOpponent.board;
                this.vsOpponent.score  = m.s | 0;
                this.vsOpponent.level  = m.l | 0;
                this.vsOpponent.threat = Math.max(0, Math.min(VS_THREAT_MAX, +m.h || 0));
                break;
            case 'dead':
                this.vsOpponent.dead = true;
                if (!this.gameOver) {
                    // A duel ends for BOTH players the moment one tops out.
                    this.vsWon = true;
                    this.gameOver = true;
                    this.gameOverReason = 'opponent topped out';
                    if (this.gameplayPerformanceMode === null) {
                        this.gameplayPerformanceMode = this.currentFps < 40 ? 'powersaver' : 'normal';
                    }
                    this.gameOverModeText = this.getPerformanceModeText();
                    this.spawnEnhancedCelebration(this.score);
                }
                break;
            case 'rematch':
                // Only meaningful between rounds; ignoring it while alive also drops
                // any stale request that lands just after a round has restarted.
                if (this.gameOver) { this.vsRematchThem = true; this.vsCheckRematch(); }
                break;
        }
    }

    vsApplyWave(n, lvl) {
        let pool = ['grunt', 'sprinter', 'brute', 'bomber'];
        if (lvl >= 6) pool.push('tank');
        for (let i = 0; i < n; i++) {
            this.enemies.push(new Enemy(randomChoice(pool), Math.floor(Math.random() * COLS), Math.max(this.level, lvl)));
        }
        this.nemAnnounce = { text: 'INCOMING WAVE  x' + n, color: NEON_ORANGE, timer: 2 * FPS };
        this.addScreenShake(5);
    }

    // These reuse the nemesis gimmick fields, which the board and gravity code
    // already honour regardless of mode — only the timers are ours to run.
    vsApplySabotage(id) {
        let s = VS_SAB_BY_ID[id];
        if (!s) return;
        if (id === 'scramble') {
            this.nextPiece = new Piece(randomChoice(Object.keys(SHAPES)));
            this.holdPiece = null;
            this.duplicatorQueue = [];
        } else if (id === 'lock') {
            let a = Math.floor(Math.random() * COLS);
            let b = (a + 1 + Math.floor(Math.random() * (COLS - 1))) % COLS;
            this.nemLockedCols = [a, b];
            this.vsLockTimer = 8 * FPS;
        } else if (id === 'flip') {
            this.nemGravityFlip = Math.floor(4 * FPS);
        } else if (id === 'sap') {
            let cells = [];
            for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (this.board[y][x] !== null) cells.push([y, x]);
            for (let k = 0; k < 3 && cells.length; k++) {
                let i = Math.floor(Math.random() * cells.length);
                let [y, x] = cells.splice(i, 1)[0];
                this.spawnExplosionParticles(LEFT_PANEL_WIDTH + x * CELL + CELL / 2, y * CELL + CELL / 2, NEON_ORANGE, 10, 2.2);
                this.board[y][x] = null;
            }
            this.applyHelperBuffs();
        }
        this.nemAnnounce = { text: 'SABOTAGED: ' + s.name, color: s.color, timer: 2.5 * FPS };
        this.addScreenShake(6);
    }

    // ---- per-frame ----
    vsTick() {
        if (this.mode !== 'versus') return;
        // Sabotage timers (nemesisTick owns these in nemesis mode; here they are ours)
        if (this.vsLockTimer > 0) {
            this.vsLockTimer--;
            if (this.vsLockTimer <= 0) this.nemLockedCols = [];
        }
        if (this.nemGravityFlip > 0) this.nemGravityFlip--;

        // Ship a board snapshot a few times a second for their minimap
        if (VSNet.isOpen() && (++this.vsStateTick % VS_STATE_EVERY === 0)) {
            VSNet.send({ t: 'state', b: this.vsSnapshot(), s: this.score, l: this.level, h: Math.round(this.threat) });
        }
    }

    vsSnapshot() {
        let out = '';
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                let c = this.board[y][x];
                out += (c && c.shape) ? c.shape : '.';
            }
        }
        return out;
    }

    // ---- VERSUS: threat meter + sabotage buttons (left panel dead space) ----
    drawVersusHUD() {
        let ctx = this.ctx;
        let sx = Math.floor(15 * 1.1);
        let panelW = LEFT_PANEL_WIDTH - Math.floor(30 * 1.1);
        let x = sx + 10, w = panelW - 20;

        // Fit into the dead space between the last powerup and the skill tree button,
        // measured off their real bounds so this can never drift into either of them.
        let ob = this.orbitalStrikeButtonBounds, kb = this.skillTreeButtonBounds;
        let top    = (ob && ob.h ? ob.y + ob.h : Math.floor(440 * 1.1)) + 10;
        let bottom = (kb && kb.h ? kb.y : SCREEN_H - 90) - 8;
        let y = top;

        // THREAT meter
        drawText(ctx, 'THREAT', x, y + 10, Math.floor(FONT_SMALL_SIZE * 0.9), NEON_RED);
        let bh = 12;
        ctx.fillStyle = 'rgba(8,5,16,0.95)';
        drawRoundedRect(ctx, x, y + 14, w, bh, 5); ctx.fill();
        let frac = Math.max(0, Math.min(1, this.threat / VS_THREAT_MAX));
        if (frac > 0) {
            ctx.fillStyle = `rgb(${NEON_RED[0]},${NEON_RED[1]},${NEON_RED[2]})`;
            drawRoundedRect(ctx, x, y + 14, Math.max(4, Math.floor(w * frac)), bh, 5); ctx.fill();
        }
        neonRoundedRect(ctx, x, y + 14, w, bh, NEON_RED, 5, 1.2, 4);

        // Sabotage buttons — priced against your own powerups on purpose
        this.vsSabBounds = [];
        let gap = 3;
        let by = y + 32;
        let bhh = Math.max(20, Math.floor((bottom - by - gap * (VS_SABOTAGE.length - 1)) / VS_SABOTAGE.length));
        for (let i = 0; i < VS_SABOTAGE.length; i++) {
            let s = VS_SABOTAGE[i];
            let yy = by + i * (bhh + gap);
            let afford = this.scraps >= s.cost;
            let hot = this.mouseX >= x && this.mouseX <= x + w && this.mouseY >= yy && this.mouseY <= yy + bhh;
            this.vsSabBounds.push({ x: x, y: yy, w: w, h: bhh, id: s.id });

            ctx.fillStyle = hot && afford ? 'rgba(58,40,90,0.95)' : 'rgba(20,12,32,0.9)';
            drawRoundedRect(ctx, x, yy, w, bhh, 8); ctx.fill();
            let c = s.color, a = afford ? 1 : 0.32;
            ctx.save();
            ctx.globalAlpha = a;
            neonRoundedRect(ctx, x, yy, w, bhh, c, 8, 1.2, hot && afford ? 5 : 2);
            // One line only: the panel is 156px wide and the blurbs live in the
            // side-panel legend instead of spilling out over the grid.
            ctx.textBaseline = 'middle';
            ctx.font = `${Math.floor(FONT_SMALL_SIZE * 0.92)}px Consolas, monospace`;
            ctx.textAlign = 'left';
            ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
            ctx.fillText(`(${s.key}) ${s.name}`, x + 9, yy + bhh / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = afford ? `rgba(${c[0]},${c[1]},${c[2]},0.75)` : `rgba(${NEON_RED[0]},${NEON_RED[1]},${NEON_RED[2]},0.95)`;
            ctx.fillText(`${s.cost}`, x + w - 9, yy + bhh / 2);
            ctx.restore();
        }
    }

// NEW: Block duplicator power-up function
useBlockDuplicator() {
    if (this.scraps >= BLOCK_DUPLICATOR_COST && this.piece) {

                    this.scraps -= BLOCK_DUPLICATOR_COST;
                    
                    // Set the next 2 pieces to be the same as current falling piece
                    this.duplicatorQueue = [this.piece.kind, this.piece.kind, this.piece.kind];
                    
                    // ADDED: Update nextPiece immediately to show the first item in queue
                    this.nextPiece = new Piece(this.duplicatorQueue[0]);
                    
                    // Create particle explosion at button center
                    let buttonX = this.blockDuplicatorButtonBounds.x + this.blockDuplicatorButtonBounds.w / 2;
                    let buttonY = this.blockDuplicatorButtonBounds.y + this.blockDuplicatorButtonBounds.h / 2;
                    this.spawnExplosionParticles(buttonX, buttonY, NEON_ORANGE, 20, 2.0);
                }
            }
}
        function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

        // ================= VERSUS: transport =================
        // PeerJS gives us a rendezvous broker, so a duel is just a 6-digit code:
        // the host reserves the code as its peer id, the joiner dials it. Our own
        // STUN/TURN config is still what actually carries the media path.
        const VS_PEER_PREFIX = 'blockshots-v1-';
        // null = PeerJS public cloud broker. Point this at your own PeerServer
        // ({host, port, path, secure}) if you ever want to stop relying on theirs.
        let VS_BROKER = null;

        const VSNet = {
            peer: null, conn: null, code: null, role: null, status: 'idle', lastError: '',
            onOpen: null, onClose: null, onMessage: null, onStatus: null,

            isOpen() { return !!(this.conn && this.conn.open); },
            setStatus(s) { this.status = s; if (this.onStatus) this.onStatus(s, this.lastError); },

            reset() {
                try { if (this.conn) this.conn.close(); } catch (e) {}
                try { if (this.peer) this.peer.destroy(); } catch (e) {}
                this.peer = null; this.conn = null; this.code = null; this.role = null; this.lastError = '';
                this.setStatus('idle');
            },

            _opts() {
                let o = { config: VS_ICE_CONFIG, debug: 0 };
                if (VS_BROKER) {
                    o.host = VS_BROKER.host; o.port = VS_BROKER.port;
                    o.path = VS_BROKER.path; o.secure = !!VS_BROKER.secure;
                }
                return o;
            },

            _wire(conn) {
                this.conn = conn;
                conn.on('open',  () => { this.setStatus('connected'); if (this.onOpen) this.onOpen(); });
                conn.on('close', () => { this.setStatus('closed');    if (this.onClose) this.onClose(); });
                conn.on('error', () => { this.setStatus('closed');    if (this.onClose) this.onClose(); });
                conn.on('data',  (m) => {
                    // Peer traffic is untrusted: only ever dispatch known verbs.
                    if (m && typeof m === 'object' && typeof m.t === 'string' && this.onMessage) this.onMessage(m);
                });
            },

            // Reserve a random 6-digit code as our peer id, retrying if it is taken.
            host() {
                this.reset();
                this.role = 'host';
                this.setStatus('opening');
                return new Promise((resolve, reject) => {
                    let tries = 0;
                    let attempt = () => {
                        let code = String(Math.floor(100000 + Math.random() * 900000));
                        let peer = new Peer(VS_PEER_PREFIX + code, this._opts());
                        this.peer = peer;
                        peer.on('open', () => { this.code = code; this.setStatus('waiting'); resolve(code); });
                        peer.on('connection', (c) => this._wire(c));
                        peer.on('error', (err) => {
                            let type = (err && err.type) || '';
                            if (type === 'unavailable-id' && tries++ < 6) {   // code collision, roll another
                                try { peer.destroy(); } catch (e) {}
                                attempt();
                                return;
                            }
                            this.lastError = type || (err && err.message) || 'unknown';
                            this.setStatus('error');
                            reject(new Error(this.lastError));
                        });
                    };
                    attempt();
                });
            },

            join(code) {
                this.reset();
                this.role = 'guest';
                this.setStatus('opening');
                return new Promise((resolve, reject) => {
                    let peer = new Peer(undefined, this._opts());
                    this.peer = peer;
                    peer.on('open', () => {
                        this.code = code;
                        this.setStatus('dialing');
                        this._wire(peer.connect(VS_PEER_PREFIX + code, { reliable: true }));
                        resolve(true);
                    });
                    peer.on('error', (err) => {
                        let type = (err && err.type) || '';
                        this.lastError = type === 'peer-unavailable' ? 'no game with that code' : (type || 'unknown');
                        this.setStatus('error');
                        reject(new Error(this.lastError));
                    });
                });
            },

            send(obj) {
                if (!this.isOpen()) return false;
                try { this.conn.send(obj); return true; } catch (e) { return false; }
            }
        };

        // ================= VERSUS: lobby overlay =================

                    '<div id="vs-code"></div>',
                    '<div id="vs-entry"><input id="vs-input" maxlength="6" inputmode="numeric" placeholder="000000" autocomplete="off"></div>',
                    '<div id="vs-status">Press HOST to get a code, or JOIN to enter one.</div>',
                    '<button id="vs-close">CLOSE (V)</button>',
                    '</div>'
                ].join('');
                document.body.appendChild(d);
                this.el = d;

                let $ = id => document.getElementById(id);
                let say = t => { $('vs-status').textContent = t; };

                $('vs-host').onclick = async () => {
                    $('vs-entry').classList.remove('on');
                    $('vs-code').textContent = '......';
                    say('Reserving a code...');
                    try {
                        let code = await VSNet.host();
                        $('vs-code').textContent = code;
                        say('Give them this code. Waiting for them to join...');
                    } catch (e) { $('vs-code').textContent = ''; say('Could not host: ' + e.message); }
                };

                $('vs-join').onclick = () => {
                    $('vs-code').textContent = '';
                    $('vs-entry').classList.add('on');
                    $('vs-input').value = '';
                    $('vs-input').focus();
                    say('Type their 6-digit code.');
                };

                let dial = async () => {
                    let code = ($('vs-input').value || '').replace(/[^0-9]/g, '');
                    if (code.length !== 6) return say('Codes are 6 digits.');
                    say('Connecting to ' + code + '...');
                    try { await VSNet.join(code); }
                    catch (e) { say('Could not join: ' + e.message); }
                };
                // Typing the sixth digit connects — no extra button to hunt for.
                $('vs-input').oninput = () => {
                    let v = $('vs-input').value.replace(/[^0-9]/g, '').slice(0, 6);
                    $('vs-input').value = v;
                    if (v.length === 6) dial();
                };
                $('vs-input').onkeydown = (e) => { e.stopPropagation(); if (e.key === 'Enter') dial(); };
                $('vs-close').onclick = () => this.hide();

                VSNet.onStatus = (s, err) => {
                    if (s === 'connected') say('CONNECTED. Starting the duel...');
                    else if (s === 'closed') say('Disconnected. ' + (err || ''));
                    else if (s === 'error') say('Failed: ' + (err || ''));
                };
            },

            show() { this.build(); this.el.classList.add('on'); this.open = true; },
            hide() { if (this.el) this.el.classList.remove('on'); this.open = false; },
            toggle() { this.open ? this.hide() : this.show(); }
        };

        // ----------------- ENTRY POINT -----------------
        new Game();
    </script>
</body>
</html>
