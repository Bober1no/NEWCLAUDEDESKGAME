        // ---- STARFIELD ----
const starCanvas = document.getElementById("starfield");
const starCtx = starCanvas.getContext("2d");
starCanvas.width = window.innerWidth;
starCanvas.height = window.innerHeight;

window.starBrightness = 1.0;      // normal brightness
window.targetBrightness = 1.0;    // where it should go
window.brightnessDecay = 0.05;    // how quickly it eases back (tweak for smoothness)

// ---- BOSS VIGNETTE SYSTEM ----
window.vignetteIntensity = 0.0;    // current vignette strength
window.vignetteTargetIntensity = 0.0; // target intensity to fade towards
window.vignetteTransitionRate = 0.02; // how quickly it transitions (higher = faster)
window.vignetteDecayRate = 0.02; // how quickly vignette decays when not active
window.vignetteColor = [0, 0, 0];  // RGB color for vignette

class Star {
    constructor() {
        this.reset();
    }
    reset() {
        this.x = Math.random() * starCanvas.width;
        this.y = Math.random() * starCanvas.height;
        this.size = Math.random() * 1.6 + 0.6;
        this.baseAlpha = 0.3 + Math.random() * 0.7; // base brightness
        this.twinkleSpeed = 0.002 + Math.random() * 0.003; // twinkle rate
        this.offset = Math.random() * Math.PI * 2; // phase shift
        this.speed = 0.05 + Math.random() * 0.05; // downward drift
    }
    update() {
        this.y += this.speed;
        if (this.y > starCanvas.height) {
            this.reset();
            this.y = 0; // reappear at top
        }
    }
    draw(ctx, time) {
    let alpha = this.baseAlpha + Math.sin(time * this.twinkleSpeed + this.offset) * 0.3;
    if (alpha < 0) alpha = 0;

    alpha *= window.starBrightness; // 🔥 apply global brightness multiplier

    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
}


}

let stars = [];
for (let i = 0; i < 150; i++) {
    stars.push(new Star());
}

function drawStars(time) {
    starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);

    // Smooth easing once per frame
    window.starBrightness += (window.targetBrightness - window.starBrightness) * window.brightnessDecay;
    
    // Reset target brightness back to normal after reaching peak
    if (window.targetBrightness > 1.0 && Math.abs(window.starBrightness - window.targetBrightness) < 0.1) {
        window.targetBrightness = 1.0;
    }

    for (let s of stars) {
        s.update();
        s.draw(starCtx, time);
    }

    // Update vignette target based on boss status
    let bossAlive = false;
    if (window.gameInstance) {
        bossAlive = window.gameInstance.enemies.some(e => e.etype === 'artillery' || e.etype === 'miner' || e.nemBoss);
    }

    // Set target intensity based on boss status
    if (!bossAlive) {
        window.vignetteTargetIntensity = 0.0; // Fade out when no boss
    }
    
    // Smoothly transition towards target intensity
    window.vignetteIntensity += (window.vignetteTargetIntensity - window.vignetteIntensity) * window.vignetteTransitionRate;

    // Draw boss vignette on starfield
    if (window.vignetteIntensity > 0.001) {
        let centerX = starCanvas.width / 2;
        let centerY = starCanvas.height / 2;
        let maxRadius = Math.sqrt(centerX * centerX + centerY * centerY);
        
        let gradient = starCtx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius);
        gradient.addColorStop(0, 'rgba(0,0,0,0)'); // Transparent center
        gradient.addColorStop(0.4, 'rgba(0,0,0,0)'); // Still transparent at 60%
        gradient.addColorStop(1, `rgba(${window.vignetteColor[0]},${window.vignetteColor[1]},${window.vignetteColor[2]},${window.vignetteIntensity})`);
        
        starCtx.fillStyle = gradient;
        starCtx.fillRect(0, 0, starCanvas.width, starCanvas.height);
    }

    requestAnimationFrame(drawStars);
}

requestAnimationFrame(drawStars);

// Handle resizing
window.addEventListener("resize", () => {
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;
    stars.forEach(s => s.reset());
});

        const NEM_ORDER = ['breacher','warden','artificer','sapper','inverter','hivemind','colossus','glitch'];

        // ---- Semi-random boss rotation ----
        // The order is rolled fresh every run instead of marching down NEM_ORDER,
        // but it is rolled one full cycle at a time: each block of 8 contains every
        // archetype exactly once, so nothing ever gets skipped. Inside a cycle the
        // pick is weighted, so the run still ramps from cheap to nasty and you don't
        // open on COLOSSUS.
        //   threat: how rough this one is to meet (1 easiest .. 5.2 hardest). Kept
        //           fractional so same-tier bosses shuffle freely against each other.
        //   weight: pull toward the front of the run — heavier shows up earlier and
        //           therefore more often in a short run, lighter hangs back.
        const NEM_BOSS_META = {
            'breacher':  {threat: 1.0, weight: 1.35},
            'glitch':    {threat: 1.6, weight: 1.15},
            'sapper':    {threat: 1.8, weight: 1.00},
            'artificer': {threat: 2.8, weight: 0.80},
            'warden':    {threat: 3.0, weight: 1.00},
            'inverter':  {threat: 3.8, weight: 0.80},
            'hivemind':  {threat: 4.1, weight: 0.70},
            'colossus':  {threat: 5.2, weight: 0.55}
        };
        // Hard ceilings on the first two slots of the opening cycle — a fresh board
        // with no turrets can't answer a HIVEMIND or a COLOSSUS.
        const NEM_OPENER_CAPS = [2, 3];

        // Roll one 8-boss cycle. cycleIndex 0 is bosses 1-8, 1 is 9-16, etc.
        // Every archetype gets a sort key of "how hard it is, nudged by its weight,
        // plus a random shove"; sorting by that key keeps the cycle ramping upward
        // while the shove makes the exact order different every run.
        function nemRollCycle(cycleIndex) {
            // Gaussian shove — small most of the time, occasionally big enough to
            // drag COLOSSUS forward or let BREACHER show up late.
            let gauss = () => {
                let u = Math.max(1e-9, Math.random());
                return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random());
            };
            // Later cycles get messier: by then depth scaling and scars carry the
            // difficulty, so the order may as well stop behaving.
            let sigma = 1.15 + 0.55 * cycleIndex;
            let keyed = NEM_ORDER.map(k => {
                let m = NEM_BOSS_META[k];
                // Heavier weight => earlier/more often; lighter => hangs back.
                return { k: k, key: m.threat + (1 - m.weight) * 0.6 + gauss() * sigma };
            });
            keyed.sort((a, b) => a.key - b.key);
            let out = keyed.map(e => e.k);

            // Opening cycle only: a fresh board with no turrets can't answer a
            // HIVEMIND or a COLOSSUS, so cap the first two slots and swap the
            // offender back for the earliest boss that fits.
            if (cycleIndex === 0) {
                for (let slot = 0; slot < NEM_OPENER_CAPS.length; slot++) {
                    if (NEM_BOSS_META[out[slot]].threat <= NEM_OPENER_CAPS[slot]) continue;
                    for (let j = slot + 1; j < out.length; j++) {
                        if (NEM_BOSS_META[out[j]].threat <= NEM_OPENER_CAPS[slot]) {
                            let tmp = out[slot]; out[slot] = out[j]; out[j] = tmp;
                            break;
                        }
                    }
                }
            }
            return out;
        }

    gradient.addColorStop(1, `rgba(${window.vignetteColor[0]},${window.vignetteColor[1]},${window.vignetteColor[2]},${window.vignetteIntensity})`);
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    
    // Slowly fade the vignette
    // Only fade the vignette if no boss is currently alive
let bossAlive = false;
if (window.gameInstance) {

if (!bossAlive) {

function drawText(ctx, text, x, y, fontSize=FONT_SMALL_SIZE, color=WHITE) {
            ctx.save();
            ctx.font = `${fontSize}px Consolas, monospace`;
            ctx.fillStyle = `rgb(${color[0]},${color[1]},${color[2]})`;
            ctx.textAlign = 'left'; // Ensure consistent text alignment
            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function neonRect(ctx, x, y, w, h, color, border=2, glowIntensity = 6) {
            let [r, g, b] = color;
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, ctx.canvas.width, ctx.canvas.height);
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + h);
            ctx.lineTo(x + w, y + h);
            ctx.lineTo(x + w, y);
            ctx.closePath();
            ctx.clip("evenodd");
            for (let i = glowIntensity; i >= 2; i--) {
                let alpha = (7 * i) / 255;
                ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                ctx.fillRect(x - i, y - i, w + 2 * i, h + 2 * i);
            }
            ctx.restore();
            ctx.strokeStyle = `rgb(${r},${g},${b})`;
            ctx.lineWidth = border;
            ctx.strokeRect(x, y, w, h);
        }

        function drawRoundedRect(ctx, x, y, w, h, radius) {
            if (w < 2 * radius) radius = w / 2;
            if (h < 2 * radius) radius = h / 2;
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
            return ctx;
        }

        function neonRoundedRect(ctx, x, y, w, h, color, radius, border=2, glowIntensity = 6) {
            let [r, g, b] = color;
            ctx.save();
            // Draw the glow by drawing multiple larger, transparent, filled rectangles
            for (let i = glowIntensity; i >= 1; i--) {
                let alpha = (glowIntensity - i + 1) * 0.025; // Adjust alpha for a soft glow
                ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                drawRoundedRect(ctx, x - i, y - i, w + 2 * i, h + 2 * i, radius + i);
                ctx.fill();
            }
            ctx.restore();

            // Draw the main border on top
            ctx.strokeStyle = `rgb(${r},${g},${b})`;
            ctx.lineWidth = border;
            drawRoundedRect(ctx, x, y, w, h, radius);
            ctx.stroke();
        }

        function drawDownArrow(ctx, x, y, size, color) {

            ctx.strokeStyle = `rgb(${r},${g},${b})`;
            ctx.fillStyle = `rgb(${r},${g},${b})`;

            let shaftY = y + size * 0.1;

            ctx.beginPath();
            ctx.moveTo(headX, headY);

            ctx.closePath();
            ctx.fill();

// NEW: Function to draw three overlapping mortar blocks icon with correct L-shape
function drawDuplicatorIcon(ctx, x, y, size, color) {
    let [r, g, b] = color;
    let baseAlpha = 0.7; // Make icon more transparent
    
    let blockSize = size * 0.15; // Individual cell size
    let spacingMultiplier = 1.8; // CHANGE THIS VALUE to adjust spacing (1.0 = touching, higher = more spaced)
    let spacing = blockSize * spacingMultiplier;
    
    // Rest of the function stays the same...
    let positions = [
        [x + size * 0.1, y + size * 0.1],
        [x + size * 0.1 + spacing, y + size * 0.1 + spacing],
        [x + size * 0.1 + spacing * 2, y + size * 0.1 + spacing * 2]
    ];
    
    for (let i = 0; i < positions.length; i++) {
        let [px, py] = positions[i];
        let alpha = baseAlpha - (i * 0.15); // Make back pieces more transparent
        
        // Draw the L-shape: 2 blocks horizontally at bottom, 2 blocks vertically at right
        // This creates the proper L-shape like in Tetris
        let lBlocks = [
            [px + blockSize, py + blockSize * 2],     // Bottom center
            [px + blockSize * 2, py + blockSize * 2], // Bottom right
            [px + blockSize * 2, py + blockSize],     // Middle right
            [px + blockSize * 2, py]                  // Top right
        ];
        
        for (let blockPos of lBlocks) {
            let [bx, by] = blockPos;
            
            // Fill each block
            ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
            ctx.fillRect(bx, by, blockSize, blockSize);
            
            // Outline each block
            ctx.strokeStyle = `rgba(${r},${g},${b},${alpha + 0.3})`;
            ctx.lineWidth = 1.5;
            ctx.strokeRect(bx, by, blockSize, blockSize);
            
            // Add highlight for 3D effect
            ctx.fillStyle = `rgba(${Math.min(255, r + 50)},${Math.min(255, g + 50)},${Math.min(255, b + 50)},${alpha * 0.4})`;
            ctx.fillRect(bx, by, 2, blockSize); // Left highlight
            ctx.fillRect(bx, by, blockSize, 2); // Top highlight
        }
    }
}

// NEW: Function to draw lazer strike icon (targeting reticle with laser beam)
function drawLazerStrikeIcon(ctx, x, y, size, color) {
    let [r, g, b] = color;
    ctx.save(); // contain all state changes (incl. globalAlpha) so they don't leak to the caller
    ctx.strokeStyle = `rgb(${r},${g},${b})`;
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.lineWidth = 2;
    
    // Draw targeting reticle (circle with crosshairs)
    let centerX = x + size / 2;
    let centerY = y + size * 0.7;
    let reticleRadius = size * 0.15;
    
    // Outer targeting circle
    ctx.beginPath();
    ctx.arc(centerX, centerY, reticleRadius, 0, Math.PI * 2);
    ctx.stroke();
    
    // Crosshairs
    ctx.beginPath();
    ctx.moveTo(centerX - reticleRadius * 0.7, centerY);
    ctx.lineTo(centerX + reticleRadius * 0.7, centerY);
    ctx.moveTo(centerX, centerY - reticleRadius * 0.7);
    ctx.lineTo(centerX, centerY + reticleRadius * 0.7);
    ctx.stroke();
    
    // Laser beam coming from top
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(centerX, y);
    ctx.lineTo(centerX, centerY - reticleRadius);
    ctx.stroke();
    
    // Small glow effect on laser beam
    ctx.lineWidth = 6;
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.moveTo(centerX, y);
    ctx.lineTo(centerX, centerY - reticleRadius);
    ctx.stroke();
    ctx.restore();
}

        // ---- Persistence (localStorage; this runs as a real local file) ----
        const META_SAVE_KEY = 'blockshots_meta_v2';
        function defaultMeta() {
            return { version:2, cores:0, ownedNodes:[], keystone:null, focusArm:null,
                     stats:{ bestWave:0, totalRuns:0, timesReforged:0, undosUsed:0, bestNemDepth:0 } };
        }
        function loadMeta() {
            try {
                let raw = localStorage.getItem(META_SAVE_KEY);
                if (!raw) return defaultMeta();
                let d = JSON.parse(raw);
                if (!d || d.version !== 2) return defaultMeta(); // version mismatch -> fresh (migrate later)
                let m = defaultMeta();
                m.cores = (typeof d.cores === 'number' && d.cores >= 0) ? d.cores : 0;
                m.ownedNodes = Array.isArray(d.ownedNodes) ? d.ownedNodes.filter(id => META_BY_ID[id]) : [];
                m.keystone = META_BY_ID[d.keystone] ? d.keystone : null;
                m.focusArm = ['mun', 'tmp', 'for', 'sal'].includes(d.focusArm) ? d.focusArm : null;
                if (d.stats) {
                    m.stats.bestWave = d.stats.bestWave || 0;
                    m.stats.totalRuns = d.stats.totalRuns || 0;
                    m.stats.timesReforged = d.stats.timesReforged || 0;
                    m.stats.undosUsed = d.stats.undosUsed || 0;
                    m.stats.bestNemDepth = d.stats.bestNemDepth || 0; // NEMESIS: deepest boss killed
                }
                return m;
            } catch (e) { return defaultMeta(); }
        }
        function saveMeta(m) { try { localStorage.setItem(META_SAVE_KEY, JSON.stringify(m)); } catch (e) {} }
        function exportMeta(m) { try { return btoa(JSON.stringify(m)); } catch (e) { return ''; } }
        function importMeta(str) { try { let m = JSON.parse(atob(str)); return (m && m.version === 2) ? m : null; } catch (e) { return null; } }

    getPositionAtMs(targetMs) {
        let gridX = LEFT_PANEL_WIDTH;
        if (this.history.length === 0) {
            return [gridX + this.col * CELL + CELL / 2, Math.floor(this.y * CELL + CELL / 2)];
        }
        if (targetMs <= this.history[0][0]) return [this.history[0][1], this.history[0][2]];
        if (targetMs >= this.history[this.history.length - 1][0]) return [this.history[this.history.length - 1][1], this.history[this.history.length - 1][2]];
        for (let i = 0; i < this.history.length - 1; i++) {
            let [t0, x0, y0] = this.history[i];
            let [t1, x1, y1] = this.history[i + 1];
            if (t0 <= targetMs && targetMs <= t1) {
                if (t1 === t0) return [x0, y0];
                let frac = (targetMs - t0) / (t1 - t0);
                return [x0 + (x1 - x0) * frac, y0 + (y1 - y0) * frac];
            }
        }
        return [this.history[this.history.length - 1][1], this.history[this.history.length - 1][2]];
    }

        class GeometricParticle {
            constructor(x, y, color, type = 'hex') {

                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.color = color;

                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.08;
                this.opacity = 1;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.99;
                this.vy *= 0.99;
                this.rotation += this.rotationSpeed;
                this.life--;
                this.opacity = this.life / this.maxLife;
                this.pulsePhase += 0.08;
            }
            
            draw(ctx) {
                if (this.life <= 0) return;
                
                let [r, g, b] = this.color;
                let pulse = 0.8 + 0.2 * Math.sin(this.pulsePhase);
                let alpha = this.opacity * pulse;
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
                ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.3})`;
                ctx.lineWidth = 1.5;
                
                if (this.type === 'hex') this.drawHexagon(ctx, this.size);
                else if (this.type === 'diamond') this.drawDiamond(ctx, this.size);
                else if (this.type === 'star') this.drawStar(ctx, this.size);
                else if (this.type === 'ring') this.drawRing(ctx, this.size);
                
                ctx.restore();
            }
            
            drawHexagon(ctx, size) {
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    let angle = (i * Math.PI) / 3;
                    let x = Math.cos(angle) * size;
                    let y = Math.sin(angle) * size;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
            
            drawDiamond(ctx, size) {
                ctx.beginPath();
                ctx.moveTo(0, -size);
                ctx.lineTo(size, 0);
                ctx.lineTo(0, size);
                ctx.lineTo(-size, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
            
            drawStar(ctx, size) {
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    let angle = (i * 4 * Math.PI) / 5;
                    let radius = i % 2 === 0 ? size : size * 0.5;
                    let x = Math.cos(angle) * radius;
                    let y = Math.sin(angle) * radius;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
            
            drawRing(ctx, size) {
                ctx.beginPath();
                ctx.arc(0, 0, size, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, 0, size * 0.6, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

                let gradient = ctx.createLinearGradient(-this.size, -this.size, this.size, this.size);
                gradient.addColorStop(0, `rgba(255,255,255,${alpha})`);
                gradient.addColorStop(0.5, `rgba(255,255,255,${alpha * 0.5})`);
                gradient.addColorStop(1, `rgba(255,255,255,${alpha * 0.1})`);
                
                ctx.fillStyle = gradient;
                ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.7})`;
                ctx.lineWidth = 1;
                
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.3, -this.size);
                ctx.lineTo(this.size * 0.7, -this.size * 0.3);
                ctx.lineTo(this.size * 0.4, this.size * 0.8);
                ctx.lineTo(-this.size * 0.6, this.size * 0.4);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                ctx.restore();
            }
        }

        class ConfettiParticle {
            constructor(x, y, color, shape = 'rect') {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4; // horizontal drift
                this.vy = Math.random() * 2 + 1; // falling speed
                this.color = color;
                this.shape = shape; // 'rect', 'triangle', 'circle'
                this.life = Math.random() * 300 + 240; // 4-9 seconds at 60fps (longer for debugging)
                this.maxLife = this.life;
                this.size = Math.random() * 8 + 5; // Larger size for visibility
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
                this.gravity = 0.1;
                this.isSparkle = false;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.rotationSpeed;
                this.life -= 1;
                
                // Add some air resistance
                this.vx *= 0.99;
                this.vy *= 0.995;
            }
            
            draw(ctx) {
                if (this.life <= 0) return;
                
                let alpha = Math.max(0.6, Math.min(1, this.life / this.maxLife)); // More visible alpha
                let [r, g, b] = this.color;
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
                
                if (this.shape === 'rect') {
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                } else if (this.shape === 'triangle') {
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size/2);
                    ctx.lineTo(-this.size/2, this.size/2);
                    ctx.lineTo(this.size/2, this.size/2);
                    ctx.closePath();
                    ctx.fill();
                } else if (this.shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size/2, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Sparkle effect for high scores
                if (this.isSparkle && Math.random() < 0.3) {
                    ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.8})`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(-this.size, 0);
                    ctx.lineTo(this.size, 0);
                    ctx.moveTo(0, -this.size);
                    ctx.lineTo(0, this.size);
                    ctx.stroke();
                }
                
                ctx.restore();
            }
        }

        class Projectile {
            constructor(sx, sy, targetEnemy, game, color, damage=1) {
                this.x = sx; this.y = sy; this.target = targetEnemy; this.game = game;
                let estEnemyPxPerSec = Math.max(16.0, targetEnemy.baseSpeed * CELL * FPS);
                this.speed = Math.max(300.0, estEnemyPxPerSec * 1.2);
                this.color = color; this.damage = damage;
                this.dead = false; this.maxLifeMs = 3000;
                this.spawnTime = Date.now(); this.arcPhase = Math.random() * Math.PI * 2;
                this.hitRadius = CELL * 0.6;
            }
            update() {
                let now = Date.now();
                if (this.dead || now - this.spawnTime > this.maxLifeMs) { this.dead = true; return; }
                if (this.target !== null && this.target.hp <= 0) this.target = null;
                if (this.target === null) { this.dead = true; return; }
                let [tx, ty] = this.target.getPositionAtMs(now);
                let dx = tx - this.x, dy = ty - this.y;
                let dist = Math.hypot(dx, dy) || 1.0;
                let dt = 1.0 / FPS;
                this.x += (dx / dist) * this.speed * dt;
                this.y += (dy / dist) * this.speed * dt;
                this.arcPhase += 0.25;
                // Reuse the same position coordinates for collision detection to avoid race conditions
                if (Math.hypot(tx - this.x, ty - this.y) <= this.hitRadius) {
                    if (this.target.etype === 'juggernaut') {
                        this.game.spawnExplosionParticles(tx, ty, [100, 100, 100], 4, 1.0);
                    } else {
                        let pdmg = this.damage * (this.game ? this.game.getProjectileDamageMult() : 1); // SKILL: Overcharged / Plasma Rounds
                        if (this.game) this.game.applyEnemyDamage(this.target, pdmg, 'gatling'); // NEMESIS: shield/scar/runMod hooks
                        else this.target.hp -= pdmg;
                        this.game.spawnExplosionParticles(tx, ty, this.color, 8, 1.6);
                    }
                    this.dead = true;
                }
            }
            draw(ctx) {
                let bob = Math.sin(this.arcPhase) * 6;
                let [r, g, b] = this.color;
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.beginPath(); ctx.arc(Math.floor(this.x), Math.floor(this.y - bob), 4.2, 0, Math.PI * 2); ctx.fill();
            }
        }

        // ---------------- ORBITAL STRIKE CLASSES ----------------
        class OrbitalStrikeEffect {
            constructor(x, y, game) {
                this.x = x;
                this.y = y;
                this.game = game;
                this.phase = 'incoming'; // 'incoming', 'impact', 'explosion'
                this.timer = 0;
                this.maxTimer = 30; // frames for incoming phase
                this.impactTimer = 0;
                this.maxImpactTimer = 20; // frames for explosion
                this.targetIndicatorTimer = 10; // frames to show target indicator
                this.dead = false;
            }
            
            update() {
                if (this.dead) return;
                
                if (this.phase === 'incoming') {
                    this.timer++;
                    if (this.timer >= this.maxTimer) {
                        this.phase = 'impact';
                        this.executeStrike();
                    }
                } else if (this.phase === 'impact') {
                    this.impactTimer++;
                    if (this.impactTimer >= this.maxImpactTimer) {
                        this.dead = true;
                    }
                }
            }
            
            executeStrike() {
                // Apply damage to enemies in area
                this.damageEnemiesInArea();
                // Destroy blocks in area and give scrap refund
                this.destroyBlocksInArea();
                // Create screen shake
                this.game.addScreenShake(8);
                // Spawn explosion particles
                this.game.spawnExplosionParticles(this.x, this.y, [255, 150, 50], 25, 3.0);
            }
            
            damageEnemiesInArea() {
                // Use grid-based damage calculation for more reliable hits
                const gridX = LEFT_PANEL_WIDTH;
                const centerCol = Math.floor((this.x - gridX) / CELL);
                const centerRow = Math.floor(this.y / CELL);
                
                
                for (let enemy of this.game.enemies) {
                    if (enemy.hp <= 0) continue; // Skip dead enemies
                    
                    let [ex, ey] = enemy.getPositionAtMs(Date.now());
                    const enemyCol = Math.floor((ex - gridX) / CELL);
                    const enemyRow = Math.floor(ey / CELL);
                    
                    // Check if enemy is within the damage grid area (more generous for enemies)
                    const rowDiff = Math.abs(enemyRow - centerRow);
                    const colDiff = Math.abs(enemyCol - centerCol);
                    const enemyDamageRadius = ORBITAL_STRIKE_RADIUS + 0.5; // More forgiving for enemies
                    
                    if (rowDiff <= enemyDamageRadius && colDiff <= enemyDamageRadius) {
                        // Determine damage based on enemy type
                        let damagePercent = ORBITAL_STRIKE_DAMAGE_PERCENT; // Default 90% for regular enemies
                        let enemyType = "regular";
                        
                        // Check for bosses (artillery, miner, nemesis) and juggernauts
                        if (enemy.etype === 'artillery' || enemy.etype === 'miner' || enemy.etype === 'juggernaut' || enemy.nemBoss) {
                            damagePercent = 0.15; // 15% for bosses and juggernauts
                            enemyType = (enemy.etype === 'artillery' || enemy.etype === 'miner' || enemy.nemBoss) ? "boss" : "juggernaut";
                        } else if (enemy.etype === 'tank') {
                            damagePercent = 0.10; // 10% for tanks
                            enemyType = "tank";
                        }

                        let damage = enemy.maxHp * damagePercent;
                        this.game.applyEnemyDamage(enemy, damage, 'lazer'); // NEMESIS: shield/scar/runMod hooks
                        
                        // Add visual feedback for successful hit
                        this.game.spawnExplosionParticles(ex, ey, [255, 50, 50], 15, 2.0);
                    } else {
                    }
                }
            }
            
            destroyBlocksInArea() {
                const gridX = LEFT_PANEL_WIDTH;
                const centerCol = Math.floor((this.x - gridX) / CELL);
                const centerRow = Math.floor(this.y / CELL);
                let scrapRefund = 0;
                
                for (let dy = -ORBITAL_STRIKE_RADIUS; dy <= ORBITAL_STRIKE_RADIUS; dy++) {
                    for (let dx = -ORBITAL_STRIKE_RADIUS; dx <= ORBITAL_STRIKE_RADIUS; dx++) {
                        let row = centerRow + dy;
                        let col = centerCol + dx;
                        if (row >= 0 && row < ROWS && col >= 0 && col < COLS && this.game.board[row][col] !== null) {
                            // Calculate scrap refund based on block type
                            let block = this.game.board[row][col];
                            let baseHP = BASE_HP[block.shape] || 1;
                            scrapRefund += Math.floor(baseHP * ORBITAL_STRIKE_SCRAP_REFUND);
                            
                            // Destroy the block
                            this.game.board[row][col] = null;
                        }
                    }
                }
                
                // Give scrap refund
                this.game.scraps += scrapRefund;
            }
            
            draw(ctx) {
                if (this.dead) return;
                
                // Draw targeting reticle before incoming phase
                if (this.targetIndicatorTimer > 0) {
                    this.targetIndicatorTimer--;
                    // Draw targeting reticle
                    ctx.strokeStyle = `rgba(255, 50, 50, ${0.5 + 0.5 * Math.sin(this.targetIndicatorTimer * 0.5)})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 20, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    // Draw crosshair
                    ctx.beginPath();
                    ctx.moveTo(this.x - 15, this.y);
                    ctx.lineTo(this.x + 15, this.y);
                    ctx.moveTo(this.x, this.y - 15);
                    ctx.lineTo(this.x, this.y + 15);
                    ctx.stroke();
                }
                
                if (this.phase === 'incoming') {
                    // Draw incoming laser beam
                    let progress = this.timer / this.maxTimer;
                    let beamLength = progress * (this.y + 50);
                    
                    ctx.save();
                    ctx.strokeStyle = `rgba(255, 100, 50, ${0.8 * progress})`;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(this.x, -50);
                    ctx.lineTo(this.x, -50 + beamLength);
                    ctx.stroke();
                    
                    // Add glow effect
                    ctx.strokeStyle = `rgba(255, 200, 150, ${0.4 * progress})`;
                    ctx.lineWidth = 8;
                    ctx.stroke();
                    ctx.restore();
                    
                } else if (this.phase === 'impact') {
                    // Draw explosion effect
                    let progress = this.impactTimer / this.maxImpactTimer;
                    let radius = (1 - progress) * ORBITAL_STRIKE_RADIUS * CELL * 1.5;
                    let alpha = (1 - progress) * 0.8;
                    
                    ctx.save();
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Outer ring
                    ctx.fillStyle = `rgba(255, 150, 50, ${alpha * 0.6})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius * 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }
        }

        return "The developer has a hard time getting here!";
}

            fpsToUse = this.currentFps;

        return `(V3.0 ${mode}, ${fpsToUse}fps)`;
    }

    // NEW: Ghost piece position calculation
    getGhostPiecePosition() {
        if (!this.piece) return null;
        
        // Create a copy of the current piece
        let ghostPiece = {
            x: this.piece.x,
            y: this.piece.y,
            cells: this.piece.cells.map(c => [...c]),
            kind: this.piece.kind
        };
        
        // Move it down until it can't move anymore
        while (true) {
            ghostPiece.y += 1;
            let canMove = true;
            for (let [cx, cy] of ghostPiece.cells) {
                let gx = ghostPiece.x + cx;
                let gy = ghostPiece.y + cy;
                if (gx < 0 || gx >= COLS || gy >= ROWS || (gy >= 0 && this.board[gy][gx] !== null)) {
                    canMove = false;
                    break;
                }
            }
            if (!canMove) {
                ghostPiece.y -= 1; // Step back to last valid position
                break;
            }
        }
        
        return ghostPiece;
    }
    
    buyMineBlock() {
        let cost = this.getMineCost(); // SKILL: Bargain Hunter discount
        if (this.scraps >= cost) {
            this.scraps -= cost;
            this.piece = new Piece('O');
            this.piece.x = Math.floor(COLS / 2) - 2;
            this.piece.y = -1;
            
            // If duplicator queue exists, update it to contain mines instead
            if (this.duplicatorQueue.length > 0) {
                this.duplicatorQueue = this.duplicatorQueue.map(() => 'O');
                this.nextPiece = new Piece('O');
            }
        }
    }
            // NEW: Grid shift power-up function
            useGridShift() {
                if (this.scraps >= GRID_SHIFT_COST) {
                    this.scraps -= GRID_SHIFT_COST;
                    
                    // Count blocks in bottom row for scoring
                    let removedBlocks = 0;
                    for (let x = 0; x < COLS; x++) {
                        if (this.board[ROWS - 1][x] !== null) {
                            removedBlocks++;
                        }
                    }
                    
                    // Shift all rows down by one
                    for (let y = ROWS - 1; y > 0; y--) {
                        for (let x = 0; x < COLS; x++) {
                            this.board[y][x] = this.board[y - 1][x];
                        }
                    }
                    
                    // Clear the top row
                    for (let x = 0; x < COLS; x++) {
                        this.board[0][x] = null;
                    }
                    
                    // Award score for removed blocks
                    this.score += Math.round(removedBlocks * GRID_SHIFT_SCORE_PER_BLOCK * this.getGridScoreMult()); // SKILL: Tempo grid-shift score
                    this.scraps += this.getGridShiftRefund(); // SKILL: Recycler refund
                    
                    // Visual effects for removed blocks
                    if (removedBlocks > 0) {
                        let gridX = LEFT_PANEL_WIDTH;
                        for (let x = 0; x < COLS; x++) {
                            this.spawnExplosionParticles(
                                gridX + x * CELL + CELL / 2, 
                                (ROWS - 1) * CELL + CELL / 2, 
                                NEON_MAGENTA, 
                                6, 
                                2.0
                            );
                        }
                    }
                    
                    // Re-apply helper buffs after grid shift
                    this.applyHelperBuffs();
                }
            }

            // NEW: Space bar reward function
            giveSpaceReward() {
                let baseScore = 10;
                let baseScraps = 2;
                
                // Apply level multipliers
                let scoreReward = Math.round(baseScore * getScoreMultiplier(this.level));
                let scrapReward = Math.round(baseScraps * getScrapsMultiplier(this.level) * this.getScrapGainMult()) + this.getDropScrapBonus(); // meta scrap bonus

                this.score += scoreReward;
                this.scraps += scrapReward;
                this.totalScrapsEarned += scrapReward; // Track total scraps earned
            }

            // ================= META SKILL TREE: accessors, logic & rendering =================
            // In-run effect accessors — read this.meta (computed from owned meta nodes).
            getScrapGainMult()       { return this.meta ? this.meta.scrapMult : 1; }
            getMoveCool()            { return Math.round(15 * (this.meta ? this.meta.moveCoolMult : 1)); }
            getMineCost()            { return Math.max(1, Math.round(MINE_COST * (this.meta ? this.meta.abilityCostMult : 1))); }
            getDropScrapBonus()      { return 0; } // no Phase-1 node grants this; kept for the call site
            getProjectileDamageMult(){ return this.meta ? this.meta.turretDmgMult : 1; }
            getFireRateMult()        { return this.meta ? this.meta.fireRateMult : 1; }
            getMortarRangeBonus()    { return this.meta ? this.meta.mortarRange : 0; }
            getKillScrapBonus()      { return this.meta ? this.meta.killScrapBonus : 0; }
            getGridShiftRefund()     { return this.meta ? this.meta.gridShiftRefund : 0; }
            getJackpotMult(lines)    { return (lines >= 4 && this.meta) ? this.meta.jackpotMult : 1; }
            getGravityTicks()        { return BASE_GRAVITY_TICKS * (this.meta ? this.meta.gravityMult : 1); }
            getGridScoreMult()       { return this.meta ? this.meta.gridScoreMult : 1; }
            getSlowStrengthMult()    { return this.meta ? this.meta.slowStrengthMult : 1; }
            getSlowRadiusBonus()     { return this.meta ? this.meta.slowRadiusBonus : 0; }
            getPicketDmg()           { return this.meta ? this.meta.picketDmg : 0; }
            hasSecondWind()          { return this.meta ? this.meta.secondWind : false; }

            // ---- purchase rules ----
            metaCanBuy(node) {
                let owned = this.metaSave.ownedNodes;
                if (owned.includes(node.id)) return { ok:false, why:'Already owned' };
                if (node.prereq && node.prereq.length > 0 && !node.prereq.some(p => owned.includes(p)))
                    return { ok:false, why:'Unlock a connected node first' };
                if (node.keystone) {
                    let t4 = owned.filter(id => { let n = META_BY_ID[id]; return n.arm === node.arm && n.tier === 4; }).length;
                    if (t4 < 2) return { ok:false, why:'Need 2 tier-4 nodes in this arm' };
                    if (this.metaSave.keystone) return { ok:false, why:'Only one keystone allowed' };
                }
                if (node.tier >= 3 && this.metaSave.focusArm && this.metaSave.focusArm !== node.arm)
                    return { ok:false, why:`Committed to ${this.metaArmName(this.metaSave.focusArm)}` };
                if (this.metaSave.cores < node.cost) return { ok:false, why:'Not enough Cores' };
                return { ok:true };
            }
            metaArmName(a) { return META_ARM_NAME[a] || a; }
            buyMetaNode(node) {
                let r = this.metaCanBuy(node);
                if (!r.ok) return false;
                this.metaSave.cores -= node.cost;
                this.metaSave.ownedNodes.push(node.id);
                if (node.tier >= 3 && !this.metaSave.focusArm) this.metaSave.focusArm = node.arm;
                if (node.keystone) this.metaSave.keystone = node.id;
                this.skillPulse[node.id] = 1.0;
                this.meta = computeMetaBonuses(this.metaSave.ownedNodes); // apply immediately
                saveMeta(this.metaSave);
                return true;
            }
            reforgeInfo() {
                let spent = this.metaSave.ownedNodes.reduce((s, id) => s + (META_BY_ID[id] ? META_BY_ID[id].cost : 0), 0);
                let refund = Math.floor(spent * 0.75);
                let surcharge = 150 * this.metaSave.stats.timesReforged;
                return { spent, refund, surcharge, net: refund - surcharge };
            }
            doReforge() {
                let info = this.reforgeInfo();
                this.metaSave.cores += info.net;
                if (this.metaSave.cores < 0) this.metaSave.cores = 0;
                this.metaSave.ownedNodes = [];
                this.metaSave.keystone = null;
                this.metaSave.focusArm = null;
                this.metaSave.stats.timesReforged += 1;
                this.meta = computeMetaBonuses(this.metaSave.ownedNodes);
                saveMeta(this.metaSave);
            }
            undoCost() {
                let n = (this.metaSave.stats && this.metaSave.stats.undosUsed) || 0;
                return n === 0 ? 0 : Math.round(25 * Math.pow(1.6, n - 1)); // 1st free, then rising
            }
            doUndo() {
                if (this.metaSave.ownedNodes.length === 0) return;
                let cost = this.undoCost();
                if (this.metaSave.cores < cost) return;
                let id = this.metaSave.ownedNodes.pop(); // last purchase has no owned children (safe)
                let node = META_BY_ID[id];
                this.metaSave.cores -= cost;                 // pay the undo fee
                if (node) this.metaSave.cores += node.cost;   // refund the node's cost
                this.metaSave.stats.undosUsed = ((this.metaSave.stats && this.metaSave.stats.undosUsed) || 0) + 1;
                // recompute focus arm + keystone from what remains
                let deep = this.metaSave.ownedNodes.find(nid => META_BY_ID[nid] && META_BY_ID[nid].tier >= 3);
                this.metaSave.focusArm = deep ? META_BY_ID[deep].arm : null;
                let ks = this.metaSave.ownedNodes.find(nid => META_BY_ID[nid] && META_BY_ID[nid].keystone);
                this.metaSave.keystone = ks || null;
                this.meta = computeMetaBonuses(this.metaSave.ownedNodes);
                saveMeta(this.metaSave);
            }

            // ---- pan / scroll input ----
            clampMetaScroll(s) { return Math.max(0, Math.min(s, this.metaMaxScroll || 0)); }
            handleCanvasMouseDown(e) {
                if (!this.skillTreeOpen || this.metaConfirm) return;
                const rect = this.canvas.getBoundingClientRect();
                let mx = e.clientX - rect.left, my = e.clientY - rect.top;
                let v = this.metaViewport;
                if (v && mx >= v.x && mx <= v.x + v.w && my >= v.y && my <= v.y + v.h) {
                    this.metaDragging = true;
                    this.metaDragStartY = my;
                    this.metaScrollStart = this.metaScroll;
                    this.metaDidDrag = false;
                }
            }
            handleCanvasMouseUp() { this.metaDragging = false; }
            handleCanvasWheel(e) {
                if (!this.skillTreeOpen) return;
                e.preventDefault();
                this.metaScroll = this.clampMetaScroll(this.metaScroll + e.deltaY * 0.5);
            }

            handleSkillTreeClick(mx, my) {
                // Confirmation dialog intercepts everything
                if (this.metaConfirm) {
                    let y = this.metaConfirmYesBounds, n = this.metaConfirmNoBounds;
                    if (y && mx >= y.x && mx <= y.x + y.w && my >= y.y && my <= y.y + y.h) {
                        if (this.metaConfirm.type === 'reforge') this.doReforge();
                        else if (this.metaConfirm.type === 'keystone') this.buyMetaNode(META_BY_ID[this.metaConfirm.nodeId]);
                        this.metaConfirm = null; return;
                    }
                    this.metaConfirm = null; return; // No, or click anywhere else, cancels
                }
                // Info overlay: any click closes it
                if (this.metaInfoOpen) { this.metaInfoOpen = false; return; }
                // A drag shouldn't count as a click
                if (this.metaDidDrag) { this.metaDidDrag = false; return; }
                // Close (X)
                let cb = this.skillTreeCloseBounds;
                if (cb && mx >= cb.x && mx <= cb.x + cb.w && my >= cb.y && my <= cb.y + cb.h) { this.skillTreeOpen = false; return; }
                // Header buttons
                let ub = this.metaUndoBounds;
                if (ub && mx >= ub.x && mx <= ub.x + ub.w && my >= ub.y && my <= ub.y + ub.h) {
                    if (this.metaSave.ownedNodes.length > 0 && this.metaSave.cores >= this.undoCost()) this.doUndo();
                    return;
                }
                let rb = this.metaReforgeBounds;
                if (rb && mx >= rb.x && mx <= rb.x + rb.w && my >= rb.y && my <= rb.y + rb.h) { this.metaConfirm = { type:'reforge' }; return; }
                let eb = this.metaExportBounds;
                if (eb && mx >= eb.x && mx <= eb.x + eb.w && my >= eb.y && my <= eb.y + eb.h) { try { window.prompt('Copy your save string:', exportMeta(this.metaSave)); } catch (err) {} return; }
                let ib = this.metaImportBounds;
                if (ib && mx >= ib.x && mx <= ib.x + ib.w && my >= ib.y && my <= ib.y + ib.h) {
                    try { let s = window.prompt('Paste a save string:'); if (s) { if (s.trim() === 'FREE_CORES') { this.metaSave.cores += 1000; saveMeta(this.metaSave); } else { let m = importMeta(s); if (m) { this.metaSave = m; saveMeta(m); this.meta = computeMetaBonuses(m.ownedNodes); } } } } catch (err) {}
                    return;
                }
                let ifb = this.metaInfoBounds;
                if (ifb && mx >= ifb.x && mx <= ifb.x + ifb.w && my >= ifb.y && my <= ifb.y + ifb.h) { this.metaInfoOpen = true; return; }
                // Node clicks (only visible nodes have bounds)
                for (let id in this.skillNodeBounds) {
                    let b = this.skillNodeBounds[id];
                    let dx = mx - b.cx, dy = my - b.cy;
                    if (dx * dx + dy * dy <= b.r * b.r) {
                        let node = META_BY_ID[id];
                        if (node.keystone) { if (this.metaCanBuy(node).ok) this.metaConfirm = { type:'keystone', nodeId:id }; }
                        else this.buyMetaNode(node);
                        return;
                    }
                }
                // Click outside the panel closes it
                let m = this.skillTreeModalBounds;
                if (m && (mx < m.x || mx > m.x + m.w || my < m.y || my > m.y + m.h)) this.skillTreeOpen = false;
            }

            drawSkillTree() {
                let ctx = this.ctx;

                ctx.setTransform(1, 0, 0, 1, 0, 0);
                let now = performance.now() / 1000;

                let modalY = Math.floor((SCREEN_H - modalH) / 2);
                this.skillTreeModalBounds = { x: modalX, y: modalY, w: modalW, h: modalH };
                ctx.fillStyle = 'rgba(16,10,28,0.97)';
                drawRoundedRect(ctx, modalX, modalY, modalW, modalH, 16); ctx.fill();
                neonRoundedRect(ctx, modalX, modalY, modalW, modalH, NEON_PURPLE, 16, 2.5, 9);

                let focusTxt = this.metaSave.focusArm ? `Focus: ${this.metaArmName(this.metaSave.focusArm)}` : 'Focus: none yet';
                let keyTxt = this.metaSave.keystone ? `   Keystone: ${META_BY_ID[this.metaSave.keystone].name}` : '';
                drawText(ctx, focusTxt + keyTxt, modalX + 24, modalY + 92, FONT_SMALL_SIZE, [180, 170, 205]);

                // Close (X)
                let xs = 34, xx = modalX + modalW - xs - 16, xy = modalY + 14;
                this.skillTreeCloseBounds = { x: xx, y: xy, w: xs, h: xs };
                let xHot = (this.mouseX >= xx && this.mouseX <= xx + xs && this.mouseY >= xy && this.mouseY <= xy + xs);
                neonRoundedRect(ctx, xx, xy, xs, xs, xHot ? NEON_RED : [150, 120, 180], 8, 2, xHot ? 6 : 3);
                ctx.save();
                ctx.strokeStyle = xHot ? `rgb(${NEON_RED[0]},${NEON_RED[1]},${NEON_RED[2]})` : 'rgb(180,160,200)';
                ctx.lineWidth = 2.5; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(xx + 11, xy + 11); ctx.lineTo(xx + xs - 11, xy + xs - 11);
                ctx.moveTo(xx + xs - 11, xy + 11); ctx.lineTo(xx + 11, xy + xs - 11);
                ctx.stroke(); ctx.restore();

                // Header buttons: Undo / Reforge / Export / Import
                let bw = 84, bh = 26, gap = 8, by = modalY + 56;
                let ibx = modalX + modalW - 16 - bw;
                let ebx = ibx - gap - bw;
                let rbx = ebx - gap - bw;
                let ubx = rbx - gap - bw;
                this.metaImportBounds  = { x: ibx, y: by, w: bw, h: bh };
                this.metaExportBounds  = { x: ebx, y: by, w: bw, h: bh };
                this.metaReforgeBounds = { x: rbx, y: by, w: bw, h: bh };
                this.metaUndoBounds    = { x: ubx, y: by, w: bw, h: bh };
                let drawHdrBtn = (b, label, col, enabled) => {
                    if (enabled === undefined) enabled = true;
                    let hot = enabled && (this.mouseX >= b.x && this.mouseX <= b.x + b.w && this.mouseY >= b.y && this.mouseY <= b.y + b.h);
                    ctx.save();
                    if (!enabled) ctx.globalAlpha = 0.4;
                    ctx.fillStyle = hot ? 'rgba(60,42,92,0.95)' : 'rgba(30,20,48,0.9)';
                    drawRoundedRect(ctx, b.x, b.y, b.w, b.h, 7); ctx.fill();
                    neonRoundedRect(ctx, b.x, b.y, b.w, b.h, col, 7, 1.5, hot ? 5 : 3);
                    ctx.textAlign = 'center'; ctx.font = `${FONT_SMALL_SIZE}px Consolas, monospace`;
                    ctx.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`; ctx.fillText(label, b.x + b.w / 2, b.y + 17);
                    ctx.restore();
                };
                let uCost = this.undoCost();
                let canUndo = this.metaSave.ownedNodes.length > 0 && this.metaSave.cores >= uCost;
                drawHdrBtn(this.metaUndoBounds, uCost === 0 ? 'UNDO' : `UNDO ${uCost}`, NEON_CYAN, canUndo);
                drawHdrBtn(this.metaReforgeBounds, 'REFORGE', NEON_ORANGE);
                drawHdrBtn(this.metaExportBounds, 'EXPORT', [150, 170, 210]);
                drawHdrBtn(this.metaImportBounds, 'IMPORT', [150, 170, 210]);

                // ---- Scrollable viewport ----
                let vx = modalX + 16, vy = modalY + 104, vw = modalW - 32, vh = modalH - 104 - 30;
                this.metaViewport = { x: vx, y: vy, w: vw, h: vh };
                let ROWH = 74, topPad = 40;
                // Widen each side around the tree centre and pull the halves inward to fill the dead middle
                let TC = 6.45, SPREAD = 1.24, GAPPULL = 1.05;
                let ax = (x) => { let h = x - TC; return TC + Math.sign(h) * Math.max(0.05, Math.abs(h) * SPREAD - GAPPULL); };
                let xsArr = META_TREE.map(n => ax(n.x)), ysArr = META_TREE.map(n => n.y);
                let minX = Math.min(...xsArr), maxX = Math.max(...xsArr);
                let minY = Math.min(...ysArr), maxY = Math.max(...ysArr);
                let span = Math.max(1, maxX - minX);
                let COLW = Math.min(82, (vw - 96) / span);
                let leftPad = (vw - span * COLW) / 2 - minX * COLW;
                let contentH = topPad + (maxY - minY) * ROWH + 90;
                this.metaMaxScroll = Math.max(0, contentH - vh);
                let posOf = (node) => ({ cx: vx + leftPad + ax(node.x) * COLW, cy: vy + topPad + (node.y - minY) * ROWH - this.metaScroll });
                // Center the view on the root the first time the menu is opened
                if (this.metaNeedCenter) {
                    this.metaScroll = topPad + (0.2 - minY) * ROWH - vh / 2;
                    this.metaNeedCenter = false;
                }
                this.metaScroll = this.clampMetaScroll(this.metaScroll);

                ctx.save();
                drawRoundedRect(ctx, vx, vy, vw, vh, 8); ctx.clip();

                // Connectors (curved, following prereq links — branches diverge & merge)
                for (let node of META_TREE) {
                    if (!node.prereq) continue;
                    let p = posOf(node);
                    let oN = this.metaSave.ownedNodes.includes(node.id);
                    for (let pre of node.prereq) {
                        let parent = META_BY_ID[pre];
                        if (!parent) continue;
                        let pp = posOf(parent);
                        if ((p.cy < vy - 70 && pp.cy < vy - 70) || (p.cy > vy + vh + 70 && pp.cy > vy + vh + 70)) continue;
                        let oP = this.metaSave.ownedNodes.includes(pre);
                        let col = (oN && oP) ? node.color : (oP ? [150, 130, 190] : [70, 60, 90]);
                        ctx.save();
                        ctx.strokeStyle = `rgba(${col[0]},${col[1]},${col[2]},${(oN && oP) ? 0.95 : 0.5})`;
                        ctx.lineWidth = (oN && oP) ? 4 : 2.5;
                        ctx.lineCap = 'round';
                        let mx = (pp.cx + p.cx) / 2, my = (pp.cy + p.cy) / 2;
                        let dx = p.cx - pp.cx, dy = p.cy - pp.cy, len = Math.hypot(dx, dy) || 1;
                        let off = Math.min(26, len * 0.18);
                        let cxp = mx + (-dy / len) * off, cyp = my + (dx / len) * off;
                        ctx.beginPath(); ctx.moveTo(pp.cx, pp.cy); ctx.quadraticCurveTo(cxp, cyp, p.cx, p.cy); ctx.stroke();
                        ctx.restore();
                    }
                }

                // Nodes
                this.skillNodeBounds = {};
                for (let node of META_TREE) {
                    let p = posOf(node);
                    let nodeR = node.keystone ? 32 : (node.notable ? 27 : (node.tier === 0 ? 24 : 22));
                    if (p.cy < vy - 60 || p.cy > vy + vh + 60) continue; // cull off-screen
                    this.skillNodeBounds[node.id] = { cx: p.cx, cy: p.cy, r: nodeR };
                    let owned = this.metaSave.ownedNodes.includes(node.id);
                    let available = this.metaCanBuy(node).ok;
                    let hovered = this.hoveredSkill === node.id;
                    let baseCol = node.color;
                    let ringCol, ringAlpha, glow;
                    if (owned) { ringCol = baseCol; ringAlpha = 1; glow = 0.5 + 0.5 * Math.sin(now * 2); }
                    else if (available) { ringCol = baseCol; ringAlpha = 1; glow = 0.45 + 0.45 * Math.sin(now * 3.5); }
                    else { ringCol = [90, 80, 110]; ringAlpha = 0.82; glow = 0.12; }

                    if (this.skillPulse[node.id] > 0) {
                        let pr = this.skillPulse[node.id];
                        ctx.save(); ctx.strokeStyle = `rgba(${baseCol[0]},${baseCol[1]},${baseCol[2]},${pr})`; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.arc(p.cx, p.cy, nodeR + (1 - pr) * 24, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
                        this.skillPulse[node.id] = Math.max(0, pr - 0.04);
                    }
                    // glow
                    ctx.save();
                    for (let i = 5; i >= 1; i--) {
                        ctx.fillStyle = `rgba(${ringCol[0]},${ringCol[1]},${ringCol[2]},${0.05 * glow * i * ringAlpha})`;
                        ctx.beginPath(); ctx.arc(p.cx, p.cy, nodeR + 2 + i * 2.2, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.restore();
                    // body — opaque dark base so connectors/glow don't bleed through and symbols stay clear
                    ctx.save(); ctx.globalAlpha = ringAlpha;
                    ctx.beginPath(); ctx.arc(p.cx, p.cy, nodeR, 0, Math.PI * 2);

                    this.orbitalStrikeSequence.usedTargets.push({row: target.row, col: target.col});

                    let centerBiasCol = Math.floor(COLS/2) + Math.floor((Math.random() - 0.5) * COLS * 0.6);
                    let centerBiasRow = Math.floor(ROWS/2) + Math.floor((Math.random() - 0.5) * ROWS * 0.6);
                    x = gridX + (centerBiasCol + 0.5) * CELL;
                    y = (centerBiasRow + 0.5) * CELL;

                this.orbitalStrikeEffects.push(new OrbitalStrikeEffect(x, y, this));

                this.orbitalStrikeSequence.strikesRemaining--;

                if (this.orbitalStrikeSequence.strikesRemaining > 0) {

            findSmartStrikeTarget(usedTargets = []) {
                // Helper function to check if a target is already used
                const isTargetUsed = (row, col) => {
                    return usedTargets.some(used => used.row === row && used.col === col);
                };
                
                // First, collect all potential targets
                const blockTargets = [];
                const highPriorityEnemyTargets = []; // Enemies above row 15
                const lowPriorityEnemyTargets = []; // Enemies at row 15 or below
                let totalBlocksOnBoard = 0;
                
                // Collect block targets
                for (let row = 1; row < ROWS; row++) { // Skip only row 0 (spawn area)
                    for (let col = 0; col < COLS; col++) {
                        if (this.board[row][col] !== null) {
                            totalBlocksOnBoard++; // Count all blocks
                            if (!isTargetUsed(row, col)) {
                                blockTargets.push({row: row, col: col, type: 'block'});
                            }
                        }
                    }
                }
                
                // Collect enemy targets and categorize by priority
                if (this.enemies) {
                    for (let enemy of this.enemies) {
                        if (enemy.hp > 0) {
                            // Get enemy's current position and convert to grid coordinates
                            let [ex, ey] = enemy.getPositionAtMs(Date.now());
                            const col = Math.floor((ex - LEFT_PANEL_WIDTH) / CELL);
                            const currentRow = Math.floor(ey / CELL);
                            // Target one tile above current position to account for upward movement
                            const targetRow = currentRow - 1;
                            
                            if (targetRow >= 0 && targetRow < ROWS && col >= 0 && col < COLS && !isTargetUsed(targetRow, col)) {
                                if (targetRow < 15) {
                                    // High priority: enemies above row 15
                                    highPriorityEnemyTargets.push({row: targetRow, col: col, type: 'enemy'});
                                } else {
                                    // Low priority: enemies at row 15 or below
                                    lowPriorityEnemyTargets.push({row: targetRow, col: col, type: 'enemy'});
                                }
                            }
                        }
                    }
                }
                
                // Priority 1: Target high-priority enemies (above row 15) first
                if (highPriorityEnemyTargets.length > 0) {
                    // Sort by row (ascending) to prioritize highest enemies (lowest row numbers)
                    highPriorityEnemyTargets.sort((a, b) => a.row - b.row);
                    const selected = highPriorityEnemyTargets[0]; // Always select the highest enemy
                    return selected;
                }
                
                // Priority 2: Target blocks if no high-priority enemies
                // Sort block targets by density (prefer areas with more blocks)
                blockTargets.sort((a, b) => {
                    let densityA = 0, densityB = 0;
                    
                    // Count neighboring blocks for each target
                    for (let dy = -1; dy <= 1; dy++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            let checkRowA = a.row + dy;
                            let checkColA = a.col + dx;
                            if (checkRowA >= 0 && checkRowA < ROWS && 
                                checkColA >= 0 && checkColA < COLS && 
                                this.board[checkRowA][checkColA] !== null) {
                                densityA++;
                            }
                            
                            let checkRowB = b.row + dy;
                            let checkColB = b.col + dx;
                            if (checkRowB >= 0 && checkRowB < ROWS && 
                                checkColB >= 0 && checkColB < COLS && 
                                this.board[checkRowB][checkColB] !== null) {
                                densityB++;
                            }
                        }
                    }
                    
                    return densityB - densityA; // Higher density first
                });
                
                if (blockTargets.length > 0) {
                    const selected = blockTargets[Math.floor(Math.random() * blockTargets.length)];
                    return selected;
                }
                
                // Priority 3: Target low-priority enemies (at row 15 or below) as last resort
                if (lowPriorityEnemyTargets.length > 0) {
                    const selected = lowPriorityEnemyTargets[Math.floor(Math.random() * lowPriorityEnemyTargets.length)];
                    return selected;
                }
                
                // Priority 4: No valid targets found, return null for random targeting
                return null;
            }

scarCount(id) { return this.scars ? this.scars.filter(s => s === id).length : 0; }

// Damage multiplier from run mods (draft cards) + scars. Applied to every weapon hit.
nemDamageMult(e, weapon) {
    let m = 1;
    if (this.runMods) {
        if (this.runMods.glass) m *= 1.6;                                          // Glass Cannon
        if (this.runMods.siege > 0 && weapon === 'mortar') m *= 1 + 0.5 * this.runMods.siege; // Siege Mortars
    }
    if (e && e.nemBoss && this.reactiveWeapon === weapon) {
        let rp = this.scarCount('reactive');                                       // Reactive Plating scar
        if (rp > 0) m *= Math.pow(0.7, rp);
    }
    return m;
}
