plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ipcam'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ipcam"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def cameraxVersion = "1.3.4"

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.annotation:annotation-experimental:1.4.1'

    // LifecycleService lets the foreground service own the camera binding,
    // so streaming survives the Activity being backgrounded.
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'

    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
}
