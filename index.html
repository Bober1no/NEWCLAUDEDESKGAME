<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SALT LINE</title>
<meta name="description" content="A walk out along the pans. A first-person horror game that runs from a file.">
<link rel="stylesheet" href="css/ui.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2305070b'/><rect x='4' y='3' width='8' height='11' fill='none' stroke='%23d8dcd2'/><rect x='9' y='8' width='1' height='1' fill='%23b4462a'/></svg>">
</head>
<body>

<canvas id="salt" tabindex="0"></canvas>
<div id="boot"><span>lighting the lamp</span></div>

<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
              background:#05070b;color:#7c8c93;letter-spacing:.3em;font-size:12px">
    SALT LINE NEEDS JAVASCRIPT
  </div>
</noscript>

<!--
  Classic script tags, in dependency order. No modules: `import` is blocked on
  file:// and this game is meant to run by double-clicking index.html. Nothing
  is fetched at runtime either -- every texture, sound, glyph and level is
  generated in code.
-->

<!-- core -->
<script src="js/core/namespace.js"></script>
<script src="js/core/math.js"></script>
<script src="js/core/loop.js"></script>
<script src="js/core/input.js"></script>

<!-- graphics -->
<script src="js/gfx/palette.js"></script>
<script src="js/gfx/framebuffer.js"></script>
<script src="js/gfx/textures.js"></script>
<script src="js/gfx/glyphs.js"></script>
<script src="js/gfx/raycaster.js"></script>
<script src="js/gfx/sprites.js"></script>
<script src="js/gfx/volumetrics.js"></script>
<script src="js/gfx/reflection.js"></script>
<script src="js/gfx/postfx.js"></script>

<!-- world -->
<script src="js/world/ledger.js"></script>
<script src="js/world/names.js"></script>
<script src="js/world/door.js"></script>
<script src="js/world/props.js"></script>
<script src="js/world/generator.js"></script>
<script src="js/world/tide.js"></script>

<!-- entities -->
<script src="js/entities/base.js"></script>
<script src="js/entities/tally.js"></script>
<script src="js/entities/assessor.js"></script>
<script src="js/entities/comber.js"></script>
<script src="js/entities/dragger.js"></script>
<script src="js/entities/choir.js"></script>
<script src="js/entities/understudy.js"></script>
<script src="js/entities/director.js"></script>

<!-- audio -->
<script src="js/audio/synth.js"></script>
<script src="js/audio/soundbank.js"></script>
<script src="js/audio/music.js"></script>

<!-- game -->
<script src="js/game/name.js"></script>
<script src="js/game/state.js"></script>
<script src="js/game/hud.js"></script>
<script src="js/game/menu.js"></script>
<script src="js/gfx/renderer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
