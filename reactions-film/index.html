<!doctype html>
<!--
  THE REACTIONS FILM · a self-playing chemistry documentary (Year 10 chemical reactions unit)

  ASSETS (every file shipped in assets/, loaded by relative path, nothing fetched from asset sites at runtime)
  - assets/hdri/lab.exr     "lab" interior HDRI. Original: Poly Haven (polyhaven.com), CC0 1.0.
                            Repackaged (512 px, DWAB-compressed EXR) in @pmndrs/assets 1.7.0 by Poimandres, CC0-1.0.
                            https://www.npmjs.com/package/@pmndrs/assets
  - assets/hdri/studio.exr  "studio" softbox HDRI. Original: Poly Haven, CC0 1.0. Same repackaging as above.
  - assets/fonts/inter_black_subset.json  Inter Black by Rasmus Andersson, SIL Open Font License 1.1,
                            typeface JSON from @pmndrs/assets 1.7.0, subset to A–Z, 0–9.
  3D models (all CC-BY-4.0, credited here and in the end credits; fetched from pinned GitHub commits by
  test/build-assets.mjs, rescaled to metres, textures → WebP, geometry meshopt-compressed; glass and metal
  materials replaced at runtime with the film's borosilicate / steel / cast-iron recipes):
  - assets/models/bunsen.glb   "Bunsen Burner" by Dreamsoft Innovations Private Limited
                               https://sketchfab.com/3d-models/bunsen-burner-5185e41b2beb48fa8f15ca3707f43e10
                               via github.com/mucel29/chemistry @11c09bc
  - assets/models/tripod.glb   "Tripod stand" by AmirulIqwan
                               https://sketchfab.com/3d-models/tripod-stand-c2773043c472429c86b4ee3b28f9b156
                               via github.com/mucel29/chemistry @11c09bc
  - assets/models/retort.glb   "Burette stand" by VeeRuby Technologies Pvt Ltd
                               https://sketchfab.com/3d-models/burette-stand-9d204d9be6744ea1a491bd152c61228f
                               via github.com/Visuals-Smart-Tech/chem-quest-lab-adventures-main @e3236ab
  - assets/models/burette.glb  "Burette" by 3dLabWare
                               https://sketchfab.com/3d-models/burette-4bb5f945638a46ba9ea5684d0f38ebad
                               via github.com/Visuals-Smart-Tech/chem-quest-lab-adventures-main @e3236ab
  Licence: https://creativecommons.org/licenses/by/4.0/
  Procedural (no properly licensed model found): digital balance, safety goggles, dropper bottles, tongs,
  wire gauze, all beakers / flasks / tubes / cylinders, the bench and the room
  (LatheGeometry + MeshPhysicalMaterial, canvas-generated colour / roughness / normal maps).
  Poly Haven, ambientCG, Sketchfab, Kenney and OpenGameArt themselves are blocked by the build sandbox.
  three.js r160 (MIT) is loaded from jsDelivr.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Reactions Film</title>
<meta name="description" content="A self-playing, macro-lens chemistry documentary covering chemical reactions, with freeze-frame recall and a final exam.">
<meta name="theme-color" content="#05070B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,500..900;1,62..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/film.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="film" class="booting">
  <div id="picture">
    <canvas id="gl" aria-label="Film picture"></canvas>
    <div id="fallbackBg" hidden></div>
  </div>
  <div id="vignette"></div>
  <canvas id="grain" aria-hidden="true"></canvas>
  <div id="captions" aria-live="polite"></div>
  <div id="hud"></div>
  <div id="dip"></div>
  <div id="flash"></div>
  <div id="glyph" aria-hidden="true"><i></i></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="overlay" hidden></div>
  <div id="toast" role="status"></div>
  <div id="notice" hidden></div>

  <header class="bar top">
    <div class="ttl"><span class="logo">⚗</span><b>The Reactions Film</b></div>
    <div class="rec"><i class="dot"></i><span id="recLabel">REEL 00</span></div>
  </header>
  <footer class="bar bottom">
    <button id="play" class="pp" aria-label="Play or pause"><i></i></button>
    <div id="timeline" class="tl" role="group" aria-label="Timeline"></div>
    <span id="tc" class="tc">00:00 / 00:00</span>
    <div class="ctl">
      <button id="speed" class="chip" title="Playback speed">1×</button>
      <button id="quality" class="chip" title="Render quality">ULTRA</button>
      <button id="motion" class="chip" title="Motion effects">Motion: on</button>
    </div>
  </footer>
  <div id="loader"><div class="ld"><b>THE REACTIONS FILM</b><span id="ldMsg">Warming up the Bunsen…</span><i><em id="ldBar"></em></i></div></div>
</div>
<script>
  // If the module graph can't even start (old browser, blocked module), main.js never sets this.
  window.addEventListener('error', function (e) { window.__bootErr = window.__bootErr || (e && e.message); });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
